  <text x="450" y="85" font-size="15" font-weight="bold" fill="#334155">Servidor Central</text>
  <text x="450" y="115" font-size="12" fill="#62646e">• Sistema NOS</text>
  <text x="450" y="140" font-size="12" fill="#62646e">• Base de datos</text>
  <text x="450" y="165" font-size="12" fill="#62646e">• Servicios centralizados</text>
</svg><figcaption>Esquema conceptual del modelo Cliente-Servidor con servidor central dedicado y terminales clientes.</figcaption></figure>
<h3>Arquitectura Cliente-Servidor en redes corporativas</h3>
<p>En el modelo Cliente-Servidor, que es el más utilizado en Internet y redes empresariales, existen uno o más equipos que centralizan los servicios de red.</p>
<p>El cliente es el equipo terminal que requiere el recurso o servicio, como un computador que solicita una página web o un archivo de base de datos.</p>
<p>El servidor es el equipo de alto rendimiento que provee el servicio solicitado a múltiples clientes de manera simultánea.</p>
<p>Normalmente los servidores tienen instalado un sistema operativo especializado (NOS, Network Operating System) para gestionar accesos, seguridad y permisos.</p>
<p>Entre los servicios más comunes en una red de datos corporativa se encuentran servidores de correo electrónico, archivos, bases de datos e impresión.</p>
<p>Este modelo permite aplicar políticas de seguridad centralizadas, copias de respaldo automatizadas y control de acceso riguroso para todos los usuarios.</p>
<table>
<thead><tr><th>Característica</th><th>Modelo Cliente-Servidor</th><th>Modelo Punto a Punto (P2P)</th></tr></thead>
<tbody>
<tr><td>Control y gestión</td><td>Centralizado en servidores dedicados bajo sistemas NOS.</td><td>Descentralizado entre todos los equipos terminales pares.</td></tr>
<tr><td>Consumo de recursos</td><td>Concentrado en hardware de servidor de alta capacidad.</td><td>Alto consumo de memoria y procesamiento en cada equipo.</td></tr>
<tr><td>Seguridad y permisos</td><td>Administración centralizada de usuarios, claves y accesos.</td><td>Difícil de controlar; cada usuario administra sus recursos.</td></tr>
<tr><td>Escalabilidad</td><td>Muy alta, soporta cientos de terminales simultáneos.</td><td>Baja, adecuada únicamente para oficinas muy pequeñas.</td></tr>
<tr><td>Ejemplo en terreno</td><td>Servidor de base de datos o portal web corporativo.</td><td>Compartir una carpeta de archivos o una impresora local.</td></tr>
</tbody>
</table>
<figure class="esquema"><svg viewBox="0 0 640 250" role="img" aria-label="Modelo de comunicación Punto a Punto P2P entre estaciones pares">
  <rect x="40" y="50" width="160" height="130" rx="6" fill="#fde7b0" stroke="#f0a500" stroke-width="2"/>

  <text x="60" y="115" font-size="12" fill="#334155">• Cliente de archivos</text>
  <text x="60" y="140" font-size="12" fill="#334155">• Servidor de datos</text>
  <PATH d="M210 100 L420 100" stroke="#f0a500" stroke-width="2"/>
  <POLYGON points="425,100 415,95 415,105" fill="#f0a500"/>
  <POLYGON points="205,100 215,95 215,105" fill="#f0a500"/>
  <text x="250" y="85" font-size="12" fill="#e08a00">Intercambio Bidireccional</text>
  <text x="260" y="125" font-size="12" fill="#62646e">Sin servidor central</text>
  <rect x="440" y="50" width="160" height="130" rx="6" fill="#fde7b0" stroke="#f0a500" stroke-width="2"/>
  <text x="460" y="85" font-size="14" font-weight="bold" fill="#e08a00">Estación B (Par)</text>
  <text x="460" y="115" font-size="12" fill="#334155">• Servidor impresión</text>
  <text x="460" y="140" font-size="12" fill="#334155">• Cliente de datos</text>
</svg><figcaption>Esquema de comunicación directa entre computadores en el modelo Punto a Punto P2P sin servidor central.</figcaption></figure>
<h3>Modelo Punto a Punto y flujo de datos</h3>
<p>En el modelo punto a punto (P2P, Peer to Peer o comunicación entre pares), no existen servidores dedicados exclusivos.</p>
<p>Cada computador conectado puede actuar como cliente y como servidor simultáneamente, compartiendo recursos de forma directa con los demás nodos.</p>
<p>Un computador puede compartir una carpeta de documentos o una impresora conectada localmente para que otros equipos de la oficina puedan imprimir.</p>
<p>El modelo P2P tiene la gran desventaja de que requiere más recursos de hardware en cada terminal, dado que los equipos atienden peticiones mientras los usuarios trabajan.</p>
<p>Cuando un cliente solicita datos a un servidor, el mensaje viaja encapsulado desde la capa de aplicación hasta las tramas físicas del medio de transmisión.</p>
<p>El router corporativo analiza las direcciones de destino en los encabezados de los paquetes para reenviarlos por la ruta más eficiente de la red.</p>
<div class="tip">
<h4>Para entenderlo</h4>
<p>En una red de computadores existe sólo una impresora, el computador que tiene la impresora la comparte en red.</p>
<p>El computador se encarga de administrar el trabajo de impresión y es el dueño del servicio en la red local.</p>
<p>El servidor puede denegar el servicio a quién quiera, ya sea usando el nombre de usuario o por dirección IP.</p>
<p>En una red peer to peer no se puede actuar sobre el servicio porque no existe un servidor central dedicado.</p>
</div>
<h3>En terreno</h3>
<p>En terreno, el técnico atiende requerimientos de red donde los usuarios reportan que no pueden acceder a los servicios compartidos.</p>
<p>Al revisar la red, comprueba que las estaciones de trabajo navegan correctamente en Internet, lo que descarta una falla física en el cableado local.</p>
<p>El técnico realiza pruebas hacia la dirección IP del servidor central de aplicaciones para verificar el estado de los servicios de red.</p>
<p>Gracias a este diagnóstico, informa al administrador de sistemas que la incidencia radica en el servidor central y no en los routers de acceso de la sede.</p>
<h3>Resumen</h3>
<ul>
<li>El modelo Cliente-Servidor centraliza aplicaciones y archivos en servidores dedicados bajo sistemas operativos NOS.</li>
<li>El modelo P2P permite compartir recursos de forma directa entre terminales, pero consume más recursos en cada máquina.</li>
<li>Las redes corporativas utilizan esquemas centralizados para garantizar seguridad, respaldo continuo y alta escalabilidad.</li>
<li>Diferenciar el rol de clientes y servidores acelera el diagnóstico de fallas al aislar problemas locales de problemas de servidor.</li>
</ul>`

        min: 10,
        html: `<h3>¿Para qué te sirve?</h3>
<p>La dirección de Protocolo de Internet (IP) es el identificador numérico que permite ubicar a cada dispositivo y enrutar los paquetes a través de las redes corporativas.</p>
<p>Configurar correctamente la IP y la máscara de red asegura que el equipamiento del cliente acceda a Internet y a las sucursales remotas sin conflictos.</p>
<p>Sin una máscara de subred adecuada en la red de área local (LAN), el router no puede determinar si un paquete debe entregarse dentro de la oficina local o enviarse hacia la red externa.</p>
<p>Dominar el direccionamiento en clases y los bloques privados permite configurar routers, tarjetas de red de prueba y servidores corporativos en terreno.</p>
<figure class="esquema"><svg viewBox="0 0 640 250" role="img" aria-label="Estructura de una dirección IPv4 dividida en octetos decimales y bits">

</svg><figcaption>Estructura de una dirección IPv4 de 32 bits dividida en cuatro octetos decimales y formato de máscara.</figcaption></figure>
<h3>Estructura de IPv4 y clasificación de direcciones</h3>
<p>Una dirección de Protocolo de Internet versión 4 (IPv4, Internet Protocol versión 4) tiene un formato de 32 bits, representado como cuatro números decimales separados por puntos (ejemplo: 192.168.0.1).</p>
<p>El rango total de IPv4 comprende todas las direcciones posibles con un espacio de aproximadamente 4.3 mil millones de direcciones únicas.</p>
<p>La Corporación para la Asignación de Nombres y Números de Internet (ICANN, Internet Corporation for Assigned Names and Numbers) y la Autoridad de Asignación de Números de Internet (IANA, Internet Assigned Numbers Authority) coordinan estos identificadores exclusivos en todo el mundo.</p>
<p>Las direcciones se clasifican en públicas, que son únicas en Internet, y privadas, utilizadas dentro de redes locales (LAN) que no son enrutables en Internet y requieren Traducción de Direcciones de Red (NAT, Network Address Translation) para comunicarse con el exterior.</p>
<h3>Rangos de direcciones IP privadas en empresas</h3>
<p>Las direcciones privadas son utilizadas dentro de redes locales y no son enrutables en Internet, requiriendo NAT para comunicarse con redes externas mediante prefijos CIDR (Classless Inter-Domain Routing) estandarizados:</p>
<table>
<thead><tr><th>Clase</th><th>Rango de Direcciones IP</th><th>Prefijo CIDR</th><th>Número de Direcciones y Uso Común</th></tr></thead>
<tbody>
<tr><td>Clase A</td><td>10.0.0.0 a 10.255.255.255</td><td>10.0.0.0/8</td><td>Más de 16 millones de direcciones, ideal para redes grandes de organizaciones.</td></tr>
<tr><td>Clase B</td><td>172.16.0.0 a 172.31.255.255</td><td>172.16.0.0/12</td><td>Más de 1 millón de direcciones, adecuado para redes de tamaño mediano a grande.</td></tr>
<tr><td>Clase C</td><td>192.168.0.0 a 192.168.255.255</td><td>192.168.0.0/16</td><td>Más de 65,000 direcciones para redes domésticas y pequeñas oficinas.</td></tr>
</tbody>
</table>
<p>Además de la dirección IP y la máscara, cada equipo requiere configurar la puerta de enlace y el sistema de nombres de dominio (DNS) para resolver servicios en internet.</p>

<h3>Ejemplo resuelto de aplicación de máscara de subred</h3>
<p>En una subred corporativa, la dirección de red es el resultado de aplicar una operación lógica entre la dirección IP y la máscara asignada.</p>
<p>Por lo tanto, la porción de red inicial identifica la subred corporativa a la que pertenece el enlace del cliente.</p>
<p>La dirección de broadcast tiene todos los bits del host en uno para permitir la comunicación hacia todos los dispositivos de la subred.</p>
<p>Las direcciones asignables para los terminales del cliente quedan comprendidas entre la red más uno y el broadcast menos uno.</p>
<p>El sistema de nombres de dominio (DNS, Domain Name System) convierte nombres de dominio fáciles de recordar en direcciones IP numéricas.</p>
<p>El protocolo de Internet versión 6 (IPv6) está diseñado para resolver los problemas de la versión anterior en relación con el agotamiento de direcciones.</p>
<div class="tip">
<h4>Para entenderlo</h4>
<p>Una dirección IP con su máscara funciona exactamente como una dirección postal de una casa en una ciudad.</p>
<p>La máscara delimita qué parte de la dirección corresponde al nombre de la calle (la red) y qué parte al número específico de la casa (el host).</p>
<p>Los routers y switches utilizan las direcciones IP para decidir cómo enrutar los datos al destino correcto en la red.</p>
<p>Pero si el destinatario vive en otra calle o ciudad diferente, el paquete debe enviarse a la oficina de correos central o puerta de enlace para su transporte.</p>

<h3>En terreno</h3>

<p>El técnico configura una dirección estática asignada manualmente que no cambia con el tiempo para gestionar el dispositivo.</p>
<p>Verifica que la puerta de enlace predeterminada apunte a la puerta de enlace corporativa del router para asegurar comunicación bidireccional inmediata.</p>
<p>Al aplicar estos parámetros, comprueba que su terminal intercambia paquetes sin errores y accede a la consola de administración del router.</p>
<h3>Resumen</h3>
<ul>
<li>Una dirección IPv4 consta de 32 bits divididos en cuatro octetos decimales de red y host.</li>
<li>La máscara de subred delimita con precisión qué porción de la IP identifica a la red y cuál al terminal host.</li>
<li>Los rangos privados (10.x, 172.16-31.x y 192.168.x) se utilizan en redes corporativas internas sin enrutamiento público directo.</li>
<li>El sistema DNS convierte nombres de dominio fáciles de recordar en direcciones IP, mientras IPv6 utiliza un formato de 128 bits.</li>
</ul>`

<h3>Clasificación de redes según alcance geográfico</h3>
<p>Una Red de Área Local (LAN, Local Area Network) agrupa computadoras y periféricos en un área limitada como una oficina o edificio corporativo.</p>
<p>Una Red de Área Metropolitana (MAN, Metropolitan Area Network) interconecta múltiples edificios, sucursales y centros de datos dentro de una misma ciudad.</p>
<p>Una Red de Área Amplia (WAN, Wide Area Network) interconecta redes locales y metropolitanas a través de regiones, países o a nivel mundial.</p>
<p>Las empresas contratan enlaces con un proveedor de servicios de Internet (ISP, Internet Service Provider) para unir sus redes locales con la WAN global.</p>
<table>
<thead><tr><th>Tipo de Red</th><th>Alcance Geográfico</th><th>Velocidad Típica</th><th>Propiedad y Administración</th></tr></thead>

<tr><td>LAN</td><td>Oficina, piso o edificio corporativo único.</td><td>100 Mbps a 10 Gbps</td><td>Infraestructura privada del cliente corporativo.</td></tr>
<tr><td>MAN</td><td>Comuna, ciudad o área metropolitana interconectada.</td><td>1 Gbps a 100 Gbps</td><td>Red MAN metropolitana que interconecta redes LAN.</td></tr>
<tr><td>WAN</td><td>Nacional o internacional entre ciudades distantes.</td><td>Variable según enlace</td><td>Proveedores de telecomunicaciones e Internet global.</td></tr>
</tbody>
</table>

<h3>Protocolo PPPoE y autenticación de acceso</h3>
<p>En redes corporativas se utiliza ampliamente el protocolo punto a punto sobre Ethernet (PPPoE, Point-to-Point Protocol over Ethernet) para enlaces de acceso.</p>
<p>Esta tecnología encapsula tramas del protocolo punto a punto dentro de tramas Ethernet para autenticar usuarios y asignar parámetros IP dinámicos o estáticos.</p>
<p>La autenticación se realiza típicamente mediante el protocolo de autenticación por desafío mutuo (CHAP, Challenge Handshake Authentication Protocol).</p>
<p>El protocolo CHAP valida las credenciales de conexión entre el router cliente y el concentrador del proveedor sin transmitir contraseñas en texto plano.</p>
<p>El técnico ingresa comandos mediante la interfaz de línea de comandos (CLI, Command Line Interface) en consolas Cisco o Huawei.</p>
<pre><code>interface GigabitEthernet0/0/0
 encapsulation ppp
 ppp chap hostname usuario@isp
 ppp chap password contraseña
 ip address dhcp
 no shutdown</code></pre>
<table>
<thead><tr><th>Comando CLI Cisco</th><th>Qué hace en el router corporativo</th></tr></thead>
<tbody>
<tr><td>interface GigabitEthernet0/0/0</td><td>Ingresa al modo de configuración de la interfaz física conectada al enlace WAN del proveedor.</td></tr>
<tr><td>encapsulation ppp</td><td>Habilita el protocolo de encapsulación punto a punto sobre la interfaz física Ethernet.</td></tr>
<tr><td>ppp chap hostname usuario@isp</td><td>Configura el nombre de usuario asignado por el proveedor para la autenticación de la sesión.</td></tr>
<tr><td>ppp chap password contraseña</td><td>Define la contraseña secreta para el proceso de validación por desafío mutuo CHAP.</td></tr>
<tr><td>ip address dhcp</td><td>Indica a la interfaz que solicite su dirección IP y máscara al concentrador del proveedor.</td></tr>
<tr><td>no shutdown</td><td>Activa operativamente la interfaz de red para iniciar la transmisión y recepción de datos.</td></tr>
</tbody>
</table>
<p>En routers de plataforma Huawei, la activación de la sesión y el levantamiento de la interfaz se ejecutan con sintaxis equivalente:</p>
<pre><code>interface GigabitEthernet0/0/0
 pppoe enable
 pppoe username usuario@isp
 pppoe password contraseña
 ip address dhcp
 undo shutdown</code></pre>
<table>
<thead><tr><th>Comando CLI Huawei</th><th>Qué hace en el router corporativo</th></tr></thead>
<tbody>
<tr><td>interface GigabitEthernet0/0/0</td><td>Selecciona la interfaz GigabitEthernet para la configuración del enlace de acceso corporativo.</td></tr>
<tr><td>pppoe enable</td><td>Habilita el cliente PPPoE para encapsular el tráfico de datos sobre la interfaz física.</td></tr>
<tr><td>pppoe username usuario@isp</td><td>Asigna las credenciales de usuario provistas por el operador para establecer el túnel.</td></tr>
<tr><td>pppoe password contraseña</td><td>Configura la contraseña de autenticación para la sesión remota en el concentrador.</td></tr>
<tr><td>ip address dhcp</td><td>Solicita la dirección IP de acceso y parámetros de red al servidor central de enrutamiento.</td></tr>
<tr><td>undo shutdown</td><td>Enciende la interfaz física para negociar el enlace con el conmutador del proveedor.</td></tr>
</tbody>
</table>
<div class="tip">
<h4>Para entenderlo</h4>
<p>Establecer una conexión sobre Ethernet requiere autenticar la sesión como en una caseta de control.</p>
<p>La infraestructura de red Ethernet es abierta pero para establecer conexión a Internet se requiere un nombre de usuario y contraseña.</p>
<p>Una vez validadas las credenciales ante el proveedor, el enlace de datos queda autenticado para transmitir tráfico sobre la sesión establecida.</p>
</div>
<h3>En terreno</h3>
<p>El técnico conecta su consola de administración al puerto del router corporativo en la sede del cliente para configurar un nuevo enlace de respaldo.</p>
<p>Ingresa a la interfaz GigabitEthernet0/0/0, configura las credenciales de acceso PPPoE y ejecuta el comando de activación del puerto.</p>
<p>Verifica mediante comandos de estado que la interfaz cambie a estado operativo up y que el concentrador del proveedor asigne la dirección IP correspondiente.</p>
<p>Finalmente, realiza una prueba de ping hacia la puerta de enlace del proveedor para certificar que el túnel de datos transporta tráfico sin pérdidas.</p>
<h3>Resumen</h3>
<ul>
<li>Las redes se clasifican geográficamente en locales (LAN), metropolitanas (MAN) y de área amplia (WAN).</li>
<li>El protocolo PPPoE encapsula sesiones autenticadas sobre medios físicos Ethernet para conectar clientes al proveedor ISP.</li>
<li>La autenticación CHAP valida las credenciales de conexión de forma periódica y segura sin exponer contraseñas.</li>
<li>La configuración mediante comandos CLI en Cisco y Huawei permite activar interfaces y verificar la asignación IP en terreno.</li>
</ul>`

<p>El valor del RSSI (Received Signal Strength Indicator, indicador de fuerza de señal recibida) es una métrica fundamental para el diagnóstico y la evaluación del rendimiento de una red inalámbrica Wi-Fi en terreno.</p>
<p>Un técnico capacitado debe saber interpretar los valores de potencia recibida en decibelios milivatio para ubicar estratégicamente los puntos de acceso.</p>
<p>Identificar fuentes de interferencia electromagnética y seleccionar las bandas de frecuencia correctas asegura un rendimiento óptimo de la red empresarial.</p>

<h3>Evolución de WiFi según estándares de redes inalámbricas</h3>
<p>Las redes inalámbricas de área local (WLAN, Wireless Local Area Network) se basan en normas del instituto de ingenieros (IEEE, Institute of Electrical and Electronics Engineers).</p>
<p>La tecnología Wi-Fi utiliza ondas de radio electromagnéticas en el espectro de 2,4 gigahercios (GHz) y 5 GHz para conectar computadoras a la red local sin cables.</p>
<p>La banda de 2.4 GHz ofrece mayor alcance que 802.11a pero menor velocidad y genera más interferencias.</p>
<p>La banda de 5 GHz ofrece mejor rendimiento en redes congestionadas pero menor alcance debido a la frecuencia más alta.</p>
<table>
<thead><tr><th>Estándar IEEE</th><th>Frecuencia Operativa</th><th>Ancho de Canal Típico</th><th>Velocidad Máxima Teórica</th></tr></thead>
<tbody>
<tr><td>IEEE 802.11a</td><td>5 GHz</td><td>20 MHz</td><td>Hasta 54 Mbps en entornos sin interferencias.</td></tr>
<tr><td>IEEE 802.11b</td><td>2.4 GHz</td><td>20 MHz</td><td>Hasta 11 Mbps con modulación básica directa.</td></tr>
<tr><td>IEEE 802.11g</td><td>2.4 GHz</td><td>20 MHz</td><td>Hasta 54 Mbps con multiplexación por división de frecuencias.</td></tr>
<tr><td>IEEE 802.11n (Wi-Fi 4)</td><td>2.4 GHz y 5 GHz</td><td>20 y 40 MHz</td><td>Velocidad máxima hasta 600 Mbps con tecnología de doble banda y múltiples antenas.</td></tr>
<tr><td>IEEE 802.11ac (Wi-Fi 5)</td><td>5 GHz</td><td>Hasta 160 MHz</td><td>Altas tasas de transferencia para datos masivos.</td></tr>
<tr><td>IEEE 802.11ax (Wi-Fi 6)</td><td>2.4 GHz, 5 GHz y 6 GHz</td><td>Hasta 160 MHz</td><td>Velocidad máxima hasta 9,6 Gbps con modulación de alta densidad 1024-QAM en entornos densos.</td></tr>
</tbody>
</table>
<h3>Puntos de acceso, nombres de red y niveles de señal</h3>
<p>Para configurar una red inalámbrica, el administrador necesita instalar puntos de acceso inalámbrico.</p>
<p>El punto de acceso se configura para transmitir el identificador de conjunto de servicios (SSID, Service Set Identifier), que es el nombre público de la red Wi-Fi.</p>
<p>La intensidad de la señal recibida se mide mediante el indicador de nivel de señal (RSSI, Received Signal Strength Indicator) expresado en valores negativos de dBm.</p>
<p>Dado que la escala de dBm representa potencias inferiores a un milivatio, un valor numérico más cercano a cero indica una señal más fuerte y nítida.</p>

<h3>Arquitectura Ethernet y capas del modelo de interconexión</h3>
<p>La tecnología Ethernet opera bajo protocolos que describen cómo los dispositivos de red formatean y transmiten datos a través de un cableado físico.</p>
<p>Ethernet opera en las dos primeras capas del modelo de interconexión de sistemas abiertos (OSI, Open Systems Interconnection): la capa física y la capa de enlace de datos.</p>
<p>En la capa física se regulan las señales eléctricas y ópticas sobre cables de pares trenzados de cobre y conectores modulares de red.</p>
<p>En la capa de enlace de datos, la información se encapsula en tramas estructuradas con campos específicos de control y direccionamiento.</p>
<table>
<thead><tr><th>Campo de la Trama Ethernet</th><th>Tamaño en Bytes</th><th>Función Técnica en la Red</th></tr></thead>
<tbody>
<tr><td>Preámbulo y Delimitador </td><td>8 bytes</td><td>Sincroniza los relojes de transmisión entre las tarjetas de red emisor y receptor.</td></tr>
<tr><td>Dirección MAC de destino</td><td>6 bytes</td><td>Identifica la dirección física de la estación receptora que debe procesar la trama.</td></tr>
<tr><td>Dirección MAC de origen</td><td>6 bytes</td><td>Identifica la dirección física de la estación emisora que genera los datos.</td></tr>
<tr><td>Longitud o Tipo (EtherType)</td><td>2 bytes</td><td>Indica la cantidad de bytes o el protocolo de nivel superior transportado (como IPv4 o IPv6).</td></tr>
<tr><td>Carga útil (Datos y Relleno)</td><td>64 a 1500 bytes</td><td>El campo de datos lleva entre 64 a 1500 bytes y se añade relleno en caso de que los datos no alcancen los 64 bytes.</td></tr>
<tr><td>Control de redundancia (CRC)</td><td>4 bytes</td><td>Secuencia de verificación de redundancia cíclica para comprobar que la trama llegue sin errores.</td></tr>
</tbody>
</table>

<h3>Estructura de la dirección física MAC</h3>
<p>La dirección MAC es un número hexadecimal que identifica a una estación de manera única con dos partes principales.</p>
<p>Se representa comúnmente en formato de seis pares de dígitos hexadecimales separados por dos puntos o guiones, como por ejemplo 00:1A:2B:3C:4D:5E.</p>
<p>Las primeras 6 cifras identifican al fabricante del equipo y las otras 6 cifras corresponden a un número de serie.</p>
<p>Los tres bytes restantes corresponden al número de serie único asignado por el fabricante a la tarjeta física de red del equipo terminal.</p>
<table>
<thead><tr><th>Segmento de la Dirección MAC</th><th>Tamaño en Bits / Bytes</th><th>Responsable de Asignación y Propósito</th></tr></thead>
<tbody>
<tr><td>Identificador de Organización </td><td>3 bytes (fabricante)</td><td>Asignado por el IEEE a fabricantes de hardware como Cisco, Huawei o Intel.</td></tr>
<tr><td>Identificador de Tarjeta </td><td>3 bytes (fabricante)</td><td>Número de serie grabado de fábrica por el fabricante en el chip de la interfaz.</td></tr>
</tbody>
</table>
<h3>Negociación de velocidad dúplex y verificación CLI</h3>
<p>Las interfaces Ethernet pueden operar en modalidad semi dúplex (half duplex) o dúplex completo (full duplex).</p>
<p>En full duplex, la interfaz puede transmitir y recibir datos de manera simultánea a través de pares físicos independientes sin riesgo de colisiones.</p>
<p>En half duplex, la interfaz solo puede transmitir o recibir en un instante dado, utilizando mecanismos de detección de colisiones que reducen el rendimiento.</p>
<p>El técnico verifica el estado físico, los contadores de errores de trama y la negociación en routers mediante comandos de consola:</p>
<pre><code>show controllers GigabitEthernet0/0
duplex full
speed 100</code></pre>
<table>
<thead><tr><th>Comando CLI</th><th>Qué hace en el router corporativo</th></tr></thead>
<tbody>
<tr><td>show controllers GigabitEthernet0/0</td><td>Muestra información interna del hardware, estado del chip controlador y errores de capa física.</td></tr>
<tr><td>duplex full</td><td>Fuerza la operación en modo dúplex completo bidireccional simultáneo en el puerto de red.</td></tr>
<tr><td>speed 100</td><td>Forzado manual de velocidad a 100 Mbps en la interfaz GigabitEthernet del router.</td></tr>
</tbody>
</table>
<div class="tip">
<h4>Para entenderlo</h4>
<p>La dirección física MAC y la dirección lógica IP funcionan en conjunto como la cédula de identidad y la dirección de domicilio de una persona.</p>
<p>La dirección MAC es como un documento de identidad único de identidad: está grabada en el chip desde su fabricación y nunca cambia de un equipo a otro.</p>
<p>En cambio, la dirección IP es como la dirección de la casa u oficina donde vive la persona: cambia cada vez que el equipo se traslada a otra subred o ciudad.</p>
<p>Ethernet organiza los datos en tramas que incluyen información sobre el origen y el destino para identificar a qué dispositivo van dirigidos.</p>
</div>

<p>Revisa la negociación y descubre que el switch corporativo está fijado en full duplex pero el router cliente negoció erróneamente en half duplex.</p>
<p>El técnico configura manualmente la interfaz en full duplex, reemplaza el cable de par trenzado defectuoso y verifica que los errores CRC se detengan por completo.</p>
<h3>Resumen</h3>
<ul>
<li>Ethernet opera bajo el estándar de arquitectura en las capas física y de enlace de datos del modelo OSI.</li>
<li>La trama Ethernet incluye preámbulo, direcciones MAC de origen y destino, tipo de protocolo, datos y código de verificación CRC.</li>
<li>La dirección MAC es un identificador físico de 6 bytes compuesto por el código de fabricante y el número de serie de interfaz.</li>
<li>Configurar puertos en full duplex previene colisiones de paquetes y asegura el rendimiento óptimo del ancho de banda en la sede.</li>
</ul>`

        html: `<h3>¿Para qué te sirve?</h3>
<p>En la atención técnica a clientes corporativos, una red privada virtual (VPN, Virtual Private Network) crea una conexión de red privada entre dispositivos a través de Internet para transmitir datos de forma segura y anónima a través de redes públicas.</p>
<p>Dominar las redes privadas virtuales VPN, el protocolo Secure Shell (SSH) que permite la comunicación y el intercambio de datos de forma segura, y el registro de eventos Syslog te permite diagnosticar incidencias críticas en terreno.</p>
<p>Una falla en los túneles de cifrado interrumpe el acceso a los sistemas centrales y una configuración deficiente de acceso remoto deja desprotegido el equipamiento corporativo frente a intrusiones externas.</p>

<h3>Fundamentos de las Redes Privadas Virtuales</h3>
<p>Una red privada virtual establece una conexión lógica y cifrada sobre una infraestructura de red pública como Internet.</p>
<p>Esto permite que sedes geográficamente dispersas transmitan datos confidenciales con la misma privacidad y seguridad que si estuviesen conectadas mediante un circuito físico dedicado.</p>
<p>El tráfico de datos se encapsula y cifra mediante algoritmos matemáticos avanzados, de modo que cualquier tercero que intercepte los paquetes en tránsito solo observe cadenas cifradas e ininteligibles.</p>

<p>En entornos empresariales se implementan principalmente tres modalidades de redes privadas virtuales según la necesidad de la organización:</p>
<ul>
<li><strong>VPN de sitio a sitio:</strong> Conecta dos redes de área local completas a través de routers o cortafuegos perimetrales, como la comunicación permanente entre una sucursal corporativa y el centro de datos principal.</li>
<li><strong>VPN de acceso remoto o cliente a sitio:</strong> Permite que colaboradores móviles o trabajadores en teletrabajo se conecten de manera segura a la red interna corporativa mediante un software cliente instalado en sus computadores portátiles.</li>
<li><strong>VPN con capa de conexión segura ssl:</strong> Proporciona acceso cifrado a portales web y aplicaciones internas directamente desde el navegador web sin necesidad de instalar programas adicionales en el equipo del usuario.</li>
</ul>

<h3>Administración Remota Segura mediante SSH</h3>
<p>Para la configuración y monitoreo de los routers corporativos se utiliza el protocolo SSH a través del puerto (TCP) 22.</p>
<p>A diferencia de Telnet que transmite nombres de usuario y contraseñas en texto plano por el puerto 23, el protocolo SSH cifra toda la comunicación desde el inicio mediante criptografía y puerto 22.</p>
<p>El router autentica al técnico mediante credenciales locales o a través de servidores centralizados, garantizando que nadie pueda capturar las contraseñas en tránsito sobre la red.</p>

<p>Configuración de SSH en router Cisco según el estándar del manual técnico:</p>
<pre><code>Router(config)# ip domain-name miempresa.local
Router(config)# crypto key generate rsa
Router(config)# line vty 0 4
Router(config-line)# transport input ssh
Router(config-line)# exit</code></pre>

<table>
<thead><tr><th>Comando en Cisco</th><th>Qué hace</th></tr></thead>
<tbody>
<tr><td>ip domain-name miempresa.local</td><td>Define el nombre de dominio necesario para generar las claves de cifrado del equipo.</td></tr>
<tr><td>crypto key generate rsa</td><td>Genera el par de claves criptográficas pública y privada para el protocolo SSH.</td></tr>
<tr><td>line vty 0 4</td><td>Ingresa a la configuración de las líneas de terminal virtual para acceso remoto.</td></tr>
<tr><td>transport input ssh</td><td>Bloquea Telnet y restringe el acceso remoto exclusivamente al protocolo cifrado SSH.</td></tr>
<tr><td>exit</td><td>Sale del modo de configuración de líneas virtuales y retorna a configuración global.</td></tr>
</tbody>
</table>

<p>Configuración de servicio SSH en router Huawei según el estándar del manual técnico:</p>
<pre><code>&lt;Huawei&gt; system-view
[Huawei] rsa local-key-pair create
[Huawei] stelnet server enable
[Huawei] user-interface vty 0 4
[Huawei-ui-vty0-4] protocol inbound ssh
[Huawei-ui-vty0-4] quit</code></pre>

<table>
<thead><tr><th>Comando en Huawei</th><th>Qué hace</th></tr></thead>
<tbody>
<tr><td>system-view</td><td>Pasa del modo de vista de usuario al modo de configuración del sistema en el router.</td></tr>
<tr><td>rsa local-key-pair create</td><td>Crea las claves locales rsa indispensables para negociar el túnel seguro de SSH.</td></tr>
<tr><td>stelnet server enable</td><td>Habilita el demonio del servidor SSH seguro en el sistema operativo del router.</td></tr>
<tr><td>user-interface vty 0 4</td><td>Ingresa a la configuración de las interfaces de terminal virtual de acceso remoto.</td></tr>
<tr><td>protocol inbound ssh</td><td>Restringe el protocolo de entrada en las líneas remotas para admitir solo SSH.</td></tr>
<tr><td>quit</td><td>Sale de la vista de interfaz de usuario y regresa a la vista de configuración del sistema.</td></tr>
</tbody>
</table>

<h3>Monitoreo y Registro de Eventos con Syslog</h3>
<p>El protocolo Syslog es el estándar de la industria para generar, transmitir y almacenar los registros de eventos operativos de los routers en una red corporativa.</p>
<p>El protocolo Syslog permite a dispositivos y sistemas generar, transmitir y almacenar mensajes relacionados con su operación, incluyendo advertencias, errores, información de funcionamiento y caídas de interfaces.</p>
<p>Estos mensajes se pueden consultar localmente en la memoria del router mediante el comando de registro o enviarse a través de la red hacia un servidor Syslog centralizado en el puerto (UDP) 514 para su auditoría.</p>

<p>Los mensajes del protocolo Syslog se clasifican estrictamente en ocho niveles de severidad según el estándar del manual:</p>
<table>
<thead><tr><th>Nivel</th><th>Severidad en inglés</th><th>Nombre en español</th><th>Significado técnico y acción esperada</th></tr></thead>
<tbody>
<tr><td>0</td><td>Emergency</td><td>Emergencia</td><td>El sistema queda totalmente inutilizable por falla crítica de hardware o kernel.</td></tr>
<tr><td>1</td><td>Alert</td><td>Alerta</td><td>Condición que exige intervención correctiva inmediata por parte del especialista.</td></tr>
<tr><td>2</td><td>Critical</td><td>Crítico</td><td>Condición grave en el dispositivo que afecta funciones esenciales de red.</td></tr>
<tr><td>3</td><td>Error</td><td>Error</td><td>Fallo operativo que interrumpe un servicio específico sin bloquear todo el equipo.</td></tr>
<tr><td>4</td><td>Warning</td><td>Advertencia</td><td>Indicación de una posible anomalía operativa si no se corrige a tiempo.</td></tr>
<tr><td>5</td><td>Notice</td><td>Notificación</td><td>Evento normal pero significativo dentro del ciclo operativo del sistema.</td></tr>
<tr><td>6</td><td>Informational</td><td>Informativo</td><td>Mensaje estándar de monitoreo que describe la operación habitual del sistema.</td></tr>
<tr><td>7</td><td>Debug</td><td>Depuración</td><td>Mensajes técnicos detallados utilizados para diagnóstico avanzado de protocolos.</td></tr>
</tbody>

        html: `<h3>¿Para qué te sirve?</h3>
<p>En las redes corporativas complejas con múltiples sucursales y centros de datos, los routers deben intercambiar información sobre el estado de los enlaces para dirigir los paquetes por el camino óptimo.</p>
<p>Dominar los protocolos de enrutamiento dinámico como OSPF (Open Shortest Path First), BGP (Border Gateway Protocol) y RIP (Routing Information Protocol) te permite diagnosticar problemas de conectividad entre sedes y asegurar la redundancia de los servicios corporativos.</p>
<p>A diferencia del enrutamiento estático, en el enrutamiento dinámico si un enlace falla el protocolo reacciona anunciando que algunas rutas han fallado y elige la nueva mejor ruta logrando convergencia.</p>

<h3>Fundamentos del Enrutamiento Dinámico y Jerarquía de Red</h3>
<p>Un router corporativo toma decisiones de reenvío consultando su tabla de enrutamiento IP para determinar por cuál interfaz de salida debe despachar cada paquete.</p>
<p>Cada router con protocolo de enrutamiento dinámico aprende información de enrutamiento sobre las subredes de routers vecinos y anuncia información de enrutamiento sobre subredes a sus vecinos.</p>
<p>Los protocolos de enrutamiento dinámico descubren vecinos de forma automática, intercambian información topológica y seleccionan la mejor ruta hacia cada prefijo de destino aplicando algoritmos matemáticos especializados.</p>

<h3>Protocolo OSPF: Estado de Enlace y Jerarquía por Áreas</h3>
<p>El protocolo OSPF es el estándar más extendido en redes empresariales debido a su rápida convergencia y soporte de arquitecturas jerárquicas sin bucles.</p>
<p>OSPF opera como un protocolo de estado de enlace (link-state) donde cada router genera anuncios lsa para describir sus interfaces activas y vecinos conectados.</p>
<p>Estos anuncios se distribuyen mediante inundación controlada a todos los routers del área, permitiendo que cada equipo construya una base de datos lsdb idéntica.</p>
<p>El protocolo de estado de enlace crea la base de datos lsdb y calcula la ruta hacia cada subred eligiendo la mejor ruta en base a una métrica.</p>
<p>La métrica de OSPF se basa en el costo, calculado en función del ancho de banda de la interfaz física, prefiriendo enlaces de mayor velocidad como interfaces gigabit frente a conexiones más lentas.</p>
<p>Para mantener la escalabilidad en redes de cientos de sedes, OSPF organiza los routers en áreas jerárquicas, exigiendo obligatoriamente un área central denominada Área 0 (área backbone) a la cual deben conectarse todas las demás áreas periféricas.</p>

<h3>Protocolo RIP: Vector de Distancias y Límite de Saltos</h3>
<p>El protocolo RIP es uno de los algoritmos de enrutamiento más antiguos en redes de datos, clasificado dentro de los protocolos de vector de distancias (distance-vector).</p>
<p>Cada router que ejecuta RIP anuncia periódicamente su tabla de enrutamiento completa a sus vecinos directamente conectados, midiendo la distancia hacia cada destino únicamente por el conteo de saltos de router intermedios.</p>
<p>En el protocolo RIP cada router transmite su tabla de routing completa cada 30 segundos, y si una ruta no se actualiza durante 180 segundos el router descartará esa ruta.</p>
<p>En el curso se distinguen dos versiones fundamentales:</p>
<ul>
<li><strong>RIPv1:</strong> Protocolo con clase que no envía la máscara de subred en sus anuncios y transmite mediante mensajes broadcast que saturan la red local.</li>
<li><strong>RIPv2:</strong> Protocolo sin clase que soporta máscaras de subred de longitud variable, utiliza multidifusión en la dirección 224.0.0.9 e incorpora autenticación para proteger los anuncios.</li>
</ul>

<p>Configuración de RIPv2 en router según el estándar del manual técnico:</p>
<pre><code>router rip
version 2
network 10.0. 0.0
network 192.168. 1.0</code></pre>

<table>
<thead><tr><th>Comando en router</th><th>Qué hace</th></tr></thead>
<tbody>
<tr><td>router rip</td><td>Habilita el proceso del protocolo de enrutamiento RIP en el sistema operativo del equipo.</td></tr>
<tr><td>version 2</td><td>Activa la versión 2 de RIP para admitir subredes sin clase y multidifusión.</td></tr>
<tr><td>network 10.0. 0.0</td><td>Habilita el anuncio de la red corporativa central en las actualizaciones de ruta.</td></tr>
<tr><td>network 192.168. 1.0</td><td>Asocia la red local de la sucursal para ser anunciada por el protocolo RIP.</td></tr>
</tbody>
</table>

<h3>Protocolo BGP: Vector de Rutas y Conexión entre Redes</h3>
<p>El protocolo BGP es el protocolo de enrutamiento que interconecta los diferentes proveedores de servicios y grandes corporaciones en la red Internet global.</p>
<p>BGP se clasifica como un protocolo de vector de rutas (path-vector) que no utiliza métricas simples de saltos ni costo, sino políticas y atributos avanzados para determinar el camino entre sistemas autónomos.</p>
<p>Un sistema autónomo es un conjunto de redes bajo una administración técnica unificada y con una política de enrutamiento común hacia el exterior.</p>
<p>En redes corporativas se utiliza de dos maneras:</p>
<ul>
<li><strong>BGP externo (eBGP):</strong> Comunica el router de borde de la empresa con el router del proveedor de servicios de Internet (ISP) para intercambiar rutas públicas.</li>
<li><strong>BGP interno (iBGP):</strong> Distribuye la información de enrutamiento aprendida desde Internet entre los routers principales dentro de la propia empresa.</li>
</ul>

<p>El protocolo OSPF actúa como un sistema con mapa de enlaces que calcula la ruta hacia cada subred.</p>
<p>A su vez el protocolo RIP actúa como un contador que actualiza la distancia hacia cada destino consultando a sus vecinos cada 30 segundos.</p>
<p>El protocolo BGP opera como la aduana de control internacional que gestiona las normas de tránsito comercial entre diferentes naciones.</p>

<li>BGP es el protocolo de vector de rutas que interconecta sistemas autónomos en Internet mediante sesiones exteriores entre empresas y operadores.</li>

        title: "Conmutación de Paquetes, Puertos TCP/UDP y Troncales SIP",
        min: 15,
        html: `<h3>¿Para qué te sirve?</h3>
<p>En el soporte a empresas, las comunicaciones combinan navegación web, bases de datos contables y telefonía IP sobre la misma infraestructura de red.</p>
<p>Dominar la conmutación de paquetes, los puertos de la capa de transporte TCP (Transmission Control Protocol) y UDP (User Datagram Protocol) y las troncales SIP (Session Initiation Protocol) te permite diagnosticar problemas de voz sobre IP y configurar reglas de apertura de puertos en terreno.</p>
<p>En la capa de transporte cuando se requiere acceder a un servicio desde Internet como un servidor web (HTTP, Hypertext Transfer Protocol) es indispensable abrir un puerto en el router corporativo para evitar bloqueos de comunicación e interrupciones en los servicios de datos corporativos.</p>

<h3>Conmutación de Paquetes y Espacio de Puertos Lógicos</h3>
<p>Las redes modernas de datos se basan en la conmutación de paquetes, superando a la antigua conmutación de circuitos de la telefonía tradicional donde se reservaba un canal físico permanente e indivisible durante toda la comunicación.</p>
<p>En la conmutación de paquetes, la información digital se divide en pequeños fragmentos con encabezados que contienen las direcciones de origen y destino, permitiendo que múltiples flujos compartan el mismo medio físico de forma simultánea y que cada paquete pueda seguir rutas distintas para llegar al destino de manera confiable y continua en la red corporativa de alta disponibilidad.</p>
<p>Para que un computador o servidor pueda atender múltiples aplicaciones al mismo tiempo con una sola dirección IP, la capa de transporte utiliza puertos lógicos numerados desde el puerto 0 hasta el puerto 65535.</p>

<p>El estándar internacional divide el espacio de puertos en tres categorías claramente definidas:</p>
<table>
<thead><tr><th>Rango de puertos</th><th>Clasificación</th><th>Uso operativo y servicios representativos</th></tr></thead>
<tbody>
<tr><td>Inferior a 1024</td><td>Puertos bien conocidos</td><td>Reservados para el sistema operativo y servicios como HTTP y Telnet.</td></tr>
<tr><td>1024 a 49151</td><td>Puertos registrados</td><td>Comprendidos entre 1024 y 49151 utilizables por aplicaciones registradas.</td></tr>
<tr><td>49152 a 65535</td><td>Puertos dinámicos o privados</td><td>Comprendidos entre 49152 y 65535 asignados en forma dinámica a conexiones de clientes.</td></tr>
</tbody>
</table>

<h3>Comparativa entre Protocolos TCP y UDP</h3>
<p>En la capa de transporte operan dos protocolos fundamentales con características y propósitos operativos distintos:</p>
<ul>
<li><strong>Protocolo TCP:</strong> El protocolo TCP se caracteriza por ser conectivo, fiable y orientado a la conexión, lo que implica su capacidad para retransmitir segmentos de paquetes en caso de pérdida entre el origen y el destino.</li>
<li><strong>Protocolo UDP:</strong> Protocolo sin conexión, rápido y con mínima sobrecarga de encabezado. Envía datagramas sin saludo previo ni confirmación de entrega. Resulta indispensable para aplicaciones sensibles a la latencia como transmisiones de audio y video en tiempo real, donde una mínima pérdida de paquetes es preferible a sufrir retrasos por retransmisiones.</li>
</ul>

<h3>Troncales SIP: Telefonía IP y Separación de Señalización y Audio</h3>
<p>Una troncal SIP (SIP Trunk, Session Initiation Protocol) es una solución corporativa que permite conectar la central telefónica privada de una empresa con la red pública telefónica del operador a través de un enlace de datos IP.</p>
<p>En la telefonía corporativa moderna se produce una separación técnica fundamental entre dos flujos de comunicación totalmente independientes:</p>
<ul>
<li><strong>Flujo de señalización (SIP):</strong> Utiliza el protocolo SIP sobre el puerto 5060 (habitualmente UDP o TCP) para establecer, negociar parámetros, transferir y finalizar las llamadas telefónicas.</li>
<li><strong>Flujo de medios y voz:</strong> Una vez establecida la llamada por SIP, la voz digitalizada se transporta mediante el protocolo rtp utilizando paquetes UDP en puertos dinámicos altos negociados durante la llamada.</li>
</ul>

<p>Parámetros técnicos esenciales en la configuración de una troncal SIP corporativa:</p>
<table>
<thead><tr><th>Parámetro técnico</th><th>Descripción operativa</th></tr></thead>
<tbody>
<tr><td>Servidor SIP / Proxy</td><td>Dirección IP o nombre de dominio del conmutador del operador que gestiona el registro y enrutamiento de llamadas.</td></tr>
<tr><td>Puerto SIP</td><td>Puerto estándar 5060 para el intercambio de mensajes de señalización telefónica.</td></tr>

<p>Los puertos de red funcionan como las puertas numeradas de los departamentos en un edificio corporativo.</p>

<p>El protocolo TCP opera con confirmación y retransmisiones asegurando que lleguen todos los segmentos de paquetes correctamente.</p>

<h3>Resumen</h3>

<li>Las troncales SIP separan la señalización de llamadas en el puerto 5060 del transporte de voz digitalizada en puertos UDP dinámicos.</li>

        html: `<h3>¿Para qué te sirve?</h3>
<p>En las instalaciones corporativas, la seguridad física y lógica de los puertos de red es un requisito indispensable para evitar accesos no autorizados a la infraestructura interna.</p>
<p>Dominar el estándar de control de acceso basado en puertos IEEE 802.1X, los protocolos de autenticación centralizada RADIUS (Remote Authentication Dial-In User Service) y TACACS+ (Terminal Access Controller Access-Control System Plus), las plataformas de control de admisión NAC (Network Admission Control) y el cifrado de capa 2 MACsec (Media Access Control Security) te permite asegurar los puntos de conexión física y diagnosticar bloqueos de acceso en terreno.</p>
<p>Un técnico que desconoce estos protocolos no podrá conectar nuevos equipos en salas de servidores ni entenderá por qué un puerto de red apaga el tráfico al conectar una computadora portátil corporativa.</p>

<h3>Estándar IEEE 802.1X y sus Tres Roles de Operación</h3>
<p>El estándar IEEE 802.1X define un mecanismo de autenticación y control de acceso basado en puertos tanto para redes cableadas Ethernet como para redes inalámbricas corporativas.</p>
<p>Cuando un dispositivo se conecta físicamente a una roseta de red o puerto de un switch, el puerto permanece en estado no autorizado bloqueando todo el tráfico de datos habitual con la única excepción de los mensajes de autenticación.</p>
<p>La arquitectura de 802.1X se fundamenta en la interacción coordinada de tres roles esenciales:</p>
<ul>
<li><strong>Suplicante (Supplicant):</strong> El dispositivo cliente (computador de escritorio, laptop, teléfono IP o cámara de seguridad) que solicita acceso a la red interna y envía sus credenciales o certificado digital de seguridad.</li>
<li><strong>Autenticador (Authenticator):</strong> El equipo de red intermedio (switch de acceso o punto de acceso inalámbrico) que controla el estado del puerto, recibiendo los datos del cliente y retransmitiéndolos hacia el servidor de validación.</li>
<li><strong>Servidor de autenticación (Authentication Server):</strong> La plataforma centralizada (generalmente un servidor RADIUS o TACACS+) que valida las credenciales contra la base de datos corporativa y ordena al autenticador abrir o bloquear el puerto de red.</li>
</ul>

<h3>Protocolos de Autenticación y Control: RADIUS y TACACS+</h3>
<p>La seguridad corporativa se estructura en torno a tres conceptos clave: autenticación (quién es el usuario), autorización (qué acciones tiene permitido realizar) y contabilidad (registro de qué comandos y tareas ejecutó en el equipo).</p>
<p>Para gestionar este modelo de seguridad se emplean dos protocolos principales con diferencias arquitectónicas fundamentales:</p>
<table>
<thead><tr><th>Característica técnica</th><th>Protocolo RADIUS</th><th>Protocolo TACACS+</th></tr></thead>
<tbody>
<tr><td>Desarrollador y estándar</td><td>Estándar abierto de la industria utilizado por múltiples fabricantes.</td><td>Protocolo propietario desarrollado originalmente por Cisco.</td></tr>
<tr><td>Protocolo de transporte</td><td>Opera sobre UDP utilizando los puertos 1812 (autenticación) y 1813 (contabilidad).</td><td>Opera sobre TCP garantizando confiabilidad en el puerto 49.</td></tr>
<tr><td>Separación de funciones</td><td>Combina autenticación y autorización en un solo paquete conjunto.</td><td>Separa de forma totalmente independiente la autenticación, autorización y contabilidad.</td></tr>
<tr><td>Nivel de cifrado</td><td>Cifra únicamente el campo de la contraseña; el resto del paquete viaja en texto claro.</td><td>Cifra el cuerpo completo del paquete proporcionando máxima confidencialidad.</td></tr>
<tr><td>Uso principal</td><td>Control de acceso a la red de usuarios finales (802.1X, Wi-Fi corporativo y VPN).</td><td>Administración y control de comandos ejecutados por técnicos sobre routers y switches.</td></tr>
</tbody>
</table>

<h3>Control de Admisión a la Red (NAC) y Cifrado Físico MACsec</h3>
<p>Para elevar la seguridad en entornos empresariales críticos se incorporan dos tecnologías complementarias:</p>
<ul>
<li><strong>Control de Admisión a la Red (NAC):</strong> Sistema que evalúa la postura de seguridad del terminal antes de admitirlo en la red interna corporativa. Comprueba que el equipo tenga el antivirus activo y actualizado, las actualizaciones del sistema operativo al día y el cortafuegos encendido. Si el dispositivo no cumple las políticas, el sistema lo aísla en una (VLAN) de cuarentena para su remediación inmediata.</li>
<li><strong>Cifrado MACsec (IEEE 802.1AE):</strong> Estándar de seguridad de capa de enlace de datos que cifra punto a punto el tráfico Ethernet entre dos dispositivos directamente conectados. Opera a velocidad de línea mediante hardware especializado sin degradar el rendimiento, protegiendo contra ataques de intermediario y captura física de tramas en los enlaces de red.</li>
</ul>

<div class="tip">
<h4>Para entenderlo</h4>

<p>El servidor de autenticación opera como el departamento de personal que valida en el sistema si la tarjeta presentada está activa y autorizada para el ingreso.</p>
<p>El sistema NAC sirve como control de admisión para desenmascarar dispositivos desconocidos y aislar el dispositivo para evitar propagación de ataques.</p>
<p>A su vez el protocolo MACsec proporciona autenticación, confidencialidad e integridad a los datos transportados en enlaces punto a punto mediante criptografía.</p>

<p>Tras coordinar con el administrador de seguridad del cliente la instalación del certificado y verificar el registro de autenticación exitoso en el servidor central RADIUS, el puerto del switch conmuta automáticamente a estado autorizado en color verde y la estación de trabajo inicia sus servicios sin inconvenientes.</p>

<h3>Resumen</h3>

<li>TACACS+ opera sobre TCP en puerto 49 cifrando todo el paquete y separando de forma independiente la autenticación, autorización y contabilidad.</li>
<li>Las plataformas NAC y el cifrado MACsec en capa 2 completan la protección corporativa evaluando la postura del terminal y blindando los enlaces físicos.</li>
</ul>`

        min: 15,
        html: `<h3>¿Para qué te sirve?</h3>
<p>En las redes empresariales, proteger los servidores de bases de datos y equipos de usuarios frente a ataques cibernéticos y accesos no autorizados es una prioridad crítica.</p>
<p>Dominar los cortafuegos corporativos como Cisco ASA (Adaptive Security Appliance) y Fortigate (cortafuegos de seguridad de redes), la arquitectura de zonas de seguridad con cortafuegos basado en políticas ZBFW (Zone-Based Policy Firewall), las listas de control de acceso (ACL, Access Control List) y los métodos de inspección SPI (Stateful Packet Inspection) y DPI (Deep Packet Inspection) te permite asegurar el perímetro y solucionar bloqueos indebidos de tráfico en terreno.</p>
<p>Una regla de filtrado mal ubicada o una zona desmilitarizada (DMZ) desprotegida puede dejar a toda una sucursal sin acceso a los servicios centrales o exponer la red interna a filtraciones de datos.</p>

<h3>Zonas de Seguridad y Arquitectura Cortafuegos</h3>
<p>Un cortafuegos perimetral actúa como la primera línea de defensa entre la red interna de la empresa y las redes públicas no confiables.</p>
<p>Para gestionar la seguridad de manera ordenada, el cortafuegos segmenta la infraestructura en zonas de seguridad con diferentes niveles de confianza:</p>
<ul>
<li><strong>Zona Interna (Inside):</strong> Red de área local corporativa donde residen los computadores de los trabajadores, impresoras y servidores internos con máxima protección.</li>
<li><strong>Zona Externa (Outside):</strong> Conexión hacia Internet pública o redes de terceros consideradas no confiables por definición.</li>
<li><strong>Zona Desmilitarizada (DMZ):</strong> Subred intermedia aislada donde se ubican servidores que deben ser accesibles desde el exterior (como servidores web corporativos o servidores de correo) sin dar acceso directo a la red interna si llegan a ser vulnerados.</li>
</ul>

<p>En routers con tecnología ZBFW, las políticas de seguridad no se aplican a interfaces individuales sino a pares de zonas (zone-pairs), controlando de manera direccional qué tráfico puede cruzar desde una zona hacia otra.</p>

<h3>Listas de Control de Acceso (ACL): Cisco y Huawei</h3>
<p>Una lista de control de acceso es una secuencia ordenada de reglas lógicas que permiten o deniegan el tráfico de paquetes según sus direcciones IP, protocolos y puertos.</p>
<p>Las listas de control de acceso se evalúan de arriba hacia abajo de forma secuencial; cuando un paquete coincide con una regla, se aplica la acción (permitir o denegar) y se detiene la evaluación.</p>
<p>Al final de toda lista de control de acceso existe siempre una regla implícita de denegación total; cualquier paquete que no coincida expresamente con una regla previa es descartado de inmediato.</p>

<p>Clasificación según el fabricante:</p>
<ul>
<li><strong>En Cisco:</strong> Una ACL estándar como access-list 10 filtra el tráfico considerando la dirección IP de origen; una ACL extendida como access-list 100 considera la dirección de destino y filtra por protocolo y puerto.</li>
<li><strong>En Huawei:</strong> Una ACL básica como acl number 2000 filtra tráfico por IP de origen; una ACL extendida como acl number 3000 permite bloquear tráfico por protocolo TCP y puerto.</li>
</ul>

<p>Configuración de ACL estándar en router Cisco según el estándar del manual técnico:</p>
<pre><code>Router(config)# access-list 10 deny 192.168.1.10
Router(config)# access-list 10 permit any
Router(config)# interface GigabitEthernet0/0
Router(config-if)# ip access-group 10 in</code></pre>

<table>
<thead><tr><th>Comando en Cisco</th><th>Qué hace</th></tr></thead>
<tbody>
<tr><td>access-list 10 deny 192.168.1.10</td><td>Crea una regla en la ACL estándar 10 que bloquea el tráfico proveniente de la IP especificada.</td></tr>
<tr><td>access-list 10 permit any</td><td>Permite el paso de todo el resto del tráfico proveniente de cualquier otra dirección IP.</td></tr>
<tr><td>interface GigabitEthernet0/0</td><td>Ingresa al modo de configuración de la interfaz física de red donde se aplicará el filtro.</td></tr>
<tr><td>ip access-group 10 in</td><td>Aplica la ACL 10 en la interfaz para filtrar el tráfico que ingresa por el puerto.</td></tr>
</tbody>
</table>

<p>Configuración de ACL básica en router Huawei según el estándar del manual técnico:</p>
<pre><code>[Huawei] acl 2000
[Huawei-acl-basic-2000] rule 5 deny ip source 192.168.1.10 0
[Huawei-acl-basic-2000] rule 10 permit ip
[Huawei-acl-basic-2000] quit
[Huawei] interface GigabitEthernet 0/0/9
[Huawei-GigabitEthernetO/O/9] quit</code></pre>

<table>
<thead><tr><th>Comando en Huawei</th><th>Qué hace</th></tr></thead>
<tbody>
<tr><td>acl 2000</td><td>Ingresa a la creación de una ACL básica con identificador 2000 en el router.</td></tr>
<tr><td>rule 5 deny ip source 192.168.1.10 0</td><td>Define la regla 5 bloqueando de forma explícita la dirección IP de origen indicada.</td></tr>
<tr><td>rule 10 permit ip</td><td>Define la regla 10 autorizando el paso de los paquetes IP restantes de la red.</td></tr>
<tr><td>quit</td><td>Sale de la vista de configuración de la ACL básica y retorna a vista del sistema.</td></tr>
<tr><td>interface GigabitEthernet 0/0/9</td><td>Ingresa al modo de configuración de la interfaz física de red en el equipo.</td></tr>
<tr><td>quit</td><td>Sale de la configuración de interfaz y retorna al menú principal del sistema.</td></tr>
</tbody>
</table>

<h3>Inspección con Estado (SPI) frente a Inspección Profunda (DPI)</h3>
<p>Los cortafuegos avanzados emplean dos técnicas de inspección para asegurar el tráfico:</p>
<ul>
<li><strong>Inspección con Estado (SPI):</strong> Supervisa el estado de las conexiones activas en las capas 3 y 4 del modelo OSI manteniendo una tabla de estados dinámica. Cuando un equipo interno inicia una sesión hacia un servidor externo, el firewall registra la conexión y permite automáticamente los paquetes de retorno sin requerir reglas de apertura permanentes en la interfaz externa.</li>
<li><strong>Inspección Profunda de Paquetes (DPI):</strong> Analiza la carga útil de los paquetes en la capa 7 de aplicación, inspeccionando el contenido real de los datos. Permite identificar aplicaciones específicas independientemente del puerto que utilicen, bloquear tráfico de programas no autorizados y detectar firmas de virus o código malicioso en tiempo real.</li>
</ul>

<div class="tip">
<h4>Para entenderlo</h4>
<p>Un cortafuegos perimetral actúa como el control de aduanas en una terminal de pasajeros que revisa toda persona que ingresa o sale del país.</p>
<p>Las listas de control de acceso son como una lista de invitados en la puerta de una recepción privada donde solo ingresan quienes están anotados y el resto queda afuera.</p>
<p>La inspección con estado SPI funciona como un guardia que entrega un brazalete de salida temporal al visitante permitiéndole reingresar sin tener que volver a identificarse.</p>
<p>La inspección profunda DPI analiza el contenido real de los datos transmitidos para identificar aplicaciones y detectar amenazas en la red.</p>
</div>

<h3>En terreno</h3>
<p>Un técnico atiende un reporte en una sucursal corporativa donde los usuarios no pueden acceder al sistema de gestión web alojado en la zona desmilitarizada DMZ de la empresa.</p>
<p>Al revisar la lista de control de acceso en el cortafuegos el técnico detecta que una regla para tráfico TCP en puerto 80 bloqueaba la comunicación hacia el servidor.</p>
<p>El técnico aplica la regla de permiso en la interfaz y valida que el cortafuegos autorice las sesiones restableciendo la conectividad operativa.</p>

<h3>Resumen</h3>
<ul>
<li>Los cortafuegos perimetrales organizan la seguridad corporativa en zonas de confianza diferenciadas como Inside, Outside y DMZ.</li>
<li>Las listas de control de acceso filtran paquetes secuencialmente con una regla implícita final de denegación total en Cisco y Huawei.</li>
<li>En Cisco las ACL estándar como regla 10 filtran por IP de origen y las extendidas como regla 100 filtran por origen, destino, protocolo y puerto.</li>
<li>La inspección SPI mantiene una tabla de estados en capas 3 y 4 permitiendo el tráfico legítimo de retorno de las sesiones iniciadas.</li>
<li>La inspección profunda DPI analiza la carga útil en capa 7 detectando aplicaciones maliciosas y reforzando la protección perimetral.</li>
</ul>`

        min: 15,
        html: `<h3>¿Para qué te sirve?</h3>
<p>En el servicio a clientes corporativos, la excelencia técnica en la configuración de routers debe complementarse obligatoriamente con una ejecución impecable de los estándares operativos de terreno.</p>
<p>Dominar las Unidades de Competencia Laboral UCL 1 (preparación y salida a terreno), UCL 2 (presentación profesional y relación con el cliente) y UCL 3 (evaluación inicial del entorno técnico y planta externa) te permite planificar la jornada laboral, proyectar una imagen corporativa confiable y asegurar las condiciones físicas antes de intervenir cualquier equipamiento de comunicaciones.</p>
<p>Es responsabilidad del técnico salir a terreno con todas las herramientas, materiales, elementos de protección personal epp y equipos necesarios para cumplir con los servicios asignados.</p>

<h3>UCL 1: Preparación Técnica y Salida a Terreno</h3>
<p>La primera unidad UCL 1 de salida exitosa a terreno establece la preparación y organización para una salida técnica efectiva a terreno asegurando estándares operativos.</p>
<p>El proceso comienza con la recepción y revisión del itinerario de trabajo en la aplicación corporativa TOA-TOOLBOX, confirmando la dirección exacta del cliente, el tipo de servicio contratado y los requerimientos especiales de acceso.</p>
<p>Antes de iniciar el traslado en el vehículo de la empresa, el especialista debe realizar cuatro verificaciones esenciales:</p>
<ul>
<li><strong>Inventario de herramientas:</strong> Comprobar la presencia y calibración del medidor de potencia óptica (Power Meter), localizador visual de fallas (VFL), fusionadora de fibra óptica, cortadora de precisión (Cleaver), crimpadora de conector de red y probador de continuidad de cableado.</li>
<li><strong>Elementos de protección personal:</strong> Disponer de casco de seguridad dieléctrico con barboquejo, lentes de protección con filtro ultravioleta, chaleco reflectante de alta visibilidad, guantes de maniobra y calzado de seguridad dieléctrico con puntera reforzada.</li>
<li><strong>Inspección del vehículo:</strong> Aplicar prácticas de conducción defensiva manteniendo velocidades adecuadas y respetando las normas de tránsito al desplazarse a terreno.</li>
<li><strong>Comunicación móvil:</strong> Revisar el estado de todos los elementos de protección personal epp entregados por la empresa como casco clase A con barboquejo, calzado dieléctrico y chaleco reflectante.</li>

<h3>UCL 2: Presentación Profesional y Relación con el Cliente</h3>
<p>La segunda Unidad de Competencia Laboral norma la conducta, presencia y protocolo de comunicación del personal técnico ante el cliente corporativo.</p>
<p>La puntualidad es un factor determinante: el técnico debe llegar a las dependencias con 10 a 15 minutos de anticipación al horario coordinado, evitando imprevistos en los controles de acceso del edificio.</p>
<p>La presentación personal exige llevar el uniforme de trabajo completo, impecable y en buen estado de conservación, portando en el pecho la credencial corporativa con fotografía y la cédula de identidad a disposición del personal de seguridad.</p>
<p>Al hacer contacto con el representante de la empresa, el técnico debe brindar un saludo cordial, identificarse con nombre y apellido y explicar con claridad el objetivo técnico de la visita programada.</p>
<p>El técnico mantiene una actitud profesional, comunicativa y respetuosa en cada etapa del servicio, en línea con el Código de Conducta 2025.</p>

<h3>UCL 3: Evaluación Inicial de Sala Técnica y Planta Externa</h3>
<p>La tercera Unidad de Competencia Laboral establece las comprobaciones obligatorias que deben realizarse en la sala técnica y en la infraestructura de fibra óptica antes de instalar o encender cualquier equipamiento.</p>
<p>En el interior de la sala de servidores o centro de cableado se revisan las condiciones ambientales y estructurales:</p>
<ul>
<li><strong>Espacio y fijación en rack:</strong> Confirmar que el gabinete o rack de comunicaciones cuente con las unidades de rack necesarias, guías de montaje firmes y organizadores de cables horizontales y verticales (cable management) que eviten estrangulamientos en los cordones de parcheo.</li>
<li><strong>Puesta a tierra equipotencial:</strong> Realizar una verificación exhaustiva del entorno físico asegurándose de que haya suficiente espacio en el rack o gabinete y que la alimentación eléctrica sea adecuada.</li>
<li><strong>Ventilación y energía:</strong> Evaluar la operatividad de la planta externa antes de comenzar los trabajos para evitar quiebres técnicos como caja terminal óptica (CTO) o caja de distribución óptica interior (CDOI) sin potencia o fibras ocupadas.</li>
</ul>

<p>En la planta externa, el técnico inspecciona la acometida de fibra óptica desde la caja terminal óptica (CTO) o caja de distribución óptica interior (CDOI):</p>
<p>Es obligatorio medir la potencia óptica con el Power Meter en la longitud de onda de servicio, comprobando que el nivel óptico recibido sea mayor o igual a -24 dBm.</p>
<p>Si la potencia óptica resulta inferior a este umbral crítico o la fibra presenta atenuación excesiva por curvatura, el técnico debe solicitar y probar una nueva fibra en coordinación inmediata con el administrador de inventario antes de conectar el router.</p>

<div class="tip">
<h4>Para entenderlo</h4>
<p>La preparación previa de UCL 1 asegura salir a terreno de manera eficiente y segura con todas las herramientas y equipos necesarios.</p>
<p>Cada instrumento de medición y elemento de protección debe comprobarse en la base antes de comenzar el recorrido hacia la sede del cliente.</p>
<p>A su vez la presentación profesional de UCL 2 exige llegar entre 5 a 10 minutos antes con uniforme limpio y credencial visible proyectando confianza ante el cliente.</p>
<p>A su vez la evaluación inicial técnica actúa como el examen de cimientos que ejecuta un ingeniero antes de levantar una estructura pesada garantizando que el suelo y las conexiones sean completamente seguros.</p>
</div>

<h3>En terreno</h3>
<p>El técnico llega entre 5 a 10 minutos antes de la hora programada con uniforme corporativo y credencial, explicando brevemente al cliente las acciones a realizar.</p>
<p>Antes de conectar el router realiza una verificación exhaustiva asegurando que haya suficiente espacio en el rack y validando la potencia óptica en el punto de demarcación.</p>
<p>Al medir con el Power Meter en el conector de la caja CDOI registra una potencia óptica de -20 dBm, confirmando que la señal supera con holgura el umbral mínimo operativo de -24 dBm y procediendo a una instalación limpia y segura.</p>

<h3>Resumen</h3>
<ul>
<li>La UCL 1 exige revisar el itinerario en TOA-TOOLBOX, calibrar herramientas ópticas e inspeccionar vehículo y elementos de seguridad.</li>
<li>La UCL 2 establece estándares estrictos de puntualidad, uniforme impecable, credencial visible y confidencialidad de la información del cliente.</li>
<li>La UCL 3 norma la inspección del rack corporativo verificando orden del cable management y conexión sólida a la barra de tierra equipotencial.</li>
<li>La medición óptica en CTO o CDOI exige un nivel de potencia recibido mayor o igual a -24 dBm para garantizar la estabilidad del enlace.</li>
<li>El cumplimiento riguroso de estas tres etapas asegura una intervención profesional, previene accidentes laborales y garantiza la satisfacción del cliente.</li>
</ul>`

      { id: "ucl4_acceso_gestion_protocolos", title: "Procedimiento UCL 4 (Parte 1): Acceso, Gestión y Diagnóstico de Protocolos", min: 18, html: `<h3>¿Para qué te sirve?</h3>
<p>En el servicio técnico a clientes corporativos, dominar el acceso y la gestión integral de los routers de telecomunicaciones es fundamental para diagnosticar y reparar fallas críticas en los servicios de red. Como especialista en terreno, saber elegir el método de ingreso adecuado y verificar las sesiones activas te permite aislar fallas sin alterar la configuración del cliente.</p>

<div class="tip">
<h4>Para entenderlo</h4>
<p>Acceder a un router corporativo es como ingresar a una estación técnica protegida: puedes hacerlo de forma física y directa mediante la llave de la puerta principal (el puerto de consola local con cable serial) o a través de un túnel subterráneo blindado y vigilado (la sesión remota por SSH).</p>
<p>Si intentas ingresar por una vía sin blindaje como Telnet, cualquier observador en el camino puede capturar tus credenciales de texto plano. Por ello, en servicios de alta fidelidad, la consola permite el rescate de emergencia cuando la red está caída, mientras que SSH y la validación contra un servidor centralizado aseguran el control remoto diario sin riesgos operativos.</p>
</div>

<h3>En terreno</h3>
<p>En la práctica de terreno, el técnico debe seguir una secuencia estricta para verificar accesos, resolver problemas de autenticación, inspeccionar los registros de eventos del sistema y validar la tabla de rutas en routers Cisco y Huawei.</p>

<h4>1. Verificación de accesos por consola, SSH y líneas virtuales vty (págs. 130–131)</h4>
<p>Cuando un técnico no puede acceder al router de forma remota, primero verifica si el servicio SSH está activo, si las líneas de terminales virtuales vty aceptan conexiones cifradas y si el usuario local cuenta con nivel de privilegio 15 en Cisco o esquema de seguridad y autenticación en Huawei:</p>

<pre><code>show ip ssh
show run | include line vty
debug ssh
show running-config | include username
show line
line vty 0 4
login local
transport input ssh
display ssh server status
display current-configuration | include VTY
debugging ssh server
display current-configuration | include local-user
user-interface vty 0 4</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>show ip ssh</code></td>
      <td>Comprueba la versión activa del protocolo SSH y el tiempo de espera configurado en Cisco.</td>
    </tr>
    <tr>
      <td><code>show run | include line vty</code></td>
      <td>Filtra la configuración activa para revisar los parámetros de las líneas terminales virtuales.</td>
    </tr>
    <tr>
      <td><code>debug ssh</code></td>
      <td>Habilita la depuración en tiempo real de los intentos de conexión SSH en Cisco.</td>
    </tr>
    <tr>
      <td><code>show running-config | include username</code></td>
      <td>Busca los usuarios locales creados y verifica su nivel de privilegios y contraseña cifrada.</td>
    </tr>
    <tr>
      <td><code>show line</code></td>
      <td>Muestra el estado operativo y la disponibilidad de las líneas de consola y terminales virtuales.</td>
    </tr>
    <tr>
      <td><code>line vty 0 4</code></td>
      <td>Ingresa al modo de configuración de las cinco primeras líneas virtuales en Cisco.</td>
    </tr>
    <tr>
      <td><code>login local</code></td>
      <td>Exige autenticación mediante la base de datos de usuarios locales del router.</td>
    </tr>
    <tr>
      <td><code>transport input ssh</code></td>
      <td>Restringe el acceso remoto exclusivamente al protocolo seguro SSH, bloqueando Telnet.</td>
    </tr>
    <tr>
      <td><code>display ssh server status</code></td>
      <td>Muestra el estado operativo del servicio SSH y los algoritmos de cifrado en Huawei.</td>
    </tr>
    <tr>
      <td><code>display current-configuration | include vty</code></td>
      <td>Filtra la configuración de Huawei para inspeccionar los parámetros de las interfaces de usuario.</td>
    </tr>
    <tr>
      <td><code>debugging ssh server</code></td>
      <td>Activa el registro detallado de eventos y negociaciones del servidor SSH en Huawei.</td>
    </tr>
    <tr>
      <td><code>display current-configuration | include local-user</code></td>
      <td>Verifica las cuentas de usuario locales, contraseñas y niveles de servicio en Huawei.</td>
    </tr>
    <tr>
      <td><code>user-interface vty 0 4</code></td>
      <td>Ingresa a la configuración de las interfaces de terminal virtual en el sistema VRP (Versatile Routing Platform) de Huawei.</td>
    </tr>
  </tbody>
</table>

<h4>2. Autenticación centralizada con servidor RADIUS (pág. 132)</h4>
<p>En clientes de empresa, los routers validan credenciales contra servidores de autenticación centralizada RADIUS (servicio de usuario de acceso telefónico de autenticación remota). Si el acceso falla por timeout o credenciales rechazadas, se ejecutan los comandos de verificación y plantillas:</p>

<pre><code>show aaa servers
debug aaa authentication
debug radius
aaa new-model
radius-server host 10.1.1.100 key CiscoRadiusKey
aaa authentication login default group radius local
display aaa
display radius-server configuration
display radius statistics
radius-server template r1
radius-server shared-key cipher Huawei@123
radius-server authentication 10.1.1.100 1812 weight 80</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>show aaa servers</code></td>
      <td>Despliega el estado de conectividad y estadísticas de respuesta de los servidores RADIUS en Cisco.</td>
    </tr>
    <tr>
      <td><code>debug aaa authentication</code></td>
      <td>Muestra en consola cada fase de la autenticación y permisos para identificar rechazos de acceso.</td>
    </tr>
    <tr>
      <td><code>debug radius</code></td>
      <td>Depura los paquetes de solicitud y respuesta entre el router y el servidor RADIUS.</td>
    </tr>
    <tr>
      <td><code>aaa new-model</code></td>
      <td>Habilita globalmente el modelo de autenticación, autorización y contabilidad en el router.</td>
    </tr>
    <tr>
      <td><code>radius-server host 10.1.1.100 key CiscoRadiusKey</code></td>
      <td>Define la dirección IP del servidor RADIUS y la clave compartida de autenticación en Cisco.</td>
    </tr>
    <tr>
      <td><code>aaa authentication login default group radius local</code></td>
      <td>Configura autenticación primaria contra RADIUS con respaldo en base de datos local si el servidor no responde.</td>
    </tr>
    <tr>
      <td><code>display aaa</code></td>
      <td>Muestra el esquema de autenticación y autorización activo en el sistema Huawei.</td>
    </tr>
    <tr>
      <td><code>display radius-server configuration</code></td>
      <td>Despliega los parámetros y servidores RADIUS asociados a cada plantilla en Huawei.</td>
    </tr>
    <tr>
      <td><code>display radius statistics</code></td>
      <td>Exhibe contadores de paquetes enviados, aceptaciones y rechazos del servidor RADIUS.</td>
    </tr>
    <tr>
      <td><code>radius-server template r1</code></td>
      <td>Crea o modifica una plantilla de configuración de servidor RADIUS en Huawei VRP.</td>
    </tr>
    <tr>
      <td><code>radius-server shared-key cipher Huawei@123</code></td>
      <td>Establece la clave simétrica cifrada para autenticar con el servidor RADIUS en Huawei.</td>
    </tr>
    <tr>
      <td><code>radius-server authentication 10.1.1.100 1812 weight 80</code></td>
      <td>Asigna IP, puerto UDP 1812 y peso de carga al servidor de autenticación en Huawei.</td>
    </tr>
  </tbody>
</table>

<h4>3. Autenticación centralizada con servidor TACACS+ (pág. 133)</h4>
<p>Cuando el cliente corporativo utiliza TACACS+ (sistema de control de acceso del controlador de acceso a terminales más) para separar autenticación de autorización de comandos por puerto TCP 49, se aplican los siguientes comandos de diagnóstico:</p>

<pre><code>debug tacacs
tacacs-server host 10.1.1.200 key TacacsKey123
aaa authentication login default group tacacs+ local
display current-configuration | include tacacs
display tacacs-server configuration
tacacs-server template t1
tacacs-server authentication 10.1.1.200 49 weight 80
tacacs-server shared-key cipher Huawei TacacsKey</code></pre>

      <td><code>tacacs-server host 10.1.1.200 key TacacsKey123</code></td>
      <td>Configura la dirección IP y la clave de cifrado compartida con el servidor TACACS+ en Cisco.</td>
    </tr>
    <tr>
      <td><code>aaa authentication login default group tacacs+ local</code></td>
      <td>Establece prioridad de acceso por TACACS+ con respaldo en usuarios locales en caso de caída.</td>
    </tr>
    <tr>
      <td><code>display current-configuration | include tacacs</code></td>
      <td>Filtra la configuración activa de Huawei para verificar nombres de servidor y claves.</td>
    </tr>
    <tr>
      <td><code>display tacacs-server configuration</code></td>
      <td>Muestra los grupos y parámetros operativos de servidores TACACS+ en Huawei.</td>
    </tr>
    <tr>
      <td><code>tacacs-server template t1</code></td>
      <td>Ingresa a la plantilla de configuración de servicio TACACS+ en el sistema Huawei.</td>
    </tr>
    <tr>
      <td><code>tacacs-server authentication 10.1.1.200 49 weight 80</code></td>
      <td>Especifica la IP, puerto de transporte 49 y ponderación del servidor TACACS+ en Huawei.</td>
    </tr>
    <tr>
      <td><code>tacacs-server shared-key cipher Huawei TacacsKey</code></td>

<h4>5. Diagnóstico de protocolos de enrutamiento OSPF, BGP y RIP (págs. 136–138)</h4>
<p>En redes multisitio, las averías de comunicación suelen originarse por desajustes en las adyacencias de enrutamiento dinámico. El técnico ejecuta comandos show y debug para identificar la causa exacta del bloqueo:</p>

<pre><code>show ip ospf neighbor
show ip ospf interface
debug ip ospf adj
debug ip ospf hello
interface GigabitEthernet0/0
ip ospf hello-interval 10
ip ospf dead-interval 40
display ospf peer
display ospf interface
show ip bgp neighbors
debug ip bgp
display bgp peer
display bgp routing-table
display bgp summary
show ip protocols
show ip route rip
debug ip rip</code></pre>

    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>

      <td>Verifica el estado de vecindad OSPF, identificando si está en estado Full o bloqueada en Init/ExStart.</td>

      <td><code>show ip ospf interface</code></td>

      <td><code>ip ospf hello-interval 10</code></td>

<h3>Resumen</h3>
<p>El procedimiento UCL 4 de acceso y gestión proporciona las herramientas técnicas indispensables para diagnosticar y recuperar routers corporativos en terreno. Mediante el uso del puerto consola para intervenciones locales y SSH para gestión remota segura, el especialista garantiza la confidencialidad de las credenciales de administración.</p>
<p>Asimismo, la verificación de servidores de autenticación centralizada RADIUS y TACACS+ asegura el control de privilegios administrativos, mientras que los comandos show y display permiten comprobar el estado de adyacencia de protocolos de enrutamiento como OSPF, BGP y RIP. Mantener los temporizadores de saludo sincronizados y monitorizar los registros del búfer garantiza la rápida restauración de los servicios de telecomunicaciones ante cualquier contingencia.</p>` },

      { id: "ucl4_conectividad_interfaces_averias", title: "Procedimiento UCL 4: Conectividad y Red IP", min: 18, html: `<h3>¿Para qué te sirve?</h3>
<p>En la atención técnica a clientes corporativos, resolver fallas de intermitencia, lentitud o cortes de servicio exige validar metódicamente la capa de red y el estado físico de los enlaces. Dominar el protocolo de mensajes de control de Internet ICMP (protocolo de mensajes de control de internet), el parámetro TTL (tiempo de vida) y el analizador NQA (analizador de calidad de red) junto con IP SLA (acuerdo de nivel de servicio sobre protocolo de internet) permite comprobar la latencia y la estabilidad del enlace corporativo.</p>
<p>Asimismo, diagnosticar interfaces de red en routers Cisco y Huawei permite identificar desajustes de velocidad, errores de redundancia cíclica y caídas de protocolo de línea. Aplicar correctamente las listas de control de acceso ACL (lista de control de acceso) y las pruebas de sondeo activo garantiza un diagnóstico rápido y eficaz en terreno.</p>
