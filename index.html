<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia Técnica Cobra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Lenguaje visual Grupo Cobra: tipografía grotesca liviana en mayúsculas con palabra clave en negrita, azul marino + azul medio,
   secciones gris claro, franja de íconos con divisores finos, esquinas rectas, acentos ámbar. Tema claro único, por decisión de marca. */
:root {
  color-scheme: light;
  --navy: #003575; --blue: #3c62ac; --bright: #0069c4; --amber: #f0a500;
  --bg: #f2f2f2; --white: #ffffff; --ink: #334155; --muted: #62646e; --line: #d9dbe0; --line-navy: #003575;
  --ok: #1f7a45; --ok-bg: #e2f1e8; --warn: #9a5b00; --warn-bg: #fdf1d8;
  --f1: #1f5fbf; --f2: #e0701a; --f3: #2c8a45; --f4: #7a4b2a;
  --font: "Helvetica Neue", "Hanken Grotesk", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font) }
img { max-width: 100% }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px }
@media (max-width: 480px) { .wrap { padding-inline: 16px } }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.eyebrow { font: 600 12px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }

.sec-title { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 26px }
.sec-title h2 { font: 200 32px/1.1 var(--font); color: var(--blue); text-transform: uppercase; letter-spacing: .04em }
.sec-title h2 b { font-weight: 700; color: var(--navy) }
.sec-title p { margin: 0; color: var(--muted); max-width: 52ch }

/* ---- cabecera ---- */
header.top { background: var(--white); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; min-height: 72px; padding-block: 8px }
.brand { display: flex; align-items: center; gap: 18px; margin-right: auto; border: 0; background: none; padding: 0; text-align: left }
.brand img { height: 40px; width: auto; display: block }
.brand .sep { width: 1px; height: 34px; background: var(--line) }
.brand b { display: block; font: 300 18px/1.1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--blue) }
.brand b strong { font-weight: 700; color: var(--navy) }
nav.tabs { display: flex; gap: 4px 26px; flex-wrap: wrap }
nav.tabs button { border: 0; background: none; padding: 8px 0; font: 500 14px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent }
nav.tabs button:hover { color: var(--navy) }
nav.tabs button[aria-current="page"] { color: var(--navy); border-bottom-color: var(--amber) }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted) }
.who img { width: 28px; height: 28px; border-radius: 50% }
@media (max-width: 560px) { .brand img { height: 30px } .brand b { font-size: 14px } .brand .sep { height: 26px } }

/* ---- portada ---- */
.hero { position: relative; overflow: hidden; color: #ffffff; background: #003575 }
.hero .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 74%; background: url("Imagenes/fondo-portada.jpg?v=3") 55% 22% / cover no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 25%, rgba(0,0,0,.8) 48%, #000 65%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 25%, rgba(0,0,0,.8) 48%, #000 65%) }
/* velo: navy sólido bajo el texto, se abre hacia la derecha para dejar ver al técnico */
.hero .shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, #003575 0%, #003575 26%, rgba(0, 53, 117, .9) 36%, rgba(0, 53, 117, .68) 46%, rgba(0, 53, 117, .4) 56%, rgba(0, 53, 117, .16) 67%, rgba(0, 53, 117, 0) 82%),
              linear-gradient(0deg, rgba(0, 34, 77, .5) 0%, rgba(0, 34, 77, 0) 38%) }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 600px); gap: 34px; align-content: center; min-height: 560px; padding-block: 72px 64px }
@media (max-width: 860px) {
  .hero .photo { width: 100%; bottom: auto; height: 340px; background-position: 46% 30%; -webkit-mask-image: none; mask-image: none }
  .hero .shade { background: linear-gradient(180deg, rgba(0, 34, 77, 0) 0%, rgba(0, 34, 77, 0) 150px, rgba(0, 53, 117, .9) 300px, #003575 340px) }
  .hero .wrap { min-height: 0; padding-block: 250px 52px }
}
/* textura: haz de fibras ópticas finas sobre el azul, se desvanece antes de la foto */
.hero .fibers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 38%, transparent 66%); mask-image: linear-gradient(90deg, #000 0%, #000 38%, transparent 66%) }
.hero .fibers path { fill: none; vector-effect: non-scaling-stroke }
.hero .fibers .strand path { stroke: rgba(160, 195, 240, .1); stroke-width: 1 }
.hero .fibers .pulse { stroke: rgba(255, 190, 60, .32); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 70 1500; stroke-dashoffset: 1570 }
@media (prefers-reduced-motion: no-preference) {
  .hero .fibers .pulse { animation: pulse 6s linear infinite }
  .hero .fibers .p1 { animation-delay: -2s; animation-duration: 7s }
  .hero .fibers .p2 { animation-delay: -4.5s; animation-duration: 6.5s }
  .hero .fibers .p3 { animation-delay: -1s; animation-duration: 8s }
  .hero .fibers .p4 { animation-delay: -5.5s; animation-duration: 5.5s }
  .hero .fibers .p5 { animation-delay: -3s; animation-duration: 7.5s }
  .hero .fibers .p6 { animation-delay: -6s; animation-duration: 6.8s }
}
@media (prefers-reduced-motion: reduce) { .hero .fibers .pulse { display: none } }
@keyframes pulse { from { stroke-dashoffset: 1570 } to { stroke-dashoffset: 0 } }
@media (max-width: 860px) {
  .hero .fibers { -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 260px, #000 420px); mask-image: linear-gradient(180deg, transparent 0, transparent 260px, #000 420px) }
}
.hero h1, .hero .lede { text-shadow: 0 1px 18px rgba(0, 20, 50, .35) }
.hero .eyebrow { color: #9fc2f0 }
.hero h1 { font: 200 clamp(38px, 5.6vw, 64px)/1.05 var(--font); letter-spacing: .01em; margin: 16px 0 18px }
.hero h1 b { font-weight: 700; display: block }
.hero .lede { color: #c9d7ee; font-size: 18px; font-weight: 300; max-width: 46ch; margin: 0 0 30px }
.cta { display: inline-flex; align-items: center; gap: 18px; border: 0; background: var(--amber); color: #1d1a12; padding: 14px 22px; border-radius: 2px; font: 600 16px/1.25 var(--font); text-align: left }
.cta:hover { background: #ffb61a }
.cta small { display: block; font: 600 11px/1.3 var(--font); letter-spacing: .12em; text-transform: uppercase; opacity: .75 }
.cta .arrow { font-size: 22px; line-height: 1 }
.gauge { border-top: 1px solid rgba(255, 255, 255, .25); padding-top: 28px; max-width: 520px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center }
@media (max-width: 420px) { .gauge { grid-template-columns: 1fr } }
.ring { width: 128px; height: 128px; position: relative }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center }
.ring .val b { font: 200 40px/1 var(--font); font-variant-numeric: tabular-nums }
.ring .val span { font: 600 10px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #9fc2f0 }
.kv { display: grid; gap: 0; margin: 0 }
.kv div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, .18); padding: 11px 0 }
.kv div:last-child { border-bottom: 0 }
.kv dt { color: #c9d7ee; font-size: 14px; font-weight: 300 }
.kv dd { margin: 0; font: 600 20px/1 var(--font); font-variant-numeric: tabular-nums }

/* ---- franja de íconos ---- */
.tiles { background: var(--white); border-bottom: 1px solid var(--line-navy) }
.tiles .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 0 }
.tile { border: 0; background: none; border-right: 1px solid var(--line-navy); padding: 26px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; position: relative }
.tile:last-child { border-right: 0 }
.tile:hover { background: #f7f8fa }
.tile svg { width: 40px; height: 40px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tile span { color: var(--navy); font-size: 15px }
.tile small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em }
.tile::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: var(--p, 0%); background: var(--amber) }
@media (max-width: 700px) {
  .tiles .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .tile:nth-child(2) { border-right: 0 }
  .tile:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
}

/* ---- contenido ---- */
main { padding-block: 64px 88px }
.page { display: flex; flex-direction: column; gap: 72px }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative }
.route::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 23px; height: 1px; background: var(--navy); opacity: .35 }
.route li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-inline: 10px }
.route .node { width: 46px; height: 46px; border-radius: 50%; background: var(--white); border: 1px solid var(--navy); display: grid; place-items: center; font: 300 20px/1 var(--font); color: var(--navy); position: relative; z-index: 1; flex: none }
.route .node.done { background: var(--navy); color: #ffffff }
.route .node.now { border: 2px solid var(--amber); box-shadow: 0 0 0 6px rgba(240, 165, 0, .18) }
.route b { font-weight: 600; color: var(--navy); line-height: 1.3 }
.route small { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px }
@media (max-width: 700px) {
  .route { grid-template-columns: 1fr; gap: 20px }
  .route::before { left: 23px; right: auto; top: 23px; bottom: 23px; width: 1px; height: auto }
  .route li { flex-direction: row; text-align: left; gap: 18px; padding: 0 }
}

.courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px }
@media (max-width: 760px) { .courses { grid-template-columns: 1fr } }
.card { background: var(--white); border: 0; border-top: 3px solid var(--fc); border-radius: 0; padding: 28px 30px 24px; text-align: left; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: box-shadow .2s ease }
.card:hover { box-shadow: 0 14px 30px -18px rgba(0, 53, 117, .45) }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.card h3 { font: 600 24px/1.2 var(--font); color: var(--navy) }
.card p { margin: 0; color: var(--muted); font-size: 15px }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted) }
.facts span::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--blue); margin-right: 8px; vertical-align: 2px }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line) }
.card .more { color: var(--blue); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }
.bar { flex: 1; height: 4px; background: #e6e8ec; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }
.pct { font: 500 13px/1 var(--mono); color: var(--navy); font-variant-numeric: tabular-nums }
.code { font: 600 11.5px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }
.code i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fc); margin-right: 8px; vertical-align: 0 }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; background: #eceef2; color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--ok-bg); color: var(--ok) }
.pill.go { background: var(--warn-bg); color: var(--warn) }
.banner { background: var(--warn-bg); color: var(--ink); padding: 12px 16px; font-size: 14.5px; margin: 0; border-left: 3px solid var(--amber) }

/* ---- curso ---- */
.crumb { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; align-self: start }
.course-hero { background: var(--white); border-top: 3px solid var(--fc); padding: 32px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 36px; align-items: end }
@media (max-width: 640px) { .course-hero { grid-template-columns: 1fr } }
.course-hero h1 { font: 200 clamp(32px, 4.6vw, 46px)/1.08 var(--font); color: var(--navy); margin: 12px 0 14px }
.course-hero .bigpct { text-align: right; display: flex; flex-direction: column; align-items: end; gap: 8px }
.course-hero .bigpct b { font: 200 56px/1 var(--font); color: var(--navy); font-variant-numeric: tabular-nums }
@media (max-width: 640px) { .course-hero .bigpct { align-items: start; text-align: left } }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr } }
.toc { background: var(--white); padding: 14px 0; display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 90px) }
@media (max-width: 860px) { .toc { position: static } }
.toc .eyebrow { padding: 4px 20px 10px }
.toc button { border: 0; background: none; text-align: left; padding: 12px 20px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent }
.toc button:hover { background: #f7f8fa }
.toc button[aria-current="true"] { border-left-color: var(--amber); background: #f7f8fa; color: var(--navy); font-weight: 600 }
.toc button small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); margin-top: 3px }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #b9c0cc; display: grid; place-items: center; font: 500 11px/1 var(--mono); color: var(--muted) }
.dot.done { background: var(--navy); border-color: var(--navy); color: #ffffff }
.dot.cur { border-color: var(--amber); color: var(--navy) }
.reader { background: var(--white); padding: clamp(24px, 4vw, 48px); min-width: 0 }
.reader h2 { font: 300 34px/1.15 var(--font); color: var(--navy); margin: 10px 0 24px }
.body { max-width: 68ch; font-size: 17px }
.body p, .body ul, .body ol { margin: 0 0 16px }
.body li { margin-bottom: 8px }
.body li::marker { color: var(--blue); font-weight: 600 }
.body strong { font-weight: 600; color: var(--navy) }
.spec { overflow-x: auto; margin: 6px 0 22px }
.spec table { border-collapse: collapse; font-size: 15px; width: 100%; min-width: 440px }
.spec th, .spec td { padding: 11px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line) }
.spec th { background: var(--navy); color: #ffffff; font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .1em }
.spec tr:nth-child(odd) td { background: #f7f8fa }
.spec td.n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy) }
.tip { background: var(--warn-bg); padding: 14px 18px; margin: 0 0 18px; font-size: 15.5px; border-left: 3px solid var(--amber) }
.tip::before { content: "Importante"; display: block; font: 700 11px/1.4 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--warn); margin-bottom: 2px }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line) }
.btn { border: 1px solid var(--navy); background: var(--white); color: var(--navy); padding: 12px 20px; border-radius: 2px; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase }
.btn:hover { background: #f2f5fa }
.btn.primary { background: var(--navy); color: #ffffff }
.btn.primary:hover { background: #00428f }

/* ---- evaluación ---- */
.q { border: 1px solid var(--line); padding: 18px 20px; margin: 0 0 14px }
.q legend { font-weight: 600; padding: 0 6px; font-size: 17px; color: var(--navy) }
.q label { display: flex; gap: 12px; align-items: flex-start; padding: 8px; cursor: pointer }
.q label:hover { background: #f7f8fa }
.q label input { margin-top: 5px; accent-color: var(--navy) }
.q.right { border-color: var(--ok); border-left: 3px solid var(--ok) }
.q.wrong { border-color: var(--amber); border-left: 3px solid var(--amber) }
.q .why { font-size: 14px; color: var(--muted); margin: 8px 8px 0 }
.result { padding: 16px 20px; margin: 0 0 20px; font-weight: 600; border-left: 3px solid }
.result.ok { background: var(--ok-bg); color: var(--ok) }
.result.no { background: var(--warn-bg); color: var(--warn) }

/* ---- avance y certificados ---- */
.page-head h1 { font: 200 clamp(36px, 5vw, 54px)/1.05 var(--font); color: var(--navy); margin: 12px 0 10px }
.page-head p { color: var(--muted); margin: 0; max-width: 60ch; font-size: 17px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--white); border-bottom: 1px solid var(--navy) }
@media (max-width: 600px) { .stats { grid-template-columns: 1fr } }
.stat { padding: 24px 28px; border-right: 1px solid var(--line) }
.stat:last-child { border-right: 0 }
.stat b { display: block; font: 200 42px/1 var(--font); color: var(--navy); font-variant-numeric: tabular-nums; margin-bottom: 6px }
.stat span { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase }
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(310px, 100%), 1fr)); gap: 24px }
.cert { background: var(--white); padding: 10px; box-shadow: 0 16px 34px -22px rgba(0, 53, 117, .5) }
.cert .frame { border: 1px solid var(--navy); padding: 30px 26px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative }
.cert .frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--navy) 0 50%, var(--amber) 50% 100%) }
.cert img { height: 30px; width: auto; margin-bottom: 12px }
.cert .k { font: 600 10.5px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--blue) }
.cert .t { font: 300 26px/1.15 var(--font); color: var(--navy); margin: 8px 0 12px }
.cert .n { font: 600 19px/1.2 var(--font); color: var(--ink); border-bottom: 1px solid var(--line); padding: 4px 18px 8px; margin-bottom: 6px }
.cert .m { font: 500 12px/1.5 var(--mono); color: var(--muted); margin-bottom: 8px }
.panel { background: var(--white) }
.table { overflow-x: auto }
.table table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 15px }
.table th, .table td { padding: 13px 20px; border-bottom: 1px solid var(--line); text-align: left }
.table th { background: var(--navy); color: #ffffff; font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .1em }
.table td.n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums }
.person { display: flex; align-items: center; gap: 8px }
.person img { width: 26px; height: 26px; border-radius: 50% }
.mini { display: inline-block; width: 48px; height: 4px; background: #e6e8ec; overflow: hidden; vertical-align: middle; margin-right: 8px }
.mini i { display: block; height: 100% }
.empty { background: var(--white); border: 1px dashed #b9c0cc; padding: 36px; text-align: center; color: var(--muted) }

/* ---- ingreso ---- */
body.locked nav.tabs, body.locked .who, body.locked #hero-slot { display: none }
body.locked main { padding: 0 }
.login { position: relative; overflow: hidden; min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 48px 16px; color: #ffffff; background: #003575 }
.login .photo { position: absolute; inset: 0; background: url("Imagenes/fondo-portada.jpg?v=3") 55% 25% / cover no-repeat }
.login .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 53, 117, .96) 0%, rgba(0, 53, 117, .9) 40%, rgba(0, 53, 117, .55) 100%) }
.login .card { position: relative; width: min(420px, 100%); background: rgba(0, 34, 77, .55); border: 1px solid rgba(255, 255, 255, .18); border-top: 3px solid var(--amber); padding: 34px 30px 30px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px) }
.login h1 { font: 200 34px/1.1 var(--font); margin: 12px 0 8px }
.login h1 b { font-weight: 700 }
.login .eyebrow { color: #9fc2f0 }
.login p.sub { color: #c9d7ee; margin: 0 0 24px; font-weight: 300 }
.login label { display: block; font: 600 11px/1.3 var(--font); letter-spacing: .12em; text-transform: uppercase; color: #c9d7ee; margin: 0 0 7px }
.login input { width: 100%; font: 400 17px/1.3 var(--font); padding: 13px 14px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .95); color: var(--ink); border-radius: 2px; margin-bottom: 18px }
.login input:focus { outline: 2px solid var(--amber); outline-offset: 1px }
.login .cta { width: 100%; justify-content: center; margin-top: 6px }
.login .err { background: rgba(240, 165, 0, .16); border-left: 3px solid var(--amber); color: #ffe2a8; padding: 10px 14px; font-size: 14.5px; margin: 0 0 18px }
.login .help { margin: 18px 0 0; font-size: 13.5px; color: #9fc2f0; font-weight: 300 }
.who { gap: 14px }
.who .me { display: flex; flex-direction: column; line-height: 1.25; text-align: right }
.who .me b { color: var(--navy); font-weight: 600; font-size: 14px }
.who .me small { font: 500 11px/1.3 var(--mono); color: var(--muted) }
.who button { border: 1px solid var(--line); background: var(--white); color: var(--navy); padding: 7px 12px; border-radius: 2px; font: 600 11px/1 var(--font); letter-spacing: .1em; text-transform: uppercase }
.who button:hover { border-color: var(--navy) }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.filters input, .filters select { font: 400 15px/1.3 var(--font); padding: 10px 12px; border: 1px solid var(--line); background: var(--white); color: var(--ink); border-radius: 2px }
.filters input { flex: 1; min-width: 220px }
.table button.reset { border: 1px solid var(--line); background: var(--white); color: var(--navy); padding: 6px 10px; border-radius: 2px; font: 600 11px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }
.table button.reset:hover { border-color: var(--navy); background: #f2f5fa }

/* ---- editor de evaluaciones y detalle ---- */
.ed-cursos { display: flex; flex-wrap: wrap; gap: 10px }
.ed { background: var(--white); padding: clamp(20px, 4vw, 44px) }
.ed-cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px 24px; margin: 0 0 26px; align-items: end }
.ed-cfg label { display: flex; flex-direction: column; gap: 7px; font: 600 11px/1.3 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.ed-cfg label.chk { flex-direction: row; align-items: center; gap: 10px; font: 400 15px/1.4 var(--font); letter-spacing: 0; text-transform: none; color: var(--ink); padding-bottom: 10px }
.ed-cfg label.chk input { width: 18px; height: 18px; accent-color: var(--navy) }
.ed input[type="number"], .ed input[type="text"], .ed textarea { width: 100%; font: 400 16px/1.4 var(--font); padding: 10px 12px; border: 1px solid #b9c0cc; border-radius: 2px; color: var(--ink); background: var(--white) }
.ed textarea { resize: vertical }
.edq .hint { font-size: 13px; color: var(--muted); margin: 12px 0 2px }
.edq .alt { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; gap: 10px; align-items: center; margin-top: 8px }
.edq .alt input[type="radio"] { width: 18px; height: 18px; accent-color: var(--navy) }
.mini-btn { border: 1px solid var(--line); background: var(--white); width: 34px; height: 34px; border-radius: 2px; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 }
.mini-btn:hover { border-color: var(--navy); color: var(--navy) }
button.link { border: 0; background: none; padding: 0; color: var(--navy); font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: #b9c0cc; text-underline-offset: 3px }
button.link:hover { text-decoration-color: var(--amber) }

/* ---- easter eggs ---- */
.hero.burst .fibers .strand path { stroke: rgba(160, 195, 240, .32) }
.hero.burst .fibers .pulse { stroke: rgba(255, 205, 90, .95) !important; stroke-width: 2.2; animation-duration: 1.3s !important }
body.noche .hero .fibers .pulse { stroke: rgba(120, 200, 255, .38) }
body.festivo .hero .fibers .p0 { stroke: var(--c0) } body.festivo .hero .fibers .p1 { stroke: var(--c1) }
body.festivo .hero .fibers .p2 { stroke: var(--c2) } body.festivo .hero .fibers .p3 { stroke: var(--c3) }
body.festivo .hero .fibers .p4 { stroke: var(--c4) } body.festivo .hero .fibers .p5 { stroke: var(--c5) }
body.festivo .hero .fibers .p6 { stroke: var(--c6) }
.egg-toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: opacity .35s ease, transform .35s ease;
  background: #00224d; color: #ffffff; border-left: 3px solid var(--amber); padding: 14px 20px; box-shadow: 0 18px 40px -16px rgba(0, 20, 50, .6); max-width: min(460px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 2px }
.egg-toast.on { opacity: 1; transform: translate(-50%, 0) }
.egg-toast b { font-size: 16px }
.egg-toast span { color: #c9d7ee; font-size: 14.5px; font-weight: 300 }
.egg-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0, 20, 50, .55); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .3s ease }
.egg-overlay.on { opacity: 1 }
.egg-card { position: relative; width: min(560px, 100%); background: #00224d; color: #ffffff; border-top: 3px solid var(--amber); padding: 30px clamp(18px, 4vw, 34px) 26px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6) }
.egg-card h2 { font: 200 30px/1.1 var(--font); margin: 10px 0 16px }
.egg-card h2 b { font-weight: 700 }
.egg-card .eyebrow { color: #9fc2f0 }
.egg-card p { margin: 0 0 6px; color: #c9d7ee }
.egg-card .jv { color: #ffffff; letter-spacing: .06em }
.egg-card .lema { font: 300 13px/1.4 var(--font); letter-spacing: .16em; text-transform: uppercase; color: #9fc2f0 }
.egg-card .meta { font: 500 12px/1.4 var(--mono); color: #7f9cc4; margin-top: 14px }
.egg-close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: #9fc2f0; font-size: 26px; line-height: 1; padding: 4px 8px }
.egg-close:hover { color: #ffffff }
.egg-svg { width: 100%; height: auto; display: block; margin: 4px 0 14px }
.egg-svg .eje { stroke: rgba(255, 255, 255, .3); stroke-width: 1; fill: none }
.egg-svg .traza { stroke: var(--amber); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: trazar 2.6s ease-out forwards }
.egg-svg text { fill: #9fc2f0; font: 500 10px var(--mono) }
.egg-svg .ev { opacity: 0; animation: aparecer .4s ease forwards }
.egg-svg .run { stroke-dasharray: 18 300; animation: correr 2.4s linear infinite }
@keyframes trazar { to { stroke-dashoffset: 0 } }
@keyframes aparecer { to { opacity: 1 } }
@keyframes correr { from { stroke-dashoffset: 318 } to { stroke-dashoffset: 0 } }
.egg-confeti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 65; pointer-events: none }
#jvsoft { cursor: default; user-select: none }
@media (prefers-reduced-motion: reduce) { .egg-svg .traza { animation: none; stroke-dashoffset: 0 } .egg-svg .ev { animation: none; opacity: 1 } .egg-svg .run { animation: none } }

/* ---- pie ---- */
footer.foot { background: var(--navy); color: #c9d7ee; font-size: 14px }
footer.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-block: 28px }
footer.foot img { height: 28px; width: auto; background: #ffffff; padding: 5px 10px; display: block }
footer.foot span { font-weight: 300; letter-spacing: .1em; text-transform: uppercase; font-size: 12px }
footer.foot .by { font-size: 9px; letter-spacing: .08em; opacity: .85 }
footer.foot .by b, .hero .credit b { text-transform: none; font-weight: 700; color: #ffffff; letter-spacing: .08em }
.hero .credit { margin: 0; font: 300 10px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #9fc2f0 }

@media (prefers-reduced-motion: no-preference) {
  .bar i, .mini i, .tile::after { transition: width .5s ease }
  .ring circle.arc { transition: stroke-dashoffset .8s ease }
}

/* RUT: "12.345.678-k" -> "12345678-K"; valida dígito verificador */
function rutNormalizar(v) {
  const t = String(v || "").toUpperCase().replace(/[^0-9K]/g, "");
  return t.length < 2 ? "" : t.slice(0, -1) + "-" + t.slice(-1);
}
function rutValido(v) {
  const r = rutNormalizar(v); if (!/^[0-9]{6,8}-[0-9K]$/.test(r)) return false;
  const [cuerpo, dv] = r.split("-"); let suma = 0, mult = 2;
  for (let i = cuerpo.length - 1; i >= 0; i--) { suma += +cuerpo[i] * mult; mult = mult === 7 ? 2 : mult + 1; }
  const res = 11 - (suma % 11);
  return dv === (res === 11 ? "0" : res === 10 ? "K" : String(res));
}
function rutFormato(v) {
  const r = rutNormalizar(v); if (!r) return String(v || "").replace(/[^0-9kK]/g, "");
  const [c, d] = r.split("-"); return c.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + d;
}

      ${r.aprobado ? `<p>Tu certificado quedó en <b>Mi avance</b>.</p>` : esTec ? `<p>${quedan > 0 ? `Te ${quedan === 1 ? "queda 1 intento" : `quedan ${quedan} intentos`}. Repasa las lecciones antes de volver a intentarlo.` : "Agotaste tus intentos. Pide a tu supervisor que te habilite nuevos intentos."}</p>` : ""}
      <div class="actions">${!r.aprobado && (quedan > 0 || !esTec) ? `<button type="button" class="btn primary" data-retry>Intentar de nuevo</button>` : ""}${volver}</div>`;
  if (esTec && pr.aprobado) return head + `<p class="result ok">Aprobaste esta evaluación con ${pr.mejor_nota}%.</p><div class="actions">${volver}</div>`;
  if (esTec && quedan === 0) return head + `<p class="result no">Agotaste tus ${pr.max_intentos} intentos. Tu mejor nota fue ${pr.mejor_nota}%.</p><p>Pide a tu supervisor que te habilite nuevos intentos.</p><div class="actions">${volver}</div>`;
  const ready = st.done === st.total;
  return head + `
      <p class="facts" style="margin:0 0 20px"><span>${pr.preguntas.length} preguntas</span><span>Aprueba con ${pr.aprobacion}%</span>${esTec ? `<span>Intento ${pr.intentos + 1} de ${pr.max_intentos}</span>` : `<span>Modo revisión: sin límite de intentos</span>`}</p>
      ${!ready ? `<p class="banner" style="margin-bottom:20px">Te faltan ${st.total - st.done} lección(es) por completar. Conviene terminarlas antes de rendir: tienes ${pr.max_intentos} intentos.</p>` : ""}
      ${S.pruebaError ? `<p class="banner" style="margin-bottom:20px" role="alert">${esc(S.pruebaError)}</p>` : ""}
      <form id="quiz">${pr.preguntas.map((q, i) => `<fieldset class="q"><legend>${i + 1}. ${esc(q.enunciado)}</legend>
          ${q.alternativas.map((a, j) => `<label><input type="radio" id="q${i}-${j}" name="q${i}" value="${j}" ${S.answers[i] === j ? "checked" : ""} ${S.enviando ? "disabled" : ""}><span>${esc(a)}</span></label>`).join("")}
        </fieldset>`).join("")}
        <div class="actions"><button type="submit" class="btn primary" id="quiz-submit" ${S.enviando ? "disabled" : ""}>${S.enviando ? "Enviando…" : "Enviar respuestas"}</button></div>
      </form>`;
}

async function guardarEditor() {
  const ed = S.ed, ap = +ed.cfg.aprobacion, mi = +ed.cfg.max_intentos;
  const fallo = m => { ed.aviso = m; ed.error = true; render(); document.getElementById("ed-form")?.scrollIntoView({ block: "start" }); };
  if (!(Number.isInteger(ap) && ap >= 1 && ap <= 100)) return fallo("La nota para aprobar debe ser un número entre 1 y 100.");
  if (!(Number.isInteger(mi) && mi >= 1 && mi <= 20)) return fallo("Los intentos deben ser un número entre 1 y 20.");
  for (const [i, q] of ed.preguntas.entries()) {
    if (!q.enunciado.trim()) return fallo(`La pregunta ${i + 1} no tiene enunciado.`);
    if (q.alternativas.some(a => !a.trim())) return fallo(`La pregunta ${i + 1} tiene una alternativa vacía.`);
    if (!(q.correcta >= 0 && q.correcta < q.alternativas.length)) return fallo(`Marca la alternativa correcta de la pregunta ${i + 1}.`);
  }
  ed.guardando = true; ed.aviso = ""; render();
  try {
    let r = await sb.from("pruebas").upsert({ curso_id: ed.curso, aprobacion: ap, max_intentos: mi, activa: !!ed.cfg.activa, actualizado_en: new Date().toISOString() });
    if (r.error) throw r.error;
    if (ed.borradas.length) { r = await sb.from("preguntas").delete().in("id", ed.borradas); if (r.error) throw r.error; }
    const filas = ed.preguntas.map((q, i) => ({ id: q.id || (q.id = crypto.randomUUID()), curso_id: ed.curso, orden: i, enunciado: q.enunciado.trim(), alternativas: q.alternativas.map(a => a.trim()), correcta: q.correcta }));
    if (filas.length) { r = await sb.from("preguntas").upsert(filas); if (r.error) throw r.error; }
    ed.borradas = []; ed.error = false;
    ed.aviso = `Evaluación guardada: ${filas.length} pregunta${filas.length === 1 ? "" : "s"}.`;
  } catch (e) {
    ed.error = true;
    ed.aviso = /permission|policy|security/i.test(e?.message || "") ? "No se pudo guardar: solo los administradores pueden editar evaluaciones." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
  }
  ed.guardando = false; render(); document.getElementById("ed-form")?.scrollIntoView({ block: "start" });
}
function editorClick(t) {
  const ed = S.ed, d = t.dataset;
  if (d.edCurso) { cargarEditor(d.edCurso); return true; }
  if (t.hasAttribute("data-ed-mas")) { ed.preguntas.push({ enunciado: "", alternativas: ["", "", "", ""], correcta: -1 }); ed.aviso = ""; render(); document.querySelector(`[data-edq="${ed.preguntas.length - 1}"]`)?.focus(); return true; }
  if (d.edQuitar != null) {
    const q = ed.preguntas[+d.edQuitar];
    if ((q.enunciado.trim() || q.id) && !confirm(`¿Eliminar la pregunta ${+d.edQuitar + 1}? Se borra al guardar la evaluación.`)) return true;
    if (q.id) ed.borradas.push(q.id);
    ed.preguntas.splice(+d.edQuitar, 1); render(); return true;
  }
  if (d.edMasAlt != null) { ed.preguntas[+d.edMasAlt].alternativas.push(""); render(); return true; }
  if (d.edQuitarAlt != null) {
    const [i, j] = d.edQuitarAlt.split("-").map(Number), q = ed.preguntas[i];
    q.alternativas.splice(j, 1);
    q.correcta = q.correcta === j ? -1 : q.correcta > j ? q.correcta - 1 : q.correcta;
    render(); return true;
  }
  return false;
}

async function descargarExcel() {
  S.descargando = true; render();

    await cargarXLSX();

    });

    const porId = Object.fromEntries(S.team.map(t => [t.id, t]));
    const evals = (res || []).filter(r => porId[r.usuario_id]).map(r => { const t = porId[r.usuario_id], c = course(r.curso_id);
      return { "Técnico": t.nombre, "RUT": rutFormato(t.rut), "Curso": c ? `${c.code} ${c.title}` : r.curso_id, "Mejor nota": r.mejor_nota + "%", "Aprobado": r.aprobado ? "Sí" : "No", "Intentos": r.intentos, "Última nota": r.ultima_nota == null ? "" : r.ultima_nota + "%", "Último intento": r.fecha_ultimo ? fmtFechaHora(r.fecha_ultimo) : "" }; })
      .sort((a, b) => a["Técnico"].localeCompare(b["Técnico"]) || a["Curso"].localeCompare(b["Curso"]));
    const wb = XLSX.utils.book_new();
    const h1 = XLSX.utils.json_to_sheet(avance.length ? avance : [{ "Técnico": "Sin técnicos registrados" }]);
    const h2 = XLSX.utils.json_to_sheet(ingresos.length ? ingresos : [{ "Fecha y hora": "Sin ingresos registrados" }]);
    h1["!cols"] = [{ wch: 32 }, { wch: 14 }, ...COURSES.map(() => ({ wch: 22 })), { wch: 13 }, { wch: 18 }];
    h2["!cols"] = [{ wch: 18 }, { wch: 32 }, { wch: 14 }, { wch: 12 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, h1, "Avance");

    XLSX.utils.book_append_sheet(wb, h2, "Ingresos");
    XLSX.writeFile(wb, `academia-tecnica-${new Date().toISOString().slice(0, 10)}.xlsx`);
    S.aviso = "";
  } catch {
    S.aviso = "No se pudo generar el Excel. Revisa tu conexión e inténtalo de nuevo.";
  }
  S.descargando = false; render();
}

async function loadTeam() {
  const [{ data: perfiles, error: e1 }, { data: avances, error: e2 }] = await Promise.all([

}

let strandsRaf = 0;
function drawStrands() {
  const cv = document.getElementById("strands"); if (!cv) return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = Array.from({ length: 12 }, (_, i) => ({ y: h * (0.2 + i * 0.06), a: 8 + (i % 5) * 6, f: 0.004 + (i % 4) * 0.0012, p: i * 0.7, hot: i % 4 === 1 }));
  let t = 0;
  cancelAnimationFrame(strandsRaf);
  const frame = () => {
    ctx.clearRect(0, 0, w, h);
    const x0 = w * 0.42;
    for (const l of lines) {
      ctx.beginPath();
      for (let x = x0; x <= w + 12; x += 12) {
        const y = l.y + Math.sin(x * l.f + l.p + t) * l.a + (x - x0) * 0.16;
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = l.hot ? "rgba(240,165,0,.28)" : "rgba(160,190,235,.13)";
      ctx.lineWidth = l.hot ? 1.6 : 1;
      ctx.stroke();
    }
    t += 0.005;
    if (!reduce && document.getElementById("strands") === cv) strandsRaf = requestAnimationFrame(frame);
  };
  frame();
}

async function doLogin(form) {
  const rut = form.rut.value, clave = form.clave.value;
  if (!rutValido(rut)) { S.loginError = "Revisa tu RUT: el dígito verificador no coincide."; render(); document.getElementById("l-rut").value = rut; return; }
  if (!clave) { S.loginError = "Escribe tu contraseña."; render(); document.getElementById("l-rut").value = rutFormato(rut); return; }
  S.busy = true; S.loginError = ""; render();
  const { error } = await sb.auth.signInWithPassword({ email: rutEmail(rut), password: clave });
  S.busy = false;
  if (error) {
    S.loginError = /invalid/i.test(error.message) ? "RUT o contraseña incorrectos." : /rate|too many/i.test(error.message) ? "Demasiados intentos. Espera un minuto e inténtalo de nuevo." : "No se pudo ingresar. Revisa tu conexión e inténtalo de nuevo.";
    render(); const r = document.getElementById("l-rut"); if (r) r.value = rutFormato(rut);
    return;
  }
  await entrar();
}
async function doCambioClave() {
  const a = document.getElementById("c-1").value, b = document.getElementById("c-2").value;
  if (a.length < 8) { S.loginError = "La contraseña debe tener al menos 8 caracteres."; render(); return; }
  if (a !== b) { S.loginError = "Las contraseñas no coinciden."; render(); return; }
  S.busy = true; S.loginError = ""; render();
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) {
    S.busy = false;
    S.loginError = /different|same/i.test(error.message) ? "La nueva contraseña debe ser distinta a la inicial." : /weak|short/i.test(error.message) ? "La contraseña es muy débil. Usa letras y números." : "No se pudo guardar la contraseña. Inténtalo de nuevo.";
    render(); return;
  }
  await sb.rpc("marcar_clave_cambiada");
  S.busy = false;
  await entrar();
}
async function entrar() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { S.auth = "fuera"; render(); return; }
  const { data: perfil } = await sb.from("perfiles").select("id, rut, nombre, rol, debe_cambiar_clave").eq("id", user.id).maybeSingle();
  if (!perfil) { await sb.auth.signOut(); S.auth = "fuera"; S.loginError = "Tu cuenta no tiene perfil en la academia. Avísale a tu supervisor."; render(); return; }
  S.me = perfil; S.loginError = "";
  if (perfil.debe_cambiar_clave) { S.auth = "cambiar"; render(); return; }
  const { data: av } = await sb.from("avance").select("lecciones, evaluaciones, actualizado_en").eq("usuario_id", perfil.id).maybeSingle();
  S.progress = { lessons: av?.lecciones || {}, quiz: av?.evaluaciones || {}, updatedAt: av?.actualizado_en || null };
  S.canSupervise = perfil.rol === "supervisor" || perfil.rol === "admin";
  S.auth = "ok"; S.view = "cursos"; render();
  sb.from("ingresos").insert({ usuario_id: perfil.id, dispositivo: dispositivo() }).then(() => {});

const EGG = { keys: [], letras: "", clicks: [] };

function eggToast(html, ms = 5000) {
  document.querySelector(".egg-toast")?.remove();
  const el = document.createElement("div"); el.className = "egg-toast"; el.setAttribute("role", "status"); el.innerHTML = html;
  document.body.appendChild(el); requestAnimationFrame(() => el.classList.add("on"));
  setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 400); }, ms);
}
function eggCard(html, ms) {
  document.querySelector(".egg-overlay")?.remove();
  const ov = document.createElement("div"); ov.className = "egg-overlay";
  ov.innerHTML = `<div class="egg-card" role="dialog" aria-modal="true">${html}<button type="button" class="egg-close" aria-label="Cerrar">×</button></div>`;
  const onKey = e => { if (e.key === "Escape") cerrar(); };
  const cerrar = () => { ov.classList.remove("on"); setTimeout(() => ov.remove(), 300); document.removeEventListener("keydown", onKey); };
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest(".egg-close")) cerrar(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add("on"));
  ov.querySelector(".egg-close").focus();
  if (ms) setTimeout(cerrar, ms);
}

      <path class="traza" d="M40 30 L44 16 L49 44 L180 80 L182 92 L300 126 L302 110 L307 140 L420 170 L424 64 L430 184 L437 196 L446 192 L453 199 L462 193 L472 198 L483 194 L496 199 L508 195"/>
      ${ev(46, 44, "Conector", .5, "start")}${ev(181, 80, "Empalme", 1.1)}${ev(304, 110, "Conector", 1.6)}${ev(424, 64, "Fin de fibra", 2.1)}

// 4) Ruta completa: confeti con los 12 colores del código de fibras
function confeti() {
  if (sinMovimiento()) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;

  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.7, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2, w: 6 + Math.random() * 7, h: 3 + Math.random() * 3, c: COLORES_FIBRA[Math.floor(Math.random() * 12)] }));
  const t0 = performance.now();

  const n = h + l - 7 * m + 114; return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
