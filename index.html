{
  id: "iot", code: "IOT-201", complementario: true, color: "--f5", fiber: "Gris", short: "IoT en el hogar",
  title: "IoT en el hogar: lo que el técnico debe cuidar",
  summary: "Equipos inteligentes en el hogar, cómo se conectan y qué cuidar al cambiar el router o poner un extensor para no dejarlos desconectados.",
  lessons: [
    { id: "video", title: "IoT en el hogar: videos y manual", min: 10, html: `
      <div class="video"><iframe src="https://player.vimeo.com/video/1238483074?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="Video: IoT en el hogar" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <p>Mira también el video de apoyo: un cambio de router en una casa con equipos inteligentes, de principio a fin.</p>
      <div class="video"><iframe src="https://player.vimeo.com/video/1238459673?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="Video de apoyo: cambio de router en una casa con IoT" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <p>Después revisa el manual, que resume las cinco lecciones del curso:</p>
      <p><a class="btn primary" href="https://drive.google.com/file/d/1e2sDzRLoDsUK9eepiuTAYtq4TNK45z4u/view" target="_blank" rel="noopener">Ver manual de IoT en el hogar</a></p>
      <div class="tip">El manual se abre en una pestaña nueva. Cuando termines los videos y el manual, presiona <strong>Completar y seguir</strong>.</div>` },
    { id: "red", title: "¿Qué es IoT y cómo cambió la red en el hogar?", min: 6, html: `
      <p>La Internet de las cosas (IoT) interconecta objetos cotidianos capaces de transferir datos por la red sin requerir interacción humana.</p>
      <p>Hace diez años la red del hogar era simple: un computador cableado de 100 Mbps y un notebook por WiFi 802.11b/g de 54 Mbps.</p>
      <figure class="esquema"><img src="Imagenes/iot/iot_red_10_anos.jpg" alt="Red domiciliaria típica de hace 10 años" loading="lazy"><figcaption>Red domiciliaria de hace 10 años: un computador cableado y un notebook en WiFi de 54 Mbps.</figcaption></figure>
      <p>Hoy las redes hogareñas son más complejas, con Smart TV, consolas, electrodomésticos y múltiples terminales móviles conectados a la vez.</p>
      <figure class="esquema"><img src="Imagenes/iot/iot_red_actual.jpg" alt="Red domiciliaria contemporánea con múltiples dispositivos" loading="lazy"><figcaption>Red domiciliaria actual: múltiples dispositivos móviles y entretenimiento conectados a WiFi y Ethernet.</figcaption></figure>
      <p>Al integrar dispositivos IoT se suman enchufes inteligentes, asistentes de voz, ampolletas y cámaras de vigilancia conectadas concurrentemente.</p>
      <figure class="esquema"><img src="Imagenes/iot/iot_entorno_hogar.jpg" alt="Entorno del hogar con dispositivos IoT conectados al router" loading="lazy"><figcaption>Entorno IoT: enchufes, asistentes de voz y cámaras conectados a la red del hogar.</figcaption></figure>
      <p>El aumento masivo de terminales inteligentes representa hoy un gran desafío para los operadores al mejorar sus routers.</p>
      ${erroresSeg(["Asumir que la red solo atiende computadores y teléfonos, ignorando la carga de los equipos IoT", "Desconectar terminales del cliente sin verificar previamente qué servicios inteligentes dependen de la red"])}
` },
    { id: "equipos", title: "Equipos IoT en el domicilio y formas de conexión", min: 7, html: `
      <div class="tip">Antes de cambiar el router, pregúntale al cliente qué equipos inteligentes tiene conectados (cámaras, enchufes, alarma, asistentes de voz, aspiradora, TV) y cuáles son los más importantes para él.</div>
      <p>En el domicilio conviven distintos tipos de conexión según la tecnología del equipo y las características del fabricante.</p>
      <figure class="esquema"><img src="Imagenes/iot/iot_categorias_equipos.jpg" alt="Categorías de dispositivos inteligentes en el hogar" loading="lazy"><figcaption>Categorías de equipos en el hogar: climatización, puentes, cámaras, luces, cerraduras y enchufes.</figcaption></figure>
      <p>Las cámaras de vigilancia se conectan por WiFi para permitir el monitoreo directo y remoto a través de internet.</p>
      <p>Los enchufes inteligentes permiten encender y apagar artefactos a distancia y en algunos casos controlar el consumo eléctrico.</p>
      <p>Muchos equipos de domótica funcionan solo en la banda de 2,4 GHz.</p>
      <figure class="esquema"><video src="Imagenes/iot/iot_aspiradora_robot.mp4" poster="Imagenes/iot/iot_aspiradora_robot.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Aspiradora robot funcionando en casa"></video><figcaption>Aspiradora robot: parte de los equipos inteligentes que el cliente puede tener conectados en el hogar.</figcaption></figure>
      <p>Algunos equipos no se conectan solos a la red: lo hacen a través de un puente, que es el que se conecta al router.</p>
      <p>Las cerraduras inteligentes permiten controlar la apertura de puertas, utilizan pilas y se comunican habitualmente por Bluetooth.</p>
      <p>Los interruptores inteligentes requieren un cable neutro en la caja del interruptor.</p>
      <figure class="esquema"><img src="Imagenes/iot/iot_pantalla_inteligente.jpg" alt="Pantalla inteligente para control del hogar" loading="lazy"><figcaption>Pantalla inteligente (ejemplo: Google Home Hub) como asistente para dar órdenes y controlar dispositivos.</figcaption></figure>
      ${erroresSeg(["Cambiar el router sin consultar al cliente qué equipos inteligentes tiene y cuáles son críticos"])}
` },
    { id: "wifi", title: "Protocolo WiFi al cambiar el router: credenciales, seguridad y banda 2,4 GHz", min: 7, html: `
      <div class="tip">Cuando cambies un router, mantén las credenciales de WiFi para que los dispositivos de domótica sigan conectados.</div>
      <div class="tip">Anota el nombre de la red y la clave exactos del router anterior (mayúsculas, minúsculas, espacios y símbolos) antes de desconectarlo, desde la etiqueta o preguntándole al cliente.</div>
      <p>Si el nombre de red o la clave cambian en una sola letra, los equipos que se conectan por WiFi quedan desconectados.</p>
      <p>El protocolo de seguridad WPA tiene como objetivo proteger la información que se transmite a través de la red WiFi.</p>
      <div class="tip">Usa el mismo tipo de seguridad que tenía el router anterior. Algunos equipos antiguos no se conectan a una red solo WPA3: si el router lo permite, deja el modo mixto WPA2/WPA3.</div>
      <div class="tip">Muchos equipos de domótica funcionan solo en 2,4 GHz. Si no se conectan con la red unificada, aplica lo de FTTH-103 (apagar un momento la banda de 5 GHz para emparejarlos).</div>
      <figure class="esquema"><img src="Imagenes/iot/iot_router_wifi6.jpg" alt="Router WiFi 6 para instalación en cliente" loading="lazy"><figcaption>Al cambiar el router, mantén las credenciales de WiFi para que los dispositivos de domótica sigan conectados.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/iot/iot_red_topologia.jpg" alt="Topología de red en el hogar con router y puente" loading="lazy"><figcaption>Topología de red en el hogar: el router emite en 2,4 GHz y 5 GHz hacia dispositivos directos y puentes intermediarios.</figcaption></figure>
      ${erroresSeg(["Modificar el SSID o la clave WiFi anterior provocando la desconexión total de los equipos IoT", "Configurar seguridad solo WPA3 en el router nuevo impidiendo la conexión de equipos más antiguos", "Dejar equipos de 2,4 GHz sin enlazar por no apagar temporalmente la banda de 5 GHz del router"])}
` },
    { id: "redlocal", title: "Red local avanzada: DVRs, IP fija, puertos y extensores mesh", min: 7, html: `
      <p>A nivel de red local los dispositivos se conectarán al router o extensores tanto en redes de 5 GHz como de 2,4 GHz.</p>
      <div class="tip">Si el cliente tiene un grabador de cámaras (DVR o NVR) o equipos con IP fija, el router nuevo debe usar el mismo rango de red que el anterior (por ejemplo 192.168.1.x). Si cambia, esos equipos quedan sin conexión.</div>
      <div class="tip">Las configuraciones especiales del router anterior (puertos abiertos para ver cámaras desde afuera, filtros o controles parentales) se pierden al cambiarlo. Avísale al cliente antes de irte.</div>
      <div class="tip">El extensor debe mantener el mismo nombre de red que el router (como el BP3 en modo mesh). Si crea una red con otro nombre (por ejemplo "…_EXT"), los equipos IoT no cambian solos de red y se desconectan al moverse o al quedar lejos.</div>
      <div class="tip">Ubica el extensor a medio camino entre el router y la zona donde están los equipos lejanos (patio, cámara exterior), en un punto donde todavía llegue buena señal del router, no donde ya no llega.</div>
      <div class="spec"><table><tr><th>Parámetro</th><th>Regla en terreno</th></tr>
      <tr><td>Rango de IP local</td><td>Mantener el mismo segmento de red anterior si existen grabadores DVR o terminales fijos</td></tr><tr><td>Reglas de puertos</td><td>Informar al cliente que las aperturas previas se borran con el cambio de equipo</td></tr><tr><td>Nombre del repetidor</td><td>Conservar el mismo SSID del router principal operando en modo mesh sin sufijo adicional</td></tr><tr><td>Ubicación del extensor</td><td>Instalar en un punto intermedio con buena recepción para irradiar hacia zonas lejanas</td></tr></table></div>
      ${erroresSeg(["Alterar el rango de IP local del router cuando el cliente posee grabadores DVR o terminales fijos", "Retirarse sin avisar al cliente que los puertos abiertos y reglas del router anterior se perdieron", "Configurar un extensor con nombre de red distinto provocando la desconexión de dispositivos periféricos", "Ubicar el extensor en una zona ciega donde ya no recibe señal suficiente del router principal"])}
` },
    { id: "diagnostico", title: "Diagnóstico de fallas en 3 niveles y verificación final con el cliente", min: 6, html: `
      <p>Al diagnosticar problemas con dispositivos IoT es necesario considerar tres niveles bien diferenciados.</p>
      <div class="spec"><table><tr><th>Nivel de falla</th><th>Origen del problema</th></tr>
      <tr><td>Nivel Internet</td><td>Muchos dispositivos requieren conexión a internet para transmitir datos o guardar videos en línea</td></tr><tr><td>Nivel Red Local</td><td>Fallas de enlace inalámbrico o de credenciales entre los terminales y el router o extensor</td></tr><tr><td>Nivel Dispositivo</td><td>Problemas propios del equipo que dependen del fabricante o de su alimentación por baterías o pilas</td></tr></table></div>
      <div class="tip">Algunos equipos no se reconectan solos. Si después de unos minutos no vuelven, sugiérele al cliente apagarlos y encenderlos. No los restablezcas de fábrica ni entres a las apps o cuentas del cliente: eso lo hace el cliente.</div>
      <div class="tip">Antes de cerrar la orden, revisa con el cliente que sus equipos principales quedaron conectados (por ejemplo, que la cámara aparezca en línea en su app).</div>
      ${erroresSeg(["Restablecer de fábrica los equipos inteligentes del cliente o solicitar acceso a sus cuentas privadas", "Manipular el smartphone personal del cliente o intentar configurar sus aplicaciones particulares", "Cerrar la orden de trabajo sin verificar con el cliente que sus equipos principales volvieron a operar"])}
` }
  ]
},

{
  id: "conectores", code: "CON-202", complementario: true, color: "--f6", fiber: "Blanco", short: "Conectores de campo",
  title: "Armado de conectores de campo",
  summary: "Confección, instalación y verificación de conectores ópticos de campo SC/APC en redes de fibra óptica.",
  lessons: [
    { id: "video", title: "Conector reforzado FastConnect: video", min: 5, html: `
      <div class="video"><iframe src="https://player.vimeo.com/video/1238935964?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="Video: armado del conector reforzado FastConnect Universal" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <p>El video muestra el armado del conector reforzado FastConnect Universal paso a paso. Después, las lecciones explican los tres modelos de conector de campo.</p>
      <div class="tip">Cuando termines el video, presiona <strong>Completar y seguir</strong>.</div>` },
    { id: "intro", title: "Introducción y herramientas comunes", min: 7, html: `
      <p>Los conectores SC/APC de campo son conectores de tipo SC con pulido APC que ofrecen bajos valores de pérdida de inserción y permiten realizar conexiones de manera sencilla y rápida en pocos pasos, evitando utilizar equipos de fusión.</p>
      <p>Gracias a los tubos de recrecimiento que incluyen, admiten fibras de 900 µm, 2 mm, 3 mm y cable plano de 3×2 mm.</p>
      <p>Un conector bien ensamblado entrega cuatro beneficios directos en la red de fibra óptica:</p>
      <ul>
        <li><strong>Minimización de pérdidas de señal:</strong> un conector bien ensamblado reduce significativamente la atenuación de la señal óptica y el pulido APC proporciona una superficie de contacto precisa que minimiza las reflexiones de la luz, evitando interferencias en la transmisión de datos.</li>
        <li><strong>Mayor confiabilidad en la red:</strong> ofrece conexiones estables y duraderas reduciendo la probabilidad de fallas, y al reducir las tensiones en la fibra y protegerla de contaminantes prolonga la vida útil del conector y de la fibra óptica.</li>
        <li><strong>Mejora en la calidad de la señal:</strong> menos reflexiones y pérdidas se traducen en una señal más limpia y con menor ruido, permitiendo transmitir datos a mayores distancias sin necesidad de amplificadores adicionales.</li>
        <li><strong>Facilidad de mantenimiento:</strong> conectores bien identificados facilitan la localización de problemas y disminuyen la necesidad de reconectar o reemplazar conectores, minimizando el tiempo de inactividad de la red.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p02_esquema_medidas.png" alt="Esquema técnico de segmentos internos de un conector SC/APC" loading="lazy"><figcaption>Esquema técnico del conector SC/APC: cuerpo principal de 3 mm, revestimiento de 24 mm (0,25 mm de grosor) y fibra desnuda de 10 mm (0,125 mm de grosor).</figcaption></figure>
      <div class="spec"><table><tr><th>Elemento del esquema</th><th>Descripción y función</th></tr>
      <tr><td>Segmento negro de 3 mm</td><td>Cuerpo principal del conector donde se conecta la fibra</td></tr><tr><td>Segmento de 24 mm y 0,25 mm de grosor</td><td>Representa la cubierta o revestimiento de la fibra óptica primaria de 0,25 mm de diámetro</td></tr><tr><td>Triángulo y punto de 10 mm con 0,125 mm de grosor</td><td>Fibra desnuda sin cubierta de 0,125 mm de diámetro expuesta para conectarse con otros dispositivos o adaptadores</td></tr><tr><td>Conexión tipo SC/APC en ángulo de 8 grados</td><td>Corte APC diseñado en un ángulo de 8 grados para reducir la reflexión de la luz frente a conectores rectos PC o UPC (principio óptico detallado en el curso FTTH-103)</td></tr></table></div>
      <p>En nuestras operaciones se utilizan tres modelos de conectores de campo según la operación y el punto de la red:</p>
      <div class="spec"><table><tr><th>Modelo de conector</th><th>Operación</th><th>Aplicación en la red</th></tr>
      <tr><td>Conector mecánico SC/APC (Tipo Caimán y Tipo Pinza)</td><td>Claro VTR</td><td>Instalaciones aprobadas en redes CFTT, FTTH y Red Neutra en NAP, FAT, CTO y roseta óptica</td></tr><tr><td>Conector reforzado FastConnect Universal / FiberHome</td><td>Tigo</td><td>Instalaciones exteriores con protección IP68 contra agua y polvo y resistencia UV en conectores Bayoneta y OptiTap</td></tr><tr><td>Conector de campo FTTx para cables Flat (código MAT0055, ejemplo de fabricante Furukawa EZ!Conector)</td><td>Tigo</td><td>Instalaciones con tecnología preconectorizada obligatoria en CDOI de edificios y roseta óptica domiciliaria</td></tr></table></div>
      <p><strong>Herramientas y materiales para la confección del conector y para qué sirve cada uno:</strong></p>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p03_herramientas.png" alt="Herramientas básicas para la elaboración de conectores SC/APC" loading="lazy"><figcaption>Herramientas básicas para la confección de conectores SC/APC: alicate, deschaquetadora, plantilla, cortadora, linterna localizadora, alcohol isopropílico, papel de limpieza y limpiador One-Click.</figcaption></figure>
      <ul>
        <li><strong>Alicate universal o cortante:</strong> sirve para manipular y cortar diversos tipos de elementos con precisión, como cortar el cable.</li>
        <li><strong>Deschaquetadora:</strong> herramienta específica para retirar la chaqueta del cable sin dañar la fibra.</li>
        <li><strong>Guía peladora y cortadora de fibra óptica:</strong> asegura el corte correcto del filamento según el estándar y permite sacar la pintura o recubrimiento de acrilato del filamento.</li>
        <li><strong>Cortadora de fibra homologada:</strong> herramienta esencial para realizar un corte limpio y exacto de la fibra (su mantención preventiva, limpieza lateral de cuchilla y validación se estudian en el curso HER-102).</li>
        <li><strong>Linterna localizadora (VFL):</strong> permite verificar la continuidad y la correcta alineación del conector.</li>
        <li><strong>Botella con alcohol isopropílico y papel o toalla sin pelusa:</strong> sirven para limpiar adecuadamente el filamento sin dejar residuos ni dañar la superficie.</li>
        <li><strong>Limpiador One-Click:</strong> dispositivo de limpieza para los conectores ópticos utilizado en puertos y cabezales (cuya aplicación también se revisa en FTTH-103 y HER-102).</li>
      </ul>
      <div class="tip">Durante el proceso de confección del conector o al limpiar el cabezal, solo se deben utilizar los elementos detallados en la lista oficial. El uso de materiales no recomendados puede comprometer la calidad de la conexión, y los utensilios de limpieza no son reutilizables.</div>
      ${erroresSeg(["Utilizar materiales no recomendados durante la confección del conector o al limpiar el cabezal", "Reutilizar los pañuelos o utensilios de limpieza de fibra óptica"])}` },
    { id: "sc_apc", title: "Conector mecánico SC/APC de campo: Caimán y Pinza (Claro VTR)", min: 9, html: `
      <p>En la operación <strong>Claro VTR</strong> se utilizan los conectores mecánicos SC/APC aprobados oficialmente tanto para la marca Claro-VTR como para las redes CFTT, FTTH y Red Neutra.</p>
      <p>Dentro de las redes de Claro VTR existen dos tipos de conectores SC/APC cuya principal diferencia es el mecanismo mecánico y de sujeción que se usa en el armado: el <strong>conector tipo Caimán</strong> (compuesto por carcasa, tapa rosca, tapa caimán y seguro) y el <strong>conector tipo Pinza</strong> (compuesto por tapa rosca, pinza y carcasa).</p>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p04_caiman_y_pinza.png" alt="Partes del conector tipo Caimán y del conector tipo Pinza" loading="lazy"><figcaption>Conectores SC/APC en redes Claro VTR: conector tipo Caimán (carcasa, tapa rosca, tapa caimán y seguro) y conector tipo Pinza (tapa rosca, pinza y carcasa).</figcaption></figure>
      <div class="spec"><table><tr><th>Característica</th><th>SC/APC Tipo Pinza</th><th>SC/APC Tipo Caimán</th></tr>
      <tr><td>Elemento de sujeción</td><td>Pinza interna que aprieta la fibra con mordazas</td><td>Tapa caimán que se cierra como bisagra y muerde la fibra</td></tr><tr><td>Diseño interno</td><td>Mecanismo simple y lineal, con menos piezas móviles</td><td>Mecanismo articulado con tapa y seguro, más robusto</td></tr><tr><td>Facilidad de montaje</td><td>Más rápido de ensamblar, en menos pasos</td><td>Requiere abrir tapa caimán, colocar fibra y cerrar con seguro</td></tr><tr><td>Resistencia mecánica</td><td>Buena, pero puede aflojarse si la pinza no cierra bien</td><td>Muy alta, con seguro que evita que se suelte</td></tr><tr><td>Uso común</td><td>Instalaciones rápidas o de bajo costo (domiciliarias)</td><td>Instalaciones de alta durabilidad y resistencia (troncales o exteriores)</td></tr></table></div>
      <p>La plantilla homologada en Claro VTR es de código <strong>GLX329</strong> (soporte de fibra para corte de 30 mm, guía y peladora para filamento de fibra óptica). Su uso asegura que el corte de la fibra tenga el tamaño adecuado.</p>
      <div class="tip">No se debe insertar la rosca cuando se finaliza el proceso de descubrir la fibra, limpiar y cortar. Esto debe hacerse al inicio, lo que evita contaminar o quebrar la fibra.</div>
      <p><strong>Procedimiento de confección paso a paso para el conector Tipo Caimán (15 pasos):</strong></p>
      <ol>
        <li><strong>Insertar la rosca antes de preparar el conector:</strong> se ingresa al inicio por el cable para evitar contaminar o quebrar la fibra después del corte.</li>
        <li><strong>Insertar la fibra hasta el número 5 en la deschaquetadora:</strong> permite medir 4,5 cm de cubierta con la deschaquetadora.</li>
        <li><strong>Deschaquetar la fibra:</strong> retira la chaqueta exterior del cable sin dañar la fibra.</li>
        <li><strong>Pelar la fibra con la plantilla incluida con los conectores (plantilla homologada de 30 mm):</strong> sirve para sacar la pintura del filamento.</li>
        <li><strong>Limpiar con pañuelo adecuado y alcohol isopropílico:</strong> limpia el filamento sin dejar residuos ni dañar la superficie (recuerda que los utensilios de limpieza no son reutilizables).</li>
        <li><strong>Posicionar y guiar la fibra en la plantilla por la parte superior:</strong> alinea el filamento en el soporte GLX329 antes de cortar.</li>
        <li><strong>Posicionar la plantilla en la cortadora de fibra:</strong> al utilizar la plantilla homologada, permite aplicar un corte exacto de 30 mm.</li>
        <li><strong>Verificar la fibra cortada:</strong> la fibra debe quedar cortada de acuerdo con la imagen del paso 8.</li>
        <li><strong>Levantar la tapa posterior en el conector tipo caimán:</strong> el seguro naranjo debe ir apuntando hacia la entrada del conector.</li>
        <li><strong>Insertar cuidadosamente la fibra:</strong> introducir el filamento a través del canal central del conector.</li>
        <li><strong>Tirar el seguro en sentido contrario:</strong> una vez insertada la fibra, se acciona el seguro para que la tapa caimán muerda la fibra y no se suelte.</li>
        <li><strong>Enrollar la rosca en el conector:</strong> sirve para asegurar la fijación mecánica de la fibra al cuerpo del conector.</li>
        <li><strong>Insertar la cubierta verde en el conector:</strong> la pestaña de la cubierta verde debe ir en el lado opuesto del seguro naranjo.</li>
        <li><strong>Conservar la tapa protectora puesta:</strong> recuerda no retirar la tapa protectora hasta conectarlo a la NAP, FAT o CTO y la roseta óptica.</li>
        <li><strong>Limpiar con One-Click antes de conectar:</strong> antes de conectar a la caja terminal óptica, se debe ocupar One-Click para limpiar el conector y el puerto óptico.</li>
      </ol>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p05_paso01_insertar_rosca.png" alt="Paso 1: insertar la rosca antes de preparar el conector" loading="lazy"><figcaption>Paso 1: insertar la rosca al inicio del proceso evita contaminar o quebrar la fibra una vez cortada.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p06_paso02_deschaquetadora.png" alt="Paso 2: escala de la deschaquetadora hasta el número 5" loading="lazy"><figcaption>Paso 2: insertar la fibra hasta el número 5 en la deschaquetadora (4,5 cm de cubierta).</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p07_paso04_pelar_plantilla.png" alt="Paso 4: pelar la fibra con la plantilla homologada de 30 mm" loading="lazy"><figcaption>Paso 4: pelar la fibra con la plantilla homologada de 30 mm incluida con los conectores.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p09_paso07_cortadora.png" alt="Paso 7: posicionar la plantilla GLX329 en la cortadora de fibra" loading="lazy"><figcaption>Paso 7: posicionar la plantilla GLX329 en la cortadora de fibra para aplicar un corte de 30 mm.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p09_paso08_fibra_cortada.png" alt="Paso 8: fibra cortada sobre la plantilla homologada" loading="lazy"><figcaption>Paso 8: la fibra debe quedar cortada de acuerdo con la imagen.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p10_paso09_tapa_caiman.png" alt="Paso 9: levantar la tapa posterior con el seguro naranjo apuntando hacia la entrada" loading="lazy"><figcaption>Paso 9 (Tipo Caimán): levantar la tapa posterior con el seguro naranjo apuntando hacia la entrada del conector.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p11_paso11_seguro_caiman.png" alt="Paso 11: tirar el seguro naranjo en sentido contrario" loading="lazy"><figcaption>Paso 11 (Tipo Caimán): una vez insertada la fibra, tirar el seguro naranjo en sentido contrario.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p12_paso13_cubierta_verde.png" alt="Paso 13: insertar la cubierta verde en el lado opuesto del seguro naranjo" loading="lazy"><figcaption>Paso 13: insertar la cubierta verde cuidando que su pestaña vaya en el lado opuesto del seguro naranjo.</figcaption></figure>
      <div class="tip">Se debe limpiar los conectores con One-Click antes de conectar, a pesar de estar sellados y embalados previamente.</div>
      <p><strong>Variante de armado para el Conector Tipo Pinza:</strong></p>
      <p>Para el conector tipo pinza se elimina el paso 9 y cambia su elaboración en los pasos 10 y 11, mientras que todos los demás pasos se mantienen igual:</p>
      <ul>
        <li><strong>Paso 10 (Tipo Pinza):</strong> insertar el filamento al conector validando que se forme una curva leve del filamento.</li>
        <li><strong>Paso 11 (Tipo Pinza):</strong> correr el seguro hacia la derecha para fijar la fibra antes de enrollar la rosca y colocar la cubierta verde.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p13_pinza_paso10_curva.png" alt="Paso 10 en conector tipo Pinza: validar curva leve del filamento" loading="lazy"><figcaption>Paso 10 (Tipo Pinza): insertar el filamento al conector validando una curva leve del filamento.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p14_pinza_paso11_seguro.png" alt="Paso 11 en conector tipo Pinza: correr el seguro hacia la derecha" loading="lazy"><figcaption>Paso 11 (Tipo Pinza): correr el seguro hacia la derecha para asegurar la fibra.</figcaption></figure>
      ${erroresSeg(["Insertar la tapa rosca al finalizar el corte en lugar de ingresarla al inicio del proceso", "Montar la cubierta verde con su pestaña en el mismo lado del seguro naranjo", "Retirar la tapa protectora antes del momento de conectarlo a la NAP, FAT, CTO o roseta óptica", "Conectar sin limpiar con One-Click confiando en que el conector venía sellado y embalado"])}` },
    { id: "fastconnect", title: "Conector reforzado FastConnect Universal / FiberHome (Tigo)", min: 10, html: `
      <p>En la operación <strong>Tigo</strong>, el <strong>Conector Reforzado FastConnect Universal</strong> (conector reforzado FiberHome SC/APC, compatible con conectores Bayoneta y OptiTap) está diseñado para instalaciones exteriores, ofreciendo protección IP68 contra agua y polvo, además de alta resistencia a la radiación UV.</p>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p01_herramientas.png" alt="Elementos a utilizar en el armado del conector reforzado" loading="lazy"><figcaption>Elementos a utilizar en el armado del conector reforzado: cortadora de fibra, peladora de fibra y el conector SC/APC FiberHome.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p01_despiece_conector.png" alt="Despiece rotulado de los ocho elementos del conector FastConnect Universal" loading="lazy"><figcaption>Elementos del conjunto FastConnect Universal: conector, hebilla del conector, block de sello impermeable, elemento de sellado, clip mariposa, cuerpos Optitap y Bayoneta, y bota del conector.</figcaption></figure>
      <p><strong>Fase 1: Preparación del cable drop, pelado, limpieza y corte (pasos 1 al 11):</strong></p>
      <ol>
        <li><strong>Retirar aproximadamente 200 mm de autosoportante e ingresar la bota:</strong> separar y cortar el mensajero e ingresar y pasar el drop óptico en la funda trasera (bota) del conector.</li>
        <li><strong>Deslizar el elemento de sellado sobre el cable drop:</strong> debe ingresarse desde el extremo donde se encuentran los contactos metálicos.</li>
        <li><strong>Ingresar el tapón de sello impermeable:</strong> pasar el cable drop a través del block o tapón de sello impermeable azul antes de pelar el cable.</li>
        <li><strong>Retirar aproximadamente 50 mm de la cubierta exterior del drop:</strong> utilizar la peladora de fibra para exponer la fibra óptica sin dañarla.</li>
        <li><strong>Insertar el drop a tope en la hebilla (sujeta cable) y cerrar el seguro:</strong> presionar hasta que la tapa quede completamente fija y sin movimiento para sujetar el cable.</li>
        <li><strong>Insertar la hebilla con la fibra en la parte posterior de la plantilla:</strong> empujar hasta el tope orientando la cara plana de la hebilla hacia abajo.</li>
        <li><strong>Deslizar de forma simultánea ambas pestañas negras del pelador/guía:</strong> extraer luego el drop para retirar el recubrimiento de acrilato de la fibra.</li>
        <li><strong>Limpiar la fibra óptica desnuda:</strong> utilizar una toalla sin pelusa humedecida con alcohol isopropílico.</li>
        <li><strong>Seleccionar en la plantilla de corte la posición A o B según la cortadora:</strong> la posición A corresponde a la cortadora Fitel (Fitel S326, utilizada en la mayoría de los casos) y la posición B corresponde a la cortadora Fujikura.</li>
        <li><strong>Posicionar la hebilla en la plantilla de corte:</strong> colocar la hebilla con la flecha orientada hacia arriba.</li>
        <li><strong>Posicionar la plantilla en la cortadora y realizar el corte:</strong> insertar la guía junto con el cable hasta el tope de la cortadora y realizar el corte de precisión de la fibra óptica.</li>
      </ol>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p02_paso02_elemento_sellado.png" alt="Deslizar el elemento de sellado desde el extremo de los contactos metálicos" loading="lazy"><figcaption>Paso 2: deslizar el elemento de sellado sobre el cable drop ingresándolo desde el extremo donde se encuentran los contactos metálicos.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p02_paso05_hebilla.png" alt="Insertar el drop a tope en la hebilla y cerrar el seguro" loading="lazy"><figcaption>Paso 5: insertar el drop a tope en la hebilla (sujeta cable) y cerrar el seguro hasta que quede fijo.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p03_paso07_pestanas_pelador.png" alt="Deslizar simultáneamente ambas pestañas negras del pelador/guía" loading="lazy"><figcaption>Paso 7: deslizar de forma simultánea ambas pestañas negras del pelador/guía y extraer el drop retirando el recubrimiento de acrilato.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p03_paso09_posicion_ab.png" alt="Selección de Posición A para cortadora Fitel y Posición B para cortadora Fujikura" loading="lazy"><figcaption>Paso 9: seleccionar en la plantilla de corte la Posición A (Cortadora Fitel) o la Posición B (Cortadora Fujikura).</figcaption></figure>
      <p><strong>Fase 2: Inserción de la fibra, bloqueo con clip mariposa y acople Bayoneta u OptiTap (pasos 12 al 23):</strong></p>
      <ol start="12">
        <li><strong>Verificar el clip y abrir la tapa en la base del conector:</strong> presionar el clip del conector para verificar que el mecanismo se encuentre desbloqueado y abrir la tapa ubicada en la base del conector.</li>
        <li><strong>Deslizar la guía hacia afuera desde la pestaña:</strong> extraer la guía interna asegurándose de que permanezca retenida y no se desacople del conjunto.</li>
        <li><strong>Posicionar la hebilla sobre la guía:</strong> asegurar que la flecha indicadora quede orientada hacia arriba y presionar hasta escuchar el clic de bloqueo.</li>
        <li><strong>Deslizar la hebilla hasta el tope:</strong> avanzar la hebilla verificando la correcta inserción de la fibra mediante su curvatura.</li>
        <li><strong>Cerrar el conector presionando la tapa:</strong> presionar la tapa inferior hasta escuchar el clic, asegurando su bloqueo.</li>
        <li><strong>Deslizar el clip tipo mariposa hacia el extremo superior:</strong> sirve para bloquear la fibra en el interior del conector.</li>
        <li><strong>Presionar el clip tipo mariposa desde los costados:</strong> permite liberarlo y retirarlo del sistema una vez bloqueada la fibra.</li>
        <li><strong>Desplazar el sello impermeable y el elemento de sellado:</strong> llevar ambos elementos hasta el tope en la base del conector.</li>
        <li><strong>Seleccionar el cuerpo exterior correspondiente y retirar su tapa:</strong> continuar el armado utilizando el conector Bayoneta u Optitap requerido y retirar su tapa de protección.</li>
        <li><strong>Alinear las flechas de referencia e insertar el conector SC/APC:</strong> introducir el conector en el cuerpo exterior hasta alcanzar su posición final.</li>
        <li><strong>Reinstalar la tapa de protección:</strong> con el conector SC/APC debidamente insertado en el conector tipo requerido, volver a colocar la tapa.</li>
        <li><strong>Enroscar la bota protectora:</strong> sostener firmemente el conector desde el cuerpo central y enroscar la bota protectora asegurando su correcta fijación para finalizar el armado.</li>
      </ol>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p04_paso13_deslizar_guia.png" alt="Deslizar la guía hacia afuera desde la pestaña sin desacoplarla" loading="lazy"><figcaption>Paso 13: deslizar la guía hacia afuera desde la pestaña asegurándose de que permanezca retenida y no se desacople del conjunto.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p04_paso14_hebilla_clic.png" alt="Posicionar la hebilla sobre la guía con la flecha hacia arriba hasta escuchar el clic" loading="lazy"><figcaption>Paso 14: posicionar la hebilla sobre la guía con la flecha indicadora hacia arriba y presionar hasta escuchar el clic de bloqueo.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p04_paso17_deslizar_mariposa.png" alt="Deslizar el clip tipo mariposa hacia el extremo superior del conector" loading="lazy"><figcaption>Paso 17: deslizar el clip tipo mariposa hacia el extremo superior del conector para bloquear la fibra en su interior.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p05_paso19_desplazar_sellos.png" alt="Desplazar el sello impermeable y el elemento de sellado hasta el tope en la base" loading="lazy"><figcaption>Paso 19: desplazar el sello impermeable y el elemento de sellado hasta el tope en la base del conector.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p05_paso20_bayoneta_optitap.png" alt="Tipos de cuerpo exterior Bayoneta y Optitap" loading="lazy"><figcaption>Paso 20: continuar el armado utilizando el tipo de conector exterior requerido (Bayoneta u Optitap).</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p06_paso25_finalizado.png" alt="Conector reforzado tipo FastConnect finalizado" loading="lazy"><figcaption>Paso 23: conector reforzado tipo FastConnect finalizado tras enroscar firmemente la bota protectora.</figcaption></figure>
      <div class="tip">Recomendaciones operativas en terreno: armar el conector en la camioneta, utilizar porta carretes para el rollo de drop y colocar un conector SC/APC al inicio del drop en el interior del carrete para probar luz y potencia en la CTO.</div>
      ${erroresSeg(["Ingresar el elemento de sellado por el extremo opuesto al de los contactos metálicos", "Desacoplar la guía interna al deslizarla hacia afuera desde la pestaña", "Colocar la hebilla con la cara plana hacia arriba al pelar o con la flecha hacia abajo al cortar e insertar"])}` },
    { id: "furukawa", title: "Conector de campo para cables Flat: ejemplo de fabricante Furukawa EZ!Conector (Tigo)", min: 9, html: `
      <p>En la operación <strong>Tigo</strong>, el conector de campo FTTx (código de catálogo <strong>MAT0055</strong>, como ejemplo de fabricante <strong>Furukawa EZ!Conector</strong>) se utiliza de forma obligatoria en todas las instalaciones con tecnología preconectorizada:</p>
      <ul>
        <li><strong>En CDOI preconectorizada (edificios):</strong> se realiza el conector de campo en el drop interior y se inserta directamente en el conector SC/APC hembra, rotulando el drop con los datos de la fibra asignada y el número del departamento.</li>
        <li><strong>En red preconectorizada domiciliaria (roseta óptica):</strong> el drop exterior llega directamente a la roseta óptica, donde se debe armar el conector de campo.</li>
      </ul>
      <p><strong>Especificaciones técnicas (ejemplo de fabricante: Furukawa / Lightera, ficha ET02992 traducida del portugués):</strong></p>
      <p>El conector óptico de campo fue desarrollado para la conexión rápida y fácil de cables tipo Flat de 3×2 mm y 2×1,6 mm con fibras monomodo, disponible en conector tipo SC con pulido APC. Está diseñado para aplicación interna en áreas controladas o cajas de terminación, con instalación simple sin necesidad de epoxi ni pulido en campo.</p>
      <figure class="esquema"><img src="Imagenes/conectores/fur_et_p01_conector_kit.png" alt="Kit de conector de campo con guía de fibra y plantilla de montaje, ejemplo de fabricante Furukawa" loading="lazy"><figcaption>Kit de conector óptico de campo SC/APC con soportes verdes, guía azul de fibra y plantilla negra de montaje (ejemplo de fabricante: Furukawa / Lightera).</figcaption></figure>
      <div class="spec"><table><tr><th>Parámetro técnico</th><th>Especificación (ejemplo de fabricante: ficha ET02992)</th></tr>
      <tr><td>Cables compatibles</td><td>Cables tipo Flat de 3×2 mm y 2×1,6 mm con fibras monomodo (drop compacto figura 8 e interior de baja fricción)</td></tr><tr><td>Tipo de conector y pulido</td><td>Conector SC con pulido APC para fibra monomodo</td></tr><tr><td>Pérdida de inserción (1310 y 1550 nm)</td><td>Típica: 0,30 dB / Máxima: 0,50 dB</td></tr><tr><td>Pérdida de retorno (1310 y 1550 nm)</td><td>Típica: 50 dB / Máxima: 55 dB</td></tr><tr><td>Carga de tracción</td><td>20 N (con variación menor o igual a 0,2 dB)</td></tr><tr><td>Dimensiones (profundidad × ancho × altura)</td><td>49 mm × 9,2 mm × 7,4 mm</td></tr><tr><td>Temperatura de operación y almacenamiento</td><td>De −25 °C hasta 75 °C</td></tr><tr><td>Presentación y accesorios del kit</td><td>Kit con 10 conectores; incluye manual de montaje, plantilla de montaje y guía de fibra</td></tr></table></div>
      <div class="tip">Advertencia del fabricante (ejemplo: Furukawa / Lightera): el desempeño del conector de campo no puede ser garantizado si el mismo es reutilizado.</div>
      <p><strong>Orden de montaje y procedimiento de armado en 10 pasos:</strong></p>
      <p>De acuerdo con la secuencia del fabricante, el montaje comprende verificar el lado correcto de la guía de montaje, preparar el conector, preparar el cable, montar el conector, conectorizar el cable y finalizar con la limpieza de la férula.</p>
      <figure class="esquema"><img src="Imagenes/conectores/fur_manual_p82_fig44_pasos.png" alt="Figura 44: secuencia de 10 pasos para el armado del conector de campo" loading="lazy"><figcaption>Figura 44 del manual de certificación: secuencia de 10 pasos para el armado del conector de campo en red preconectorizada.</figcaption></figure>
      <ol>
        <li><strong>Insertar la guía en la base del conector y asegurarla (Paso 1, Figura 44):</strong> acoplar la guía azul de fibra en la parte trasera del conector para guiar la entrada del filamento.</li>
        <li><strong>Posicionar el drop en el elemento de fijación verde (Paso 2, Figura 44):</strong> colocar el cable preparado dentro del soporte verde y cerrarlo para sujetar la cubierta.</li>
        <li><strong>Posicionar el elemento de fijación con el drop en la plantilla de corte (Paso 3, Figura 44):</strong> ubicarlo lo más próximo a la parte superior de la plantilla negra de montaje.</li>
        <li><strong>Quitar el esmalte, limpiar y quitar el exceso de la fibra (Paso 4, Figura 44):</strong> retirar el recubrimiento con la peladora sobre la plantilla y limpiar con alcohol isopropílico.</li>
        <li><strong>Situar la plantilla en la herramienta cortadora y realizar el corte de la fibra (Paso 5, Figura 44):</strong> recuerda que debes retirar previamente el holder de la cortadora para que calce la plantilla.</li>
        <li><strong>Presentar la fibra cortada en la guía de posicionamiento (Paso 6, Figura 44):</strong> apoyar el elemento de fijación verde sobre el riel de la guía azul acoplada al conector.</li>
        <li><strong>Desplazar hasta llegar a tope verificando que la fibra quede flexionada (Paso 7, Figura 44):</strong> avanzar el soporte hasta que encastre en el conector manteniendo la leve flexión de la fibra.</li>
        <li><strong>Presionar la lengüeta hasta soltar la guía base y retirarla (Paso 8, Figura 44):</strong> presionar la lengüeta para soltar la guía base y retirarla del conector.</li>
        <li><strong>Quitar el protector transparente (Paso 9, Figura 44):</strong> retirar el protector transparente del conector antes del paso final.</li>
        <li><strong>Presionar el protector naranjo y retirarlo (Paso 10, Figura 44):</strong> esto libera el gel protector de la fibra y deja el conector listo para colocar su carcasa verde y utilizarse.</li>
      </ol>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid1_m00s36_fijacion_verde_drop.png" alt="Paso 2: posicionar el cable drop en el elemento de fijación verde" loading="lazy"><figcaption>Paso 2: posicionar el cable drop dentro del elemento de fijación verde antes de cerrarlo.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid2_m00s10_plantilla_corte.png" alt="Paso 3: posicionar el elemento de fijación verde en la parte superior de la plantilla de corte" loading="lazy"><figcaption>Paso 3: posicionar el elemento de fijación con el drop lo más próximo a la parte superior de la plantilla de corte.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid2_m00s48_corte_fitel_s325.png" alt="Paso 5: situar la plantilla en la cortadora habiendo retirado el holder" loading="lazy"><figcaption>Paso 5: situar la plantilla en la herramienta cortadora y realizar el corte habiendo retirado previamente el holder.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid3_m00s24_presentar_fibra.png" alt="Paso 6: presentar la fibra cortada en la guía azul de posicionamiento" loading="lazy"><figcaption>Paso 6: presentar la fibra cortada en la guía azul de posicionamiento acoplada en la base del conector.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid3_m00s38_curvatura_flexion.png" alt="Paso 7: desplazar hasta llegar a tope verificando que la fibra quede flexionada" loading="lazy"><figcaption>Paso 7: desplazar hasta llegar a tope verificando que la fibra quede flexionada en el interior.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid3_m00s58_protector_naranjo.png" alt="Paso 10: presionar el protector naranjo y retirarlo para liberar el gel protector" loading="lazy"><figcaption>Paso 10: presionar el protector naranjo y retirarlo para liberar el gel protector de la fibra.</figcaption></figure>
      ${erroresSeg(["Reutilizar un conector de campo, ya que su desempeño no puede ser garantizado si es reutilizado", "Intentar colocar la plantilla de corte en la cortadora sin haber retirado antes el holder", "Retirar el protector naranjo sin presionarlo previamente para liberar el gel protector de la fibra"])}` },
    { id: "verificacion", title: "Verificación óptica, errores frecuentes y cuidados", min: 8, html: `
      <p><strong>1. Verificaciones mecánicas y visuales al terminar el armado:</strong></p>
      <ul>
        <li>Confirmar que la fibra quedó correctamente fijada y que presentó su curvatura leve al llegar al tope antes de cerrar o bloquear el conector.</li>
        <li>Verificar que el seguro del modelo correspondiente (seguro naranjo en Caimán, seguro lateral en Pinza o clip tipo mariposa en FastConnect) permanezca bloqueado.</li>
        <li>Revisar que los sellos impermeables estén completamente posicionados en la base y comprobar que la rosca o bota protectora quede firmemente enroscada.</li>
        <li>Inspeccionar visualmente el conector antes de su instalación en la red óptica y mantener puesta su tapa protectora hasta el momento de conectar.</li>
      </ul>
      <p><strong>2. Limpieza en seco, prueba con VFL y validación de potencia óptica:</strong></p>
      <p>Una vez armado el conector, se debe identificar el puerto óptico asignado en el punto de terminación correspondiente (NAP, FAT, CTO o CDOI) según la orden de trabajo y verificar que el puerto indicado esté disponible.</p>
      <p>Antes de conectar, limpia siempre la férula del conector y el puerto óptico con el limpiador <strong>One-Click</strong> (procedimiento visto en FTTH-103), incluso cuando el conector venga sellado y embalado previamente.</p>
      <figure class="esquema"><img src="Imagenes/conectores/vtr_p13_paso15_oneclick.png" alt="Limpieza del conector SC/APC con herramienta One-Click antes de conectar" loading="lazy"><figcaption>Antes de conectar a la caja terminal óptica o roseta, se debe ocupar One-Click para limpiar el conector y el puerto óptico.</figcaption></figure>
      <p>La linterna localizadora (VFL) permite verificar la continuidad y la correcta alineación del conector. Posteriormente, se realiza la medición del nivel de señal óptica utilizando el medidor de potencia óptica (Power Meter) configurado en la longitud de onda de <strong>1490 nm</strong>.</p>
      <figure class="esquema"><img src="Imagenes/conectores/fur_vid4_m00s02_power_meter_1490.png" alt="Medición del nivel de señal óptica en 1490 nm con medidor de potencia óptica" loading="lazy"><figcaption>Verificación del conector en el medidor de potencia óptica configurado en la longitud de onda de 1490 nm.</figcaption></figure>
      <div class="tip">Criterio oficial de potencia óptica: la potencia medida en 1490 nm en la CTO, en la CDOI y en la entrada de la HGU u ONT debe estar dentro del rango normativo de FTTH-103 (entre −18 y −24 dBm), y en las instalaciones de Claro VTR no debe existir una diferencia mayor a 2 dB entre la caja terminal óptica y la ONT.</div>
      <p><strong>3. Experiencia en terreno y los 6 errores más frecuentes detectados en despliegues:</strong></p>
      <p>Una vez adquirida la práctica, el armado es un procedimiento rápido de <strong>1,5 a 2 minutos de tiempo por conector</strong>, que brinda la posibilidad de reparar acometidas sin necesidad de reemplazar el cable completo, optimizando el consumo de cable drop y facilitando el uso de rollos de cable drop para instalaciones y reparaciones.</p>
      <div class="spec"><table><tr><th>Error frecuente detectado en terreno</th><th>Qué ocurre y cómo prevenirlo</th></tr>
      <tr><td>1: Sellar el conector antes de posicionar correctamente la fibra (clic)</td><td>Cerrar la tapa o subir los sellos antes de presionar la hebilla hasta escuchar el clic y verificar la curvatura de la fibra</td></tr><tr><td>2: No identificar la pestaña de desplazamiento de la guía</td><td>No ubicar la pestaña desde la cual se desliza la guía hacia afuera cuidando que permanezca retenida y no se desacople</td></tr><tr><td>3: Seguir sin creatividad la secuencia de armado</td><td>Seguir los pasos de memoria, sin entender para qué sirve cada uno</td></tr><tr><td>4: Manipulación de acometidas degradadas</td><td>Manipular la fibra óptica con cuidado para evitar fracturas o contaminación y evitar doblar la fibra en exceso durante el armado del conector</td></tr><tr><td>5: Dificultades en uso de la guía para pelado y corte</td><td>No orientar la cara plana de la hebilla hacia abajo al pelar o no seleccionar la posición A o B según la cortadora</td></tr><tr><td>6: Uso correcto del kit (toalla y alcohol)</td><td>Omitir la limpieza con toalla sin pelusa humedecida con alcohol isopropílico o reutilizar paños de limpieza</td></tr></table></div>
      <figure class="esquema"><img src="Imagenes/conectores/fc_exp_p06_pestana_guia_cerrada.png" alt="Identificación de la pestaña azul de desplazamiento de la guía interna" loading="lazy"><figcaption>Ubicación de la pestaña de desplazamiento desde donde se desliza la guía interna hacia afuera sin desacoplarla.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/conectores/fc_p06_rec1_armar_camioneta.png" alt="Armado del conector sobre superficie estable en la camioneta" loading="lazy"><figcaption>Recomendación operativa en terreno: armar el conector en la camioneta sobre una superficie limpia y estable.</figcaption></figure>
      <p><strong>4. Cuidados generales y seguridad durante el armado:</strong></p>
      <ul>
        <li>Manipular la fibra óptica con cuidado para evitar fracturas o contaminación y mantener la fibra limpia durante todo el proceso.</li>
        <li>Evitar doblar la fibra en exceso durante el armado del conector.</li>
        <li>Utilizar siempre herramientas calibradas y en buen estado, respetando la configuración de la cortadora indicada por el fabricante (como se detalla en el curso HER-102).</li>
        <li>Utilizar lentes de seguridad al trabajar con la fibra y contar con un recipiente para colocar los excedentes de los cortes de fibra (normas de seguridad y descarte vistas en SEG-101 y HER-102).</li>
      </ul>
      ${erroresSeg(["Sellar el conector antes de posicionar correctamente la fibra hasta escuchar el clic", "Seguir los pasos de memoria, sin entender para qué sirve cada uno", "Dejar una diferencia mayor a 2 dB entre la caja terminal óptica y la ONT en redes Claro VTR"])}` }
  ]
},

    { id: "intro", title: "Fundamentos, herramientas y seguridad", min: 7, html: `
      <p>Los empalmes de fusión permiten conectar dos fibras ópticas mediante una unión térmica permanente.</p>
      <p>Consiste en alinear las fibras y luego fusionarlas con un arco eléctrico en la máquina empalmadora.</p>
      <p>El técnico deberá fusionar fibra óptica cada vez que requiera unir o empalmar dos extremos a través de una máquina fusionadora, la que aplicando calor y alineando los extremos permitirá el paso de la señal generando una mínima pérdida.</p>
      <p>La fusión tiene pérdidas mínimas y se realiza con una máquina automatizada capaz de alinear las fibras, algunas por el núcleo y otras por el cladding.</p>
      <h3>Herramientas y materiales para empalme por fusión</h3>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p02_herramientas_materiales.png" alt="Herramientas y materiales de fusión" loading="lazy"><figcaption>Herramientas y materiales obligatorios para el proceso de empalme por fusión de fibra óptica.</figcaption></figure>
      <p>Para ejecutar el empalme de fusión en terreno se requiere el siguiente instrumental:</p>
      <ul>
        <li>Empalmadora de fusión: herramienta compleja compuesta de una bandeja que acerca con precisión las fibras ópticas y las alinea por núcleo o cladding (su mantenimiento preventivo, limpieza de ranuras en V con hisopo y calibración de electrodos corresponden al curso HER-102).</li>
        <li>Cortadora de fibra de precisión (cleaver): herramienta de alta precisión fundamental para realizar un corte de 90 grados en las fibras ópticas (su cuidado y giro de cuchilla se remiten a HER-102 y CON-202).</li>
        <li>Peladora de fibra óptica: para eliminar el revestimiento o cubierta externa y el coating de la fibra.</li>
        <li>Toallas de papel suave y alcohol isopropílico: para limpiar la fibra desnuda retirando los restos de impurezas.</li>
        <li>Protector térmico SMOUV termo retráctil: elemento de protección mecánica y térmica para la zona de la fusión.</li>
        <li>Tijera para Kevlar: para cortar el Kevlar sobrante de los cables ópticos.</li>
        <li>Amarras plásticas: para asegurar y ordenar cables en cajas de empalme y bandejas.</li>
        <li>Recipiente de residuos: depósito obligatorio para colocar los excedentes de los cortes de fibra.</li>
      </ul>
      <h3>Normas obligatorias de seguridad laboral</h3>
      <div class="tip">El técnico debe utilizar obligatoriamente los equipos de protección personal y utilizar lentes de seguridad al trabajar con la fibra.</div>
      <p>Las medidas de seguridad no negociables durante el trabajo de fusión son:</p>
      <ul>
        <li>Evitar pasar las manos por los ojos cuando se dividen o preparan fibras, ya que pequeños pedazos de fibra pueden adherirse a las manos.</li>
        <li>Habiendo sospecha de que un pedazo de fibra se alojó en los ojos, solicitar inmediatamente ayuda médica.</li>
        <li>Remover todos los restos de fibra adecuadamente en un recipiente, pues son muy pequeños y pueden penetrar en la piel.</li>
        <li>Considerar los cuidados al eliminar las sobras y residuos de fibra óptica para evitar el contacto con terceros.</li>
        <li>Evitar soplar o inhalar los residuos de fibras ópticas generados durante el trabajo.</li>
        <li>Mantener cuidado al cortar el auto-soportante del cable de fibra óptica.</li>
        <li>Si el técnico se percata de síntomas debido a la exposición al láser se debe dirigir inmediatamente al médico; los instrumentos poseen símbolos indicativos de emisión de luz láser próximo al conector de salida.</li>
        <li>Señalar y señalizar el lugar de trabajo para alertar sobre la existencia de servicios en la vía pública o domicilio.</li>
      </ul>
      ${erroresSeg(["Trabajar sin lentes de seguridad durante el pelado, corte y manipulación de fibra óptica", "Soplar los restos de fibra o dejarlos sobre la mesa de trabajo en lugar de usar un recipiente de residuos", "No dirigirse inmediatamente al médico si el técnico se percata de síntomas debido a la exposición al láser", "Pasarse las manos por los ojos o la piel tras manipular virutas o cortes de fibra"])}
` },

    { id: "preparacion", title: "Código de colores y preparación de la fibra", min: 8, html: `
      <p>Los cables de fibra óptica que salen del ODF pueden tener hasta cientos de fibras ópticas que pueden alimentar distintos sectores con múltiples puertos PON.</p>
      <p>Dada la imposibilidad de rotular las fibras por su diminuto tamaño, existen códigos de colores que permiten realizar la cuenta de red.</p>
      <p>Las fibras están organizadas en varios tubos con una cantidad de fibras ópticas, grupo al que también se le conoce como buffer o mini tubo.</p>
      <h3>Estándar SICOR y regla mnemotécnica BRAVO</h3>
      <p>Bajo el estándar Siemens/Corning (SICOR), se identifican cuatro colores para los minitubos y podemos recordar el orden de los mini tubos con la palabra BRAVO:</p>
      <div class="spec">Orden de minitubos BRAVO: Blanco (grupo 1), Rojo (grupo 2), Azul (grupo 3) y Verde (grupo 4).</div>
      <p>Dentro de cada grupo las fibras son identificadas de manera secuencial por ocho colores normalizados:</p>
      <div class="spec">Secuencia de 8 fibras: 1 Verde (VE), 2 Rojo (RO), 3 Azul (AZ), 4 Amarillo (AM), 5 Gris (GR), 6 Violeta (VI), 7 Marrón / Café (MA) y 8 Naranjo (NA).</div>
      <p>La tabla considera 64 fibras que alimentan a un puerto GPON completo: cada minitubo tiene 8 fibras. Ejemplo para el técnico: la fibra 19 es la azul del minitubo azul (grupo 3).</p>
      <figure class="esquema"><img src="Imagenes/fusion/fus_tabla_64_fibras.png" alt="Tabla de 64 fibras norma SICOR" loading="lazy"><figcaption>Tabla de 64 fibras bajo norma SICOR: 8 minitubos por 8 fibras por minitubo.</figcaption></figure>
      <p>Para identificar pelos en cables de mayor conteo se combinan minitubo y fibra. La cuenta se hace desde el primer pelo del tramo: los minitubos siguen el orden BRAVO y los pelos dentro de cada minitubo siguen el orden de colores de las fibras (Verde, Rojo, Azul…):</p>
      <ul>
        <li>Minitubos de 2 pelos, cuenta del 130 al 137: la fibra 135 corresponde a Mini tubo Azul, pelo Rojo (130-131 Blanco, 132-133 Rojo, 134-135 Azul; 135 es el segundo pelo).</li>
        <li>Minitubos de 4 pelos, cuenta del 125 al 132: la fibra 130 corresponde a Mini tubo Rojo, pelo Rojo (125-128 Blanco, 129-132 Rojo; 130 es el segundo pelo).</li>
        <li>Minitubos de 8 pelos, cuenta del 147 al 154: la fibra 149 corresponde a Mini tubo Blanco, pelo Azul (147-154 Blanco; 149 es el tercer pelo).</li>
      </ul>
      <h3>Preparación técnica de la fibra óptica paso a paso</h3>
      <div class="tip">Paso previo obligatorio: colocar el smouv termo retráctil en un extremo antes de pelar y cortar la fibra.</div>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p04_paso3_insertar_smouv.png" alt="Inserción previa del protector SMOUV" loading="lazy"><figcaption>Paso previo obligatorio: insertar el manguito termorretráctil SMOUV en una de las fibras antes de cortar.</figcaption></figure>
      <p>La secuencia técnica rigurosa para preparar cada fibra óptica es:</p>
      <ol>
        <li>
          Desnudar la protección externa del cable, cortar el Kevlar sobrante con la tijera y remover el coating de la fibra unos 3 centímetros con la peladora de fibra.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p03_paso1_pelado_coating.png" alt="Pelado de coating" loading="lazy"><figcaption>Remover el coating de la fibra aproximadamente 3 centímetros utilizando la peladora de fibra.</figcaption></figure>
        </li>
        <li>
          Tomar una toalla de papel suave con alcohol isopropílico y limpiar la fibra hasta que realice un sonido agudo, removiendo todos los restos de coating en un solo sentido de adentro hacia afuera.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p03_paso2_limpieza_alcohol.png" alt="Limpieza con alcohol isopropílico" loading="lazy"><figcaption>Limpiar el filamento desnudo con toalla y alcohol isopropílico hasta escuchar un sonido agudo.</figcaption></figure>
        </li>
        <li>
          Colocar la fibra sobre la cortadora de precisión cleaver y asegurar que el coating quede en la marca de 13 a 15 mm para cortar la fibra obteniendo un corte recto a 90 grados.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p04_paso4_corte_cleaver.png" alt="Corte en cortadora de precisión cleaver" loading="lazy"><figcaption>Corte recto en cleaver con el coating posicionado en la marca de 13 a 15 mm.</figcaption></figure>
        </li>
        <li>Depositar la viruta sobrante en un recipiente para desechar los restos de fibra y repetir el procedimiento para la segunda fibra.</li>
      </ol>
      <div class="tip">Condición estricta de trabajo: en caso que la fibra óptica toque alguna superficie se debe realizar todos los pasos anteriores desde el inicio.</div>
      ${erroresSeg(["Olvidar colocar el protector SMOUV antes de pelar y cortar las fibras", "Limpiar o frotar la fibra después de haber realizado el corte con la cortadora de precisión", "Cortar la fibra fuera de la marca de 13 a 15 mm dejando un extremo muy corto o excesivamente largo", "Tocar el extremo de la fibra cortada con los dedos o permitir que roce cualquier superficie de trabajo"])}
` },

    { id: "fusion", title: "Alineación, arco y fusión en máquina", min: 7, html: `
      <p>La unión física de las fibras se ejecuta dentro de la cámara de empalme de la máquina fusionadora.</p>
      <h3>Posicionamiento en soportes y ranuras en V</h3>
      <p>El posicionamiento de ambas puntas preparadas requiere máxima prolijidad:</p>
      <ul>
        <li>Colocar las fibras sobre los soportes y ranuras en V, resguardando que la ubicación corresponda a la indicada por la máquina.</li>
        <li>Extremar los cuidados para no golpear la fibra y aproximar sin sobrepasar la línea de los electrodos.</li>
        <li>Asegurar que queden cerca de los electrodos de fusión, pero no al nivel de estos, ya que el acercamiento final lo hará la misma máquina.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p05_paso5_posicionar_ranuras_v.png" alt="Posicionamiento en ranuras en V" loading="lazy"><figcaption>Colocación de fibras en soportes en V, aproximando cerca de los electrodos sin sobrepasar su línea.</figcaption></figure>
      <h3>Alineación automática y verificación en pantalla</h3>
      <p>Una vez cerradas las compuertas protectoras, se presiona el botón que permite la fusión:</p>
      <ul>
        <li>La máquina acercará las fibras para verificar alineamiento y el corte de manera automática.</li>
        <li>Comprobar en pantalla que los cortes son adecuados y las caras presentan cortes limpios a 90 grados.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p05_paso6_comprobacion_pantalla.png" alt="Comprobación de cortes y alineación" loading="lazy"><figcaption>Verificación automática de enfrentamiento y alineación precisa de fibras en la pantalla LCD.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p08_pantalla_alineacion_ok.png" alt="Pantalla con alineación correcta" loading="lazy"><figcaption>Visor LCD mostrando fibras correctamente alineadas en ejes X e Y listas para el arco eléctrico.</figcaption></figure>
      <h3>Disparo del arco eléctrico y unión de fibras</h3>
      <p>Si los cortes son adecuados y la alineación también, presionar el botón para realizar la fusión.</p>
      <p>La unión se consolida aplicando calor mediante un arco eléctrico.</p>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p06_paso7_arco_electrico.png" alt="Disparo de arco eléctrico" loading="lazy"><figcaption>Disparo del arco eléctrico de fusión y lectura inmediata de atenuación estimada en pantalla.</figcaption></figure>
      <h3>Pérdida máxima aceptable: 0,05 dB</h3>
      <div class="spec">Atenuación estimada en pantalla: no debe ser mayor a 0,05 dB.</div>
      <p>Enfrentar ambos pelos de fibra y fusionar de acuerdo al procedimiento resguardando que la pérdida provocada por la fusión no supere los 0,05 db.</p>
      <p>En el presupuesto óptico de ingeniería GPON oficial se asigna exactamente 0,05 dB por empalme en CTO, PTO y roseta.</p>
      <p>Un mal alineamiento en las fibras ópticas durante la fusión indica mayor pérdida de potencia.</p>
      <div class="tip">Requisito técnico en terreno: la pérdida provocada por la fusión no debe superar los 0,05 db.</div>
      ${erroresSeg(["Sobrepasar la línea de los electrodos o golpear las puntas de fibra durante la colocación en ranuras en V", "Iniciar la fusión con cortes defectuosos visibles en pantalla sin volver a cortar la fibra", "Aceptar un empalme con una atenuación estimada superior a 0,05 dB", "Fusionar con mal alineamiento en las fibras ópticas generando mayor pérdida de potencia"])}
` },

    { id: "proteccion", title: "Protector SMOUV y embandejado en CTO, CDOI y PTO", min: 8, html: `
      <p>El SMOUV protege a la fusión, es un manguito termocontraíble que tiene una varilla de acero que otorga rigidez mecánica a la unión fundida.</p>
      <p>Todas las fusionadoras tienen un horno donde se prepara el termocontraíble SMOUV para proteger la fusión.</p>
      <h3>Posicionamiento y ciclo de horneado del SMOUV</h3>
      <ol>
        <li>Retirar la fibra con cuidado de los soportes de la máquina fusionadora.</li>
        <li>
          Posicionar el SMOUV sobre la fusión y asegurar que quede en el centro la fusión.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p06_paso8_posicionar_smouv.png" alt="Posicionamiento del protector SMOUV" loading="lazy"><figcaption>Centrado obligatorio del protector térmico SMOUV sobre el punto de fusión.</figcaption></figure>
        </li>
        <li>
          Colocar dentro del horno cuidando que la puerta no se cierre sobre la fibra.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p07_paso9_horno_smouv.png" alt="Horneado del SMOUV en calentador" loading="lazy"><figcaption>Introducción del protector en el horno calentador cuidando que la compuerta no presione la fibra.</figcaption></figure>
        </li>
        <li>
          Cumplido el ciclo de calentamiento y contracción, retirar el cable y cerrar la fusionadora.
          <figure class="esquema"><img src="Imagenes/fusion/fus_p07_paso10_smouv_horneado.png" alt="SMOUV contraído sobre fibra" loading="lazy"><figcaption>Retiro del cable con el protector SMOUV termocontraído protegiendo la unión fundida.</figcaption></figure>
        </li>
      </ol>
      <h3>Embandejamiento en Caja Terminal Óptica Aérea (CTO)</h3>
      <p>En terreno el técnico encuentra diversos modelos de CTO aérea como Tyco Electronics, Electroson y Furukawa.</p>
      <p>El procedimiento normativo de embandejamiento en CTO aérea exige:</p>
      <ul>
        <li>Ingresar cable DROP por guías correspondientes y definidas según CTO y posteriormente realizar la fijación.</li>
        <li>Retirar fibras disponibles e identificar fibra asignada en la orden de trabajo.</li>
        <li>Guiar fibra de DROP desde la bandeja superior hasta la inferior donde quedará ubicada.</li>
      </ul>
      <div class="spec">Reserva de DROP en CTO: embandejar fibra de DROP en la bandeja inferior procurando dejar 1 metro de reserva para futuros trabajos.</div>
      <div class="spec">Reserva de pelo de red en CTO: embandejar en la bandeja inferior dejando la mayor reserva posible con un mínimo de 70 centimetros.</div>
      <ul>
        <li>Posicionar Smouv en la ubicación dispuesta para su fijación al interior de la CTO.</li>
        <li>Embandejar fibras disponibles en la bandeja de la CTO.</li>
        <li>Cerrar CTO e instalar amarra rotuladora exterior incluyendo dirección, número de casa o departamento y número de fibra asignada.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_manual_p70_fig29_cto_tyco_fusion.png" alt="Reservas normativas en CTO aérea" loading="lazy"><figcaption>Secuencia normativa de reservas y embandejamiento en CTO aérea: 1 metro en DROP y mínimo 70 cm en red.</figcaption></figure>
      <h3>Embandejamiento en CDOI (edificios y FTTA)</h3>
      <p>La CDOI (Caja de Distribución Óptica Interior) se usa en ambientes FTTA con tecnología de fusión de fibra:</p>
      <ul>
        <li>Pasar el cable de acometida en la parte inferior de la CDOI y asegurar con amarras plásticas.</li>
        <li>Realizar el embandejado del lado de la red y el embandejado del lado del cliente.</li>
        <li>Rotular la fibra del cliente pasando la amarra plástica y anotando el departamento del cliente.</li>
        <li>Posicionar Smouv en la ubicación dispuesta para su fijación al interior de la CDOI, embandejar pelos disponibles y cerrar CDOI.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p15_paso3_cdoi_embandejado.png" alt="Embandejamiento en CDOI" loading="lazy"><figcaption>Embandejamiento ordenado de fibras de red y cliente en bandejas de distribución interna (CDOI).</figcaption></figure>
      <h3>Instalación en Punto Terminal Óptico (PTO de cliente)</h3>
      <p>El PTO deberá ser instalado en el punto donde el técnico y el cliente han acordado previamente; se utiliza para proteger la fusión entre el DROP y el cable interior óptico.</p>
      <p>El PTO posee dos accesos inferiores para entrada o salida de cables, área de almacenaje para embandejamiento de reserva de fibra óptica y área de almacenaje para smouv de fusión.</p>
      <p>Embandejar reservas en el PTO siguiendo el recorrido destinado para ello, retirando parte de la reserva para fusionar de forma cómoda.</p>
      <p>El cordón óptico debe mantener una curvatura lo suficientemente amplia para que evite atenuación de la señal.</p>
      <figure class="esquema"><img src="Imagenes/fusion/fus_manual_p75_fig37_pto_smouv_reserva.png" alt="Cuerpo y base del PTO" loading="lazy"><figcaption>Cuerpo del Punto Terminal Óptico (PTO) con canales perimetrales de reserva y alojamiento para SMOUV.</figcaption></figure>
      <figure class="esquema"><img src="Imagenes/fusion/fus_manual_p76_fig38_recorrido_reserva_pto.png" alt="Recorrido de reserva en PTO" loading="lazy"><figcaption>Recorrido perimetral de guiado de reserva de fibra óptica al interior del PTO.</figcaption></figure>
      ${erroresSeg(["Hornear el SMOUV sin centrar la varilla de acero sobre la zona fundida de la fibra", "Cerrar la compuerta del calentador sobre el filamento de fibra óptica desprotegido", "Dejar menos de 1 metro de reserva de DROP o menos de 70 cm de reserva de fibra de red en la CTO", "No rotular la amarra plástica exterior de la CTO con dirección, departamento y fibra asignada", "Forzar radios de curvatura cerrados al embandejar reservas en PTO o CDOI provocando macrocurvaturas"])}
` },

    { id: "verificacion", title: "Verificación, reflectometría y errores comunes", min: 8, html: `
      <p>La certificación del empalme abarca la supervisión de la pantalla LCD, reflectometría óptica y control de potencia en terreno.</p>
      <h3>Diagnóstico de fallas en pantalla LCD de la empalmadora</h3>
      <p>Al comprobar los extremos cortados en la máquina, el visor identifica las anomalías de corte:</p>
      <ul>
        <li>Corte Derecho Defectuoso.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p08_pantalla_corte_derecho_defectuoso.png" alt="Corte derecho defectuoso" loading="lazy"><figcaption>Mensaje en pantalla digital de la empalmadora indicando Corte Derecho Defectuoso.</figcaption></figure>
      <ul>
        <li>Corte Izquierdo Defectuoso.</li>
        <li>Ambos Cortes Defectuosos.</li>
      </ul>
      <figure class="esquema"><img src="Imagenes/fusion/fus_p08_pantalla_ambos_cortes_defectuosos.png" alt="Ambos cortes defectuosos" loading="lazy"><figcaption>Mensaje en visor indicando Ambos Cortes Defectuosos.</figcaption></figure>
      <h3>El empalme por fusión en la traza OTDR</h3>
      <p>El reflectómetro óptico (OTDR) tiene como propósito detectar, localizar y medir eventos o impedimentos en cualquier punto del enlace de fibra.</p>
      <p>Un empalme por fusión une dos fibras termalmente utilizando una empalmadora, presentando en la traza:</p>
      <ul>
        <li>Reflectancia: Ninguna.</li>
      </ul>
      <div class="spec">Pérdida por inserción en OTDR: en la traza típica la pérdida por inserción es menor a 0.1 dB (Pérdida por inserción: < 0.1dB), recordando que en terreno la norma técnica exige no superar los 0,05 dB.</div>
      <figure class="esquema"><img src="Imagenes/fusion/fus_otdr_evento_gainer.png" alt="Traza OTDR evento no reflectivo y gainer" loading="lazy"><figcaption>Traza OTDR: empalme por fusión como evento no reflectivo (caída) y fenómeno de ganancia aparente (gainer).</figcaption></figure>
      <h3>Ganancia aparente (Gainer) y análisis bi-direccional</h3>
      <p>Un “Gainer” es una ganancia de empalme que aparece cuando dos fibras de diferentes coeficientes de retro-dispersión son fusionadas, mostrando una pequeña ganancia en la traza.</p>
      <p>Debido a diferencias en el coeficiente de retro-esparcimiento, un empalme puede aparecer como una ganancia o una pérdida dependiendo la dirección en que se prueba.</p>
      <p>El análisis bi-direccional se utiliza para minimizar este efecto midiendo el empalme en ambas direcciones y el resultado promedio es la verdadera pérdida del empalme.</p>
      <figure class="esquema"><img src="Imagenes/fusion/fus_otdr_bidireccional.png" alt="Análisis bi-direccional OTDR" loading="lazy"><figcaption>Análisis bi-direccional OTDR: medición en sentidos A-B y B-A promediando valores para obtener la pérdida real.</figcaption></figure>
      <h3>Diferenciación entre macrocurvatura y empalme</h3>
      <p>Las macrocurvaturas resultan de doblar físicamente una fibra.</p>
      <p>Pérdidas por curvaturas son mayores cuando la longitud de onda se incrementa.</p>
      <p>Por lo tanto, para distinguir un doblez de un empalme, se utilizan dos longitudes de onda típicamente 1310 y 1550 nm.</p>
      <figure class="esquema"><img src="Imagenes/fusion/fus_otdr_macrocurvatura.png" alt="Diferenciación de macrocurvatura" loading="lazy"><figcaption>Diferenciación en OTDR: la macrocurvatura presenta mayor pérdida en la longitud de onda de 1550 nm frente a 1310 nm.</figcaption></figure>
      <h3>Pauta de certificación de terreno</h3>
      <p>En la auditoría práctica de instalación de fibra óptica de Cobra se califica como ítem 10 que el técnico realiza fusión, enbandejamiento y rotulado según corresponda.</p>
      <p>Asimismo, en el ítem 8 se verifica que identifica fibra asignada en CTO o CDOI según la norma y realiza medición de potencia óptica en la posición asignada asegurando que se ubique dentro del rango operativo del enlace (parámetros detallados en FTTH-103).</p>

<p>En terreno, el técnico debe dominar la configuración, diagnóstico y mantenimiento de infraestructuras tecnológicas en el ámbito laboral.</p>
<p>Esta preparación técnica permite optimizar habilidades en el diagnóstico y solución de problemas tecnológicos con profesionalismo.</p>
<p>En telecomunicaciones, los clientes corporativos requieren alta disponibilidad mediante acuerdos de nivel de servicio (SLA, Service Level Agreement).</p>
<p>A diferencia de un cliente residencial particular, las empresas dependen de su red de datos y del protocolo de internet (IP) para operar cajas registradoras, transacciones bancarias y servidores de misión crítica.</p>

<h3>Unidades de Competencia Laboral en terreno</h3>
<p>La preparación y organización para una salida técnica efectiva a terreno se estructura mediante unidades de competencia laboral (UCL).</p>
<p>Cada unidad establece una estructura modular para progresar ordenadamente en el diagnóstico, configuración y cierre del servicio.</p>
<table>
<thead><tr><th>Unidad</th><th>Nombre de la Competencia</th><th>Objetivo Operativo en Terreno</th></tr></thead>
<tbody>
<tr><td>UCL 1</td><td>Salida a terreno</td><td>Revisión de instrumental óptico, cables de red, repuestos y vehículo antes de partir.</td></tr>

<tr><td>UCL 4</td><td>Diagnosticar y reparar</td><td>Acceso por consola (CLI) para verificar estados de interfaces, enrutamiento y pruebas de enlace.</td></tr>
<tr><td>UCL 5</td><td>Instalación de servicios</td><td>Montaje físico del router CPE en rack, cableado estructurado y certificación de servicios.</td></tr>
<tr><td>UCL 6</td><td>Cierre de atención</td><td>Capacitación básica del cliente, pruebas de navegación conjunta y firma de protocolo conforme.</td></tr>
</tbody>
</table>
<p>El equipamiento terminal de datos del cliente (CPE, Customer Premises Equipment) se conecta al router de borde del proveedor (PE, Provider Edge).</p>
<p>Para interconectar ambos extremos se utilizan enlaces de fibra óptica mediante módulos ópticos (SFP, Small Form-factor Pluggable) y repartidores (ODF, Optical Distribution Frame), utilizando instrumental óptico como el reflectómetro (OTDR) y el medidor de potencia.</p>

<h3>Revisión física del gabinete y condiciones de sala</h3>
<p>Al llegar a las dependencias del cliente, el técnico realiza el check list del rack y valida las autorizaciones formales en la plataforma Toolbox.</p>
<p>En la etapa de evaluación inicial de la sede, se inspecciona la sala de comunicaciones, verificando sistemas de respaldo de energía ininterrumpida y la conexión a tierra.</p>
<p>El técnico revisa el rack del cliente considerando ubicación, ventilación, red eléctrica y accesibilidad para el equipo de conexión.</p>
<p>El técnico debe verificar que los cables de parcheo de par trenzado y los patch cords de fibra óptica no presenten dobleces pronunciados ni estrangulamientos en los organizadores.</p>
<div class="tip">
<h4>Para entenderlo</h4>
<p>Atender a un cliente corporativo en terreno es como realizar el mantenimiento de un vehículo de emergencia frente a un automóvil particular.</p>
<p>Si se detiene el enlace de datos, cajeros automáticos, bancos y cámaras de seguridad pierden comunicación en la red.</p>
<p>Por ello el personal técnico debe actuar de manera eficiente y segura cumpliendo estándares operativos en cada salida a terreno.</p>
</div>
<h3>En terreno</h3>
<p>El técnico se presenta ante el cliente con uniforme completo, limpio y en buen estado, junto con la credencial visible y la cédula de identidad.</p>
<p>El especialista verifica la ventilación, red eléctrica y accesibilidad del equipo de conexión antes de iniciar la intervención técnica.</p>
<p>Verifica el espacio en el rack o gabinete y comprueba que los organizadores de cables horizontales y verticales mantengan el orden del cableado.</p>
<p>Solo tras validar estas condiciones físicas, procede a conectar el cable de consola para iniciar las pruebas de conectividad de los enlaces de datos.</p>
<h3>Resumen</h3>
<ul>
<li>Los clientes corporativos requieren alta disponibilidad garantizada mediante acuerdos de nivel de servicio SLA.</li>
<li>La preparación y organización para una salida técnica a terreno se rige por las unidades de competencia laboral (UCL) oficiales.</li>
<li>El router CPE en dependencias del cliente se comunica directamente con el router de borde PE del proveedor.</li>
<li>La evaluación inicial completa y segura antes de instalar servicios asegura condiciones técnicas óptimas en el rack o gabinete del cliente.</li>
</ul>`

        html: `<h3>¿Para qué te sirve?</h3>
<p>Comprender cómo viajan los datos te permite diagnosticar de inmediato si una falla de conectividad radica en el equipo del usuario o en el servidor central.</p>
<p>Esta distinción resulta fundamental cuando una empresa reporta lentitud o interrupción en sus aplicaciones de gestión corporativa.</p>
<p>Las redes de computadoras tienen un fin básico: compartir información y recursos entre diversos dispositivos conectados.</p>
<p>Para lograrlo, la industria de telecomunicaciones utiliza dos arquitecturas lógicas principales: el modelo centralizado basado en un sistema operativo de red (NOS) y el modelo distribuido entre pares.</p>
<p>Identificar la arquitectura implementada en la sede corporativa permite aislar cuellos de botella y verificar la disponibilidad de los servicios contratados.</p>
<figure class="esquema"><svg viewBox="0 0 640 250" role="img" aria-label="Modelo de comunicación Cliente-Servidor en redes de datos">
  <rect x="20" y="30" width="160" height="70" rx="6" fill="#cfe0f5" stroke="#3c62ac" stroke-width="2"/>
