<div class="tip">
<h4>Para entenderlo</h4>
<p>Verificar la conectividad de red con herramientas como ping y traceroute es como despachar mensajeros para probar si dos dispositivos pueden comunicarse entre sí y comprobar la disponibilidad de los equipos.</p>
<p>En cambio, si el paquete enviado no recibe respuesta o muestra alta latencia en milisegundos, indica congestión severa o pérdida de paquetes en la ruta de red. Por su parte, las operaciones de ip sla y huawei nqa generan tráfico de red simulado y constante hacia un destino para medir métricas de latencia, jitter y pérdida de paquetes.</p>
</div>

<h3>En terreno</h3>
<p>En terreno, el técnico debe verificar la conectividad de extremo a extremo, monitorear la calidad del servicio, auditar el estado físico de los puertos y configurar filtros de paquetes mediante los procedimientos oficiales del manual.</p>

<h4>1. Verificación de conectividad con Ping y Traceroute (págs. 140–143)</h4>
<p>Para comprobar la disponibilidad de equipos remotos y medir la pérdida de paquetes y la latencia, el especialista ejecuta pruebas de eco ICMP estándar y extendidas, además de trazas de ruta:</p>

<pre><code>ping 192.168.1.1
ping -a 10.1.1.1 -c 10 -s 200 -t 1 8.8.8.8
traceroute 8.8.8.8</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>ping 192.168.1.1</code></td>
      <td>Envía paquetes de solicitud de eco ICMP hacia la puerta de enlace para verificar conectividad básica.</td>
    </tr>
    <tr>
      <td><code>ping -a 10.1.1.1 -c 10 -s 200 -t 1 8.8.8.8</code></td>
      <td>Ejecuta en Huawei un ping extendido especificando IP de origen, 10 paquetes, 200 bytes de carga y timeout de 1 segundo.</td>
    </tr>
    <tr>
      <td><code>traceroute 8.8.8.8</code></td>
      <td>Rastrea la secuencia de saltos y routers intermedios hacia el destino utilizando paquetes con TTL progresivo.</td>
    </tr>
  </tbody>
</table>

<h4>2. Monitoreo activo de calidad con Cisco IP SLA y Huawei NQA (págs. 144–145)</h4>
<p>Para medir retardo, fluctuación de fase (jitter) y pérdida de paquetes de forma continua en enlaces corporativos, se programan pruebas sintéticas de monitoreo activo:</p>

<pre><code>ip sla 1
ip sla schedule 1 life forever start-time now
show ip sla statistics
nqa test-instance icmp-monitor 1
nqa schedule icmp-monitor 1 start-time now lifetime forever
display nqa results test-instance icmp-monitor 1</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>ip sla 1</code></td>
      <td>Crea e ingresa a la configuración de la instancia número 1 de prueba de nivel de servicio en Cisco.</td>
    </tr>
    <tr>
      <td><code>ip sla schedule 1 life forever start-time now</code></td>
      <td>Programa la ejecución inmediata y permanente de la operación de sondeo IP SLA en Cisco.</td>
    </tr>
    <tr>
      <td><code>show ip sla statistics</code></td>
      <td>Muestra los resultados estadísticos consolidados de latencia, éxito y pérdida de paquetes en Cisco.</td>
    </tr>
    <tr>
      <td><code>nqa test-instance icmp-monitor 1</code></td>
      <td>Crea una instancia de prueba de calidad de red NQA de tipo ICMP en routers Huawei.</td>
    </tr>
    <tr>
      <td><code>nqa schedule icmp-monitor 1 start-time now lifetime forever</code></td>
      <td>Inicia la programación continua de la prueba NQA especificada en el sistema Huawei.</td>
    </tr>
    <tr>
      <td><code>display nqa results test-instance icmp-monitor 1</code></td>
      <td>Despliega los resultados detallados de tiempos de respuesta y porcentaje de pérdida de la prueba NQA en Huawei.</td>
    </tr>
  </tbody>
</table>

<h4>3. Diagnóstico de interfaces Ethernet y controladores físicos (págs. 145–146)</h4>
<p>Para diagnosticar fallas de interfaz administrativa down, errores crc input errors o duplex half detectado, el técnico revisa si la causa es cable dañado o negociación fallida:</p>

<pre><code>show ip interface brief
show interfaces GigabitEthernet0/0
show running-config interface GigabitEthernet0/0
show controllers GigabitEthernet0/0
interface GigabitEthernet0/0
display ip interface brief
display interface GigabitEthernet0/0/0
display counters interface
interface GigabitEthernet0/0/0</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>show ip interface brief</code></td>
      <td>Lista de forma resumida el estado administrativo y de protocolo de todas las interfaces en Cisco.</td>
    </tr>
    <tr>
      <td><code>show interfaces GigabitEthernet0/0</code></td>
      <td>Muestra contadores de paquetes, errores CRC, tramas descartadas y configuración dúplex en Cisco.</td>
    </tr>
    <tr>
      <td><code>show running-config interface GigabitEthernet0/0</code></td>
      <td>Muestra los parámetros de configuración activa asignados a la interfaz GigabitEthernet0/0.</td>
    </tr>
    <tr>
      <td><code>show controllers GigabitEthernet0/0</code></td>
      <td>Verifica el estado del hardware interno, chips de transmisión y fallas eléctricas en Cisco.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/0</code></td>
      <td>Ingresa al modo de configuración de la interfaz GigabitEthernet0/0 en el router Cisco.</td>
    </tr>
    <tr>
      <td><code>display ip interface brief</code></td>
      <td>Despliega el resumen de direcciones IP y estado operativo de interfaces en routers Huawei.</td>
    </tr>
    <tr>
      <td><code>display interface GigabitEthernet0/0/0</code></td>
      <td>Muestra estadísticas detalladas de tráfico, ancho de banda y contadores de error en Huawei.</td>
    </tr>
    <tr>
      <td><code>display counters interface</code></td>
      <td>Exhibe una tabla comparativa de contadores de paquetes entrantes y salientes en Huawei.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/0/0</code></td>
      <td>Accede a la vista de configuración de la interfaz GigabitEthernet0/0/0 en Huawei VRP.</td>
    </tr>
  </tbody>
</table>

<h4>4. Listas de Control de Acceso (ACL) estándar y extendidas (págs. 147–148)</h4>
<p>Para controlar el tráfico corporativo y proteger la red contra accesos no autorizados, se configuran listas de control de acceso estándar y extendidas en Cisco y Huawei:</p>

<pre><code>access-list 10 permit 192.168.1.0 0.0.0.255
access-list 10 deny any
interface GigabitEthernet0/0
ip access-group 10 in
access-list 100 permit tcp 192.168.1.0 0.0.0.255 any eq 80
access-list 100 deny ip any any
interface GigabitEthernet0/1
ip access-group 100 out
acl number 2000
rule permit source 192.168.1.0 0.0.0.255
rule deny source any
interface GigabitEthernet0/0/0
acl number 3000
rule permit tcp source 192.168.1.0 0.0.0.255 destination any
rule deny ip
interface GigabitEthernet0/0/1</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>access-list 10 permit 192.168.1.0 0.0.0.255</code></td>
      <td>Crea una regla de ACL estándar en Cisco permitiendo el tráfico proveniente de la subred local.</td>
    </tr>
    <tr>
      <td><code>access-list 10 deny any</code></td>
      <td>Bloquea explícitamente cualquier otro origen no contemplado en la lista estándar de Cisco.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/0</code></td>
      <td>Ingresa a la interfaz física donde se aplicará la política de filtrado de paquetes en Cisco.</td>
    </tr>
    <tr>
      <td><code>ip access-group 10 in</code></td>
      <td>Aplica la lista de control de acceso número 10 al tráfico entrante en la interfaz.</td>
    </tr>
    <tr>
      <td><code>access-list 100 permit tcp 192.168.1.0 0.0.0.255 any eq 80</code></td>
      <td>Define una ACL extendida en Cisco permitiendo tráfico web TCP puerto 80 hacia cualquier destino.</td>
    </tr>
    <tr>
      <td><code>access-list 100 deny ip any any</code></td>
      <td>Deniega cualquier otro tipo de tráfico IP en la lista de control extendida de Cisco.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/1</code></td>
      <td>Selecciona la interfaz de salida donde se aplicará el filtro extendido en Cisco.</td>
    </tr>
    <tr>
      <td><code>ip access-group 100 out</code></td>
      <td>Aplica la ACL extendida número 100 a los paquetes que salen por la interfaz GigabitEthernet0/1.</td>
    </tr>
    <tr>
      <td><code>acl number 2000</code></td>
      <td>Crea una ACL básica numerada en el rango 2000 a 2999 en el sistema Huawei VRP.</td>
    </tr>
    <tr>
      <td><code>rule permit source 192.168.1.0 0.0.0.255</code></td>
      <td>Agrega una regla permisiva para la subred de origen especificada en la ACL básica de Huawei.</td>
    </tr>
    <tr>
      <td><code>rule deny source any</code></td>
      <td>Deniega el tráfico de cualquier otro origen en la lista básica de Huawei.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/0/0</code></td>
      <td>Accede a la interfaz GigabitEthernet0/0/0 para asociar filtros de tráfico en Huawei.</td>
    </tr>
    <tr>
      <td><code>acl number 3000</code></td>
      <td>Crea una ACL avanzada avanzada número 3000 para filtrado por protocolo y puerto en Huawei.</td>
    </tr>
    <tr>
      <td><code>rule permit tcp source 192.168.1.0 0.0.0.255 destination any</code></td>
      <td>Permite flujos TCP desde la subred interna hacia cualquier destino en la ACL avanzada de Huawei.</td>
    </tr>
    <tr>
      <td><code>rule deny ip</code></td>
      <td>Bloquea todo el tráfico IP restante en la regla avanzada de filtrado de Huawei.</td>
    </tr>
    <tr>
      <td><code>interface GigabitEthernet0/0/1</code></td>
      <td>Ingresa a la interfaz GigabitEthernet0/0/1 para asociar la política de filtrado en Huawei.</td>
    </tr>
  </tbody>
</table>

<h4>5. Resolución de problemas en protocolos de enrutamiento RIP (pág. 139)</h4>
<p>Cuando un router no aprende rutas RIP publicitadas por el proveedor o por la red corporativa, se comprueban la versión del protocolo y la tabla de enrutamiento:</p>

<pre><code>display current-configuration | include rip
display rip 1
display rip 1 routing-table
no auto-summary</code></pre>
<table>
  <thead>
    <tr>
      <th>Comando</th>
      <th>Qué hace en el router</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>display current-configuration | include rip</code></td>
      <td>Filtra la configuración en Huawei para verificar los procesos y redes asociadas a RIP.</td>
    </tr>
    <tr>
      <td><code>display rip 1</code></td>
      <td>Muestra el estado operativo del proceso RIP número 1 y los temporizadores activos en Huawei.</td>
    </tr>
    <tr>
      <td><code>display rip 1 routing-table</code></td>
      <td>Lista las rutas aprendidas y las métricas de saltos en la base de datos de RIP en Huawei.</td>
    </tr>
    <tr>
      <td><code>no auto-summary</code></td>
      <td>Desactiva la sumarización automática de rutas en Cisco para permitir el anuncio de subredes con máscara variable.</td>
    </tr>
  </tbody>
</table>

<h3>Resumen</h3>
<p>El procedimiento UCL 4 de pruebas de conectividad y diagnóstico de interfaces establece el estándar metodológico para aislar averías de red en clientes corporativos. El uso combinado de Ping extendido y Traceroute permite evaluar la latencia y los saltos intermedios del trayecto.</p>
<p>Asimismo, la implementación de pruebas sintéticas mediante Cisco IP SLA y Huawei NQA proporciona mediciones objetivas de fluctuación y disponibilidad del enlace. Por último, la interpretación rigurosa de los contadores de errores en interfaces y la aplicación de listas de control de acceso aseguran el óptimo rendimiento y la seguridad del tráfico empresarial.</p>` },

<h3>En terreno</h3>
<p>El proceso formal de instalación en terreno se divide en dos ámbitos complementarios: la planta externa y la planta interna, coordinadas según los estándares de la sección 9.1 del manual técnico. En el exterior se despliega la acometida Drop desde la caja de distribución hasta el punto de ingreso al inmueble. En el interior se ingresa por ductos o escalerillas hacia la sala de telecomunicaciones o sala de rack donde reside el equipamiento de red del cliente.</p>
<p>Al llegar a las dependencias corporativas, el técnico ejecuta las acciones preliminares de la sección 9.3.1: presentarse ante el contacto técnico autorizado, inspeccionar el área de trabajo, portar su equipo de protección personal y verificar la factibilidad eléctrica y de climatización del recinto. Cualquier condición anómala debe registrarse en el formulario de instalación antes de intervenir el gabinete.</p>
<p>Para fijar el router CPE (Customer Premises Equipment) en el rack, se emplean insumos normalizados detallados en la sección 9.3.3. Los rieles verticales del gabinete disponen de orificios cuadrados estandarizados según la norma de 19 pulgadas. Para montar el router en el rack, se fijan las orejas de soporte en las unidades de rack correspondientes utilizando tuercas enjauladas m6 y tornillos de fijación.</p>
<p>La gestión eléctrica es crítica para la continuidad operativa. El router debe conectarse a una unidad de distribución de energía regleta de distribución eléctrica Pdu respaldada por un sistema Ups (Uninterruptible Power Supply). El técnico verifica con un multímetro digital que la tensión de línea sea la nominal, que exista polaridad correcta entre fase y neutro, y que la diferencia de potencial entre neutro y tierra física sea inferior a un voltio para asegurar una descarga a tierra efectiva.</p>
<p>El chasis del equipo de comunicaciones cuenta con un borne metálico de puesta a tierra. Es fundamental verificar que no exista una diferencia significativa de voltaje entre el conductor neutro y la tierra en la barra del gabinete.</p>
<p>Para la construcción manual de cables de red se utilizan alicates de corte y crimpeadora, verificando la continuidad y el correcto crimpado con el probador de cables.</p>
<p>En el patch panel se utiliza una ponchadora como herramienta de inserción para la conexión de cables en el panel del rack. Para identificar claramente cada enlace se utiliza una etiquetadora rotuladora industrial en ambos extremos de los cordones.</p>
<p>Para la instalación interna y externa, el personal técnico verifica si la fibra óptica asignada está activa en cto, cdoi o pce antes de tender el cable drop.</p>

<p>El paso a paso de la sección 9.4 comienza con el tendido exterior desde la red FTTx. Se fija el cable Drop autosoportado respetando los vanos de tensión máximos y utilizando retenciones dieléctricas preformadas. En redes ftth, el técnico conectará el cable drop a la cto correspondiente asegurando el correcto uso de ductos según la normativa técnica vigente.</p>
<p>En redes ftta tradicional, se conectará el cable interior óptico al cdoi asegurando que la fibra no presente defectos ni atenuación excesiva. Si la fibra asignada no puede ser utilizada por estar ocupada o con defecto, se debe solicitar y hacer prueba de nuevas fibras en coordinación con inventario.</p>
<p>Una vez preparado el conector óptico SC-APC (conector de fibra con pulido angular de ocho grados y color verde), el técnico conecta el medidor de potencia óptica calibrado en longitudes de onda de servicio. Se mide el nivel de señal recibido, el cual debe encontrarse dentro de los valores de diseño estipulados en el manual (generalmente entre -15 dBm y -24 dBm). Este valor se anota en el entregable técnico y se captura fotográficamente para certificar la entrega.</p>
<p>Desde el enfrentador del distribuidor ODF se conecta un patch cord monomodo hasta el módulo transceptor SFP (Small Form-factor Pluggable) insertado en la ranura Gigabit del router. Las fibras sobrantes se acomodan en el organizador de cables horizontal de una unidad de rack ubicado inmediatamente debajo o sobre el equipo, rotulando ambos extremos del cordón con etiquetas identificatorias indelebles.</p>
<p>En la etapa final de preparación de la sección 9.4.6, el técnico revisa los parámetros lógicos del script de configuración asignados a la orden técnica: dirección IP WAN (Wide Area Network) del enlace de transporte, máscara de subred, puerta de enlace predeterminada, dirección LAN (Local Area Network) corporativa, identificadores de red virtual VLAN (Virtual Local Area Network), interfaz de gestión Loopback y rutas estáticas hacia el centro de control centro de supervisión (Network Operations Center). Con esta verificación completa, la sede queda lista para la carga del archivo de arranque.</p>

<h3>Resumen</h3>
<p>La instalación de un servicio corporativo bajo la UCL 5 exige precisión mecánica, seguridad eléctrica y pulcritud en la distribución óptica. Instalar los equipos en el rack con organizadores de cables, verificar la tensión de neutro a tierra y medir la potencia óptica aseguran un servicio corporativo.</p>
<p>La verificación instrumental de la potencia óptica en el ODF y el peinado estético del cableado con organizadores garantizan que el enlace cumpla los acuerdos de nivel de servicio acordados con el cliente corporativo, permitiendo una transición fluida hacia la configuración de protocolos.</p>` },

<h4>Para entenderlo</h4>
<p>Configurar un router equivale a redactar el reglamento de tránsito de una ciudad. En la configuración de routers, si aplicas cambios en running-config pero no ejecutas copy running-config startup-config, la configuración activa se pierde al reiniciar el equipo. En los routers, la memoria volátil mantiene los comandos activos mientras el equipo esté encendido, pero se requiere un guardado explícito para que las interfaces y rutas sobrevivan a cualquier corte de energía.</p>
<p>El procedimiento de recuperación de contraseñas en Cisco mediante la secuencia de interrupción break permite cambiar el registro de configuración a 0x2142 para omitir la contraseña: Cambiar el registro a cero equis dos uno cuatro dos (0x2142) le indica al router que encienda ignorando la configuración guardada en memoria. Esto permite al técnico ingresar sin clave, restablecer las credenciales maestras y devolver el registro al valor normal cero equis dos uno cero dos (0x2102) sin perder la configuración previa del cliente.</p>
</div>

<h3>En terreno</h3>
<p>A continuación se detallan los procedimientos oficiales de configuración descritos en las páginas 176 a 195 del manual de certificación. Cada procedimiento cuenta con su bloque de comandos exacto y su tabla explicativa correspondiente.</p>

<p><strong>Procedimiento 1: Configuración de Interfaz GigabitEthernet en Cisco</strong></p>
<p>Para configurar una interfaz de red, fijar la velocidad a 100 megabits por segundo, forzar el modo bidireccional simultáneo y activar el puerto, se ejecutan los siguientes comandos:</p>

<pre>Router>enable
Router#configure terminal
Router(config)# interface GigabitEthernet0/0
Router(config-if)# duplex full
speed 100
no shutdown</pre>
<table>
<thead><tr><th>Comando Cisco</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>Router>enable</code></td><td>Pasa del modo de usuario al modo privilegiado para ejecutar configuraciones avanzadas.</td></tr>
<tr><td><code>Router#configure terminal</code></td><td>Ingresa al modo de configuración global para modificar parámetros del sistema.</td></tr>
<tr><td><code>Router(config)# interface GigabitEthernet0/0</code></td><td>Accede al modo de configuración específico de la interfaz GigabitEthernet.</td></tr>
<tr><td><code>Router(config-if)# duplex full</code></td><td>Fuerza la comunicación bidireccional simultánea en modo dúplex completo.</td></tr>
<tr><td><code>speed 100</code></td><td>Establece manualmente la velocidad del puerto a cien megabits por segundo.</td></tr>
<tr><td><code>no shutdown</code></td><td>Activa administrativamente la interfaz para habilitar la transmisión de datos.</td></tr>
</tbody>
</table>

<p><strong>Procedimiento 2: Configuración de Seguridad y Contraseñas de Acceso en Cisco</strong></p>
<p>Para proteger el acceso físico por puerto de consola y las sesiones remotas de administración mediante terminales virtuales, se configuran las líneas y la contraseña privilegiada:</p>

<pre>Router(config)#line console 0
Router(config-line)#password [nueva_contraseña_consola]
Router(config-line)#login
Router(config-line)#exit
Router(config)#line vty 0 4
Router(config-line)#password [nueva_contraseña_vty]
Router(config-line)#login
Router(config)#enable secret Cisc0123</pre>
<table>
<thead><tr><th>Comando Cisco</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>Router(config)#line console 0</code></td><td>Ingresa a la configuración de la línea de puerto de consola físico.</td></tr>
<tr><td><code>password [nueva_contraseña_consola]</code></td><td>Asigna una clave secreta para la conexión directa mediante el puerto serial de consola.</td></tr>
<tr><td><code>Router(config-line)#login</code></td><td>Habilita la solicitud de contraseña al iniciar sesión en la consola.</td></tr>
<tr><td><code>Router(config-line)#exit</code></td><td>Sale de la configuración de línea y regresa a la configuración global.</td></tr>
<tr><td><code>Router(config)#line vty 0 4</code></td><td>Ingresa a la configuración de las líneas virtuales para acceso por red.</td></tr>
<tr><td><code>password [nueva_contraseña_vty]</code></td><td>Define la clave de autenticación para sesiones remotas a través de las líneas terminales virtuales.</td></tr>
<tr><td><code>Router(config)#enable secret Cisc0123</code></td><td>Establece la contraseña privilegiada cifrada en el archivo de configuración.</td></tr>
</tbody>
</table>

<p><strong>Procedimiento 3: Verificación y Guardado Permanente en Cisco</strong></p>
<p>Para inspeccionar la configuración activa en memoria volátil y guardarla de forma permanente en la memoria de inicio, o cargar scripts mediante servidores de red, se emplean los comandos:</p>

<pre>show running-config
copy running-config startup-config
copy tftp running-config</pre>
<table>
<thead><tr><th>Comando Cisco</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>show running-config</code></td><td>Despliega la configuración activa almacenada en la memoria volátil del router.</td></tr>
<tr><td><code>copy running-config startup-config</code></td><td>Guarda la configuración activa en la memoria persistente para el próximo arranque.</td></tr>
<tr><td><code>copy tftp running-config</code></td><td>Carga un script de configuración desde un servidor de red directamente a la memoria.</td></tr>
</tbody>
</table>

<p><strong>Procedimiento 4: Recuperación de Contraseñas mediante monitor de arranque en Cisco</strong></p>
<p>Para recuperar contraseñas extraviadas en Cisco, se reinicia el router enviando la secuencia de interrupción break durante el arranque para ingresar al monitor de arranque:</p>

<pre>rommon 1 >
confreg 0x2142
boot
Router#copy startup-config running-config
Router(config)#config-register 0x2102
Router(config)#end</pre>
<table>
<thead><tr><th>Comando Cisco</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>rommon 1 ></code></td><td>Indica el prompt del monitor de memoria de arranque tras enviar la secuencia break.</td></tr>
<tr><td><code>confreg 0x2142</code></td><td>Modifica el registro para omitir la configuración guardada en el siguiente reinicio.</td></tr>
<tr><td><code>boot</code></td><td>Inicia el sistema operativo sin cargar las contraseñas previas.</td></tr>
<tr><td><code>Router#copy startup-config running-config</code></td><td>Recupera la configuración original del router para editar la clave olvidada.</td></tr>
<tr><td><code>Router(config)#config-register 0x2102</code></td><td>Restaura el valor de registro normal para arrancar de forma estándar a futuro.</td></tr>
<tr><td><code>Router(config)#end</code></td><td>Finaliza la configuración y regresa al modo privilegiado para el guardado final.</td></tr>
</tbody>
</table>

<p><strong>Procedimiento 5: Configuración de Sistema, Seguridad y Guardado en Huawei</strong></p>
<p>En routers Huawei bajo sistema VRP (plataforma de enrutamiento versátil), se ingresa con credenciales iniciales de usuario admin, se accede a la vista de sistema y se protegen las líneas antes de guardar:</p>

<pre>&lt;Huawei&gt;system-view
[Huawei]user-interface console 0
[Huawei-ui-console0]authentication-mode password
[Huawei-ui-console0]quit
Interface GigabitEthernet 0/0/1
display current-configuration
[Huawei]save</pre>
<table>
<thead><tr><th>Comando Huawei</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>&lt;Huawei&gt;system-view</code></td><td>Pasa de la vista de usuario a la vista de sistema para configurar parámetros.</td></tr>
<tr><td><code>[Huawei]user-interface console 0</code></td><td>Ingresa a la configuración de la línea de consola física de usuario.</td></tr>
<tr><td><code>[Huawei-ui-console0]authentication-mode password</code></td><td>Exige contraseña al conectar terminal localmente en consola.</td></tr>
<tr><td><code>[Huawei-ui-console0]quit</code></td><td>Vuelve de la configuración de interfaz de usuario a la vista de sistema.</td></tr>
<tr><td><code>Interface GigabitEthernet 0/0/1</code></td><td>Ingresa a la interfaz GigabitEthernet 0/0/1 para configurar parámetros físicos e IP en Huawei VRP.</td></tr>
<tr><td><code>display current-configuration</code></td><td>Muestra en pantalla la configuración actual en memoria de trabajo del router.</td></tr>
<tr><td><code>[Huawei]save</code></td><td>Guarda la configuración actual en el almacenamiento flash para el próximo arranque.</td></tr>
</tbody>
</table>

<p><strong>Procedimiento 6: Configuración de Interfaces y Enrutamiento en AudioCodes</strong></p>
<p>Para la pasarela de telefonía AudioCodes, el técnico conecta su computadora al puerto Ethernet con cable de red Cat 5e, identifica la puerta de enlace con ipconfig (192.168.0.1) e ingresa por línea de comandos vía Telnet:</p>

<pre>telnet 192.168.0.1
M800B> enable
M800B# configure data
interface GigabitEthernet 0/0
no firewall enable
ip route 0.0.0.0 192.168.56.1 gigabitethernet 0/0
do wr</pre>
<table>
<thead><tr><th>Comando AudioCodes</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>telnet 192.168.0.1</code></td><td>Inicia la sesión de gestión remota hacia la dirección de enlace del CPE AudioCodes.</td></tr>
<tr><td><code>M800B> enable</code></td><td>Accede al modo privilegiado para la administración técnica del dispositivo.</td></tr>
<tr><td><code>M800B# configure data</code></td><td>Ingresa al modo de configuración de datos de red en el gateway.</td></tr>
<tr><td><code>interface GigabitEthernet 0/0</code></td><td>Selecciona la interfaz GigabitEthernet para asignación de parámetros de red.</td></tr>
<tr><td><code>no firewall enable</code></td><td>Deshabilita el firewall interno en interfaces de transporte de voz corporativa.</td></tr>
<tr><td><code>ip route 0.0.0.0 192.168.56.1 gigabitethernet 0/0</code></td><td>Configura la ruta estática por defecto hacia la puerta de enlace de datos.</td></tr>
<tr><td><code>do wr</code></td><td>Ejecuta la escritura y guardado permanente de la configuración en memoria.</td></tr>
</tbody>
</table>

<h3>Resumen</h3>
<p>El dominio de los procedimientos de configuración en routers multimarca constituye una competencia técnica indispensable para la atención de clientes de empresa. En routers Cisco, la gestión de interfaces, la seguridad de líneas de consola y terminales virtuales, y el guardado con copy running-config startup-config aseguran una red robusta y tolerante a fallas eléctricas.</p>
<p>La secuencia de interrupción en Cisco y el menú de arranque en Huawei permiten recuperar el acceso al router sin perder los archivos de configuración existentes. Por su parte, la correcta parametrización de pasarelas AudioCodes vía CLI o navegador web asegura una integración telefónica limpia y confiable en la sede corporativa.</p>` },

      { id: "ucl6_cierre_pruebas_servicio", title: "Procedimiento UCL 6: Cierre de Atención, Pruebas de Funcionamiento y Entrega del Servicio", min: 12, html: `<h3>¿Para qué te sirve?</h3>
<p>La unidad de competencia laboral seis representa la culminación del trabajo técnico en las dependencias del cliente de empresa. Realizar el cierre formal de la atención técnica asegura la verificación completa del funcionamiento de los servicios y la entrega formal al cliente.</p>
<p>En esta lección aprenderás los estándares profesionales para capacitar formalmente al usuario responsable, ejecutar mediciones de rendimiento bajo protocolos normalizados y registrar evidencias digitales completas en la aplicación móvil Toolbox para efectuar el cierre contractual sin observaciones.</p>

<div class="tip">
<h4>Para entenderlo</h4>
<p>El cierre de atención equivale a la entrega formal de una obra de ingeniería civil. El personal técnico comprueba la conexión a internet mediante pruebas de velocidad speedtest y validación de parámetros de latencia y pérdida de paquetes.</p>
<p>En servicios corporativos, el acta digital es el formulario de cierre en Toolbox. Durante la entrega del servicio se explica al cliente el funcionamiento general de los equipos instalados y el significado de las luces led de estado.</p>

<h3>En terreno</h3>
<p>El procedimiento en terreno se inicia con la etapa de orientación y capacitación descrita en la sección 10.1 del manual. El técnico especialista debe reunir las competencias teóricas y prácticas para transmitir al contacto técnico designado el alcance de la solución entregada. El técnico capacita al cliente en el funcionamiento de los equipos y verifica los parámetros definidos por telefónica chile.</p>
<p>Se abordan con precisión el uso y funcionamiento del router CPE (Customer Premises Equipment). Se identifican los puertos lan habilitados para la red corporativa, las luces led de operación y los canales de soporte técnico ante incidencias.</p>
<p>Finalizada la orientación, el técnico procede con las pruebas de funcionamiento y velocidad de acuerdo con el tipo de servicio contratado, conforme a lo establecido en la sección 10.2. En servicios de Internet Dedicado (ID) e Internet Dedicado Profesional (ID Pro), se conecta un computador portátil al puerto LAN de pruebas del router para medir la tasa de transferencia en sentido de subida y bajada.</p>
<p>Se ejecutan pruebas de velocidad tanto hacia servidores de tráfico nacional como hacia destinos internacionales reconocidos. El técnico constata que el ancho de banda efectivo alcance el porcentaje estipulado en el acuerdo de nivel de servicio SLA (Service Level Agreement).</p>
<p>En servicios con telefonía sobre protocolo SIP (Session Initiation Protocol), conocidos como VPN SIP o SIP Trunk, el técnico verifica la conectividad del softphone o central telefónica del cliente. Se realizan llamadas entrantes y salientes de prueba hacia la red pública conmutada, validando la calidad del audio, la ausencia de retardo perceptible o jitter y la correcta señalización de los tonos de llamada.</p>
<p>Para servicios de redes privadas VPN (Virtual Private Network) corporativas, como enlaces Lan to Lan o soluciones VPN Client, se envían paquetes de sondeo ICMP (Internet Control Message Protocol) continuos mediante la utilidad ping hacia la sede central o el servidor corporativo de referencia. El técnico verifica que la latencia media se mantenga baja y constante, y que el indicador de pérdida de paquetes marque cero por ciento durante toda la medición.</p>

<p>Con las pruebas superadas, el técnico abre la aplicación Toolbox en su terminal móvil para completar el formulario digital de cierre de atención de la sección , vinculado a la plataforma de gestión técnica Toolbox (Task Order Activity). En el formulario de Toolbox se registran el número de petición, proyecto corporativo, código de provisión y la firma de conformidad del cliente.</p>
<p>En el apartado de equipamiento, se selecciona la tipología de servicio (ID, ID Pro, VPN, VPN SIP o Lan to Lan). El técnico indica el modelo exacto del router instalado (por ejemplo, Huawei router Huawei o router Cisco) y transcribe su número de serie de fábrica unívoco.</p>
<p>Asimismo, se ingresa el nombre del especialista de datos que recepciona la entrega en plataforma. Se registran las mediciones eléctricas obtenidas con multímetro: voltaje fase a neutro, voltaje fase a tierra y la tensión residual neutro a tierra, garantizando que esta última no supere el límite máximo de seguridad.</p>
<p>En la sección de evidencias fotográficas de Toolbox se adjuntan imágenes del rack de 19 pulgadas que demuestren el orden del cableado, el equipo energizado y las capturas del test de velocidad.</p>
<p>Finalmente, se solicita la firma de conformidad del cliente en la aplicación móvil o en la orden de trabajo, completando el cierre formal de la atención técnica.</p>

<h3>Resumen</h3>
<p>El cierre de atención bajo la norma UCL 6 asegura que la infraestructura implementada cuente con total respaldo técnico, comercial y operacional. Instruir adecuadamente al usuario sobre el mantenimiento del router y los puertos LAN evita llamados innecesarios a la mesa de ayuda por desconocimiento operativo.</p>
<p>Las pruebas exhaustivas de velocidad en Internet Dedicado, llamadas de prueba en telefonía SIP y latencia mínima en enlaces VPN demuestran el cumplimiento riguroso del acuerdo comercial. Obtener la firma de conformidad del cliente en la orden de trabajo cierra el ciclo de instalación y entrega del servicio corporativo.</p>` },

      { id: "troubleshooting_wireshark_analisis", title: "Diagnóstico y Troubleshooting con Wireshark, Análisis de Protocolos y CLI", min: 14, html: `<h3>¿Para qué te sirve?</h3>
<p>El análisis de protocolos con herramientas como Wireshark y el diagnóstico estructurado mediante comandos de consola constituyen las habilidades más valoradas en el soporte a clientes corporativos. Cuando se presenta una degradación intermitente o una caída de adyacencia de enrutamiento dinámico, las pruebas básicas de conectividad resultan insuficientes para identificar la causa raíz.</p>
<p>Wireshark es una herramienta de análisis de protocolos de red que permite identificar y resolver problemas en la red capturando paquetes.</p>

<div class="tip">
<h4>Para entenderlo</h4>
<p>Capturar paquetes con Wireshark es como realizar una grabación en video en cámara lenta de una autopista de datos. Si una aplicación reporta que la comunicación se corta, mirar el estado de la interfaz solo indica que el semáforo está encendido. Al abrir la captura en Wireshark, el especialista puede analizar paquetes de datos en tiempo real para resolver problemas en la red y pérdida de paquetes.</p>
<p>El protocolo OSPF funciona como un grupo de operadores que deben saludarse con un código estricto a intervalos fijos de tiempo. Si el Router local saluda cada diez segundos pero espera recibir un saludo cada cuarenta segundos, y el vecino fue configurado con intervalos diferentes, la relación de confianza se destruye. El diagnóstico de fallas consiste en leer los mensajes del sistema en el log y alinear los temporizadores de ambas interfaces para que la vecindad se restablezca de inmediato.</p>
</div>

<h3>En terreno</h3>
<p>El capítulo 11 del manual aborda los ejercicios prácticos de resolución de problemas en terreno. La sección 11.1 describe la utilización del analizador de tráfico Wireshark. El técnico especialista ejecuta el aplicativo en su computador portátil conectado a un puerto de monitoreo en espejo o intercala una toma en la interfaz Ethernet o Wi-Fi (Wireless Fidelity) del cliente.</p>
<p>La herramienta opera poniendo la tarjeta de red en modo promiscuo para registrar todos los paquetes que transitan por el medio de transmisión. Para no saturar el búfer de memoria en enlaces de alta velocidad, se aplican filtros de captura iniciales basados en la biblioteca filtro de captura (Berkeley Packet Filter), restringiendo el análisis a una dirección IP (Internet Protocol) objetivo o a un puerto específico.</p>
<p>Una vez capturados los paquetes, el panel principal despliega cada mensaje desglosado en las capas del modelo de interconexión de sistemas abiertos: la cabecera física de la trama Ethernet, el direccionamiento de capa de red IPv4 o IPv6, los puertos y números de secuencia de la capa de transporte TCP o UDP (User Datagram Protocol), y el contenido de aplicación.</p>
<p>La sección 11.2 se enfoca en problemas de conectividad en interfaces y flujo de datos. En sesiones TCP, el técnico valida el correcto establecimiento del saludo de tres vías mediante filtros de visualización. La ausencia del paquete sincronización-acuse desde el servidor evidencia bloqueos en cortafuegos o servicios caídos en el destino. Asimismo, la presencia recurrente de paquetes TCP Retransmission o paquetes duplicados de acuse indica caída de paquetes por saturación de enlace o errores de paridad físicos en el cableado estructurado.</p>
<p>En la sección 11.3 se aborda un escenario habitual de falla en clientes corporativos: dos routers que no logran establecer adyacencia en el protocolo OSPF. El técnico accede a la línea de comandos CLI para inspeccionar el estado de los vecinos y consultar los mensajes históricos en el registro del sistema mediante los siguientes comandos:</p>

<pre><code>show ip ospf neighbor
show logging | include ospf
debug ip ospf events</code></pre>
<table>
<thead><tr><th>Comando</th><th>Qué hace en el router</th></tr></thead>
<tbody>
<tr><td><code>show ip ospf neighbor</code></td><td>Muestra la lista de routers vecinos OSPF, su estado de adyacencia (Init, 2-Way, ExStart, Loading o Full) y el tiempo muerto restante.</td></tr>

<p>Al consultar el registro con display logbuffer, el técnico detecta que el vecino cambió a down debido a hello timer expired. Para solucionar la divergencia, el especialista ingresa a la interfaz y sincroniza los temporizadores exactos que exige el diseño de red:</p>

<p>La sección 11.4 presenta la resolución de incidencias donde el tráfico legítimo de un usuario es bloqueado accidentalmente por una lista de control de acceso ACL. El síntoma se manifiesta en que un equipo no puede comunicarse con un servidor específico pese a que la interfaz física está activa y la ruta de red es válida.</p>
<p>El técnico examina el registro con filtros de seguridad y observa mensajes críticos del tipo SEC-6-IPACCESSLOGP que informan que la lista de control de acceso ha denegado la conexión TCP entre la dirección IP de origen y la de destino. Al inspeccionar la regla secuencial, se verifica si la regla de permiso está ubicada después de una restricción previa o si fue alcanzada por el criterio restrictivo implícito que rechaza cualquier tráfico no autorizado al final de la lista.</p>
<p>La corrección se efectúa modificando la regla extendida para permitir explícitamente el protocolo y puerto de aplicación requeridos antes del cierre de la lista. Finalizada la edición, el técnico repite la prueba de conexión desde el cliente y confirma en el registro de auditoría que el tráfico fluye con normalidad, cerrando el proceso de diagnóstico con una solución definitiva y verificada.</p>

<h3>Resumen</h3>
<p>El diagnóstico profesional de fallas en redes corporativas combina la precisión visual del análisis de tramas en Wireshark con el dominio de la consola CLI del router. Identificar la ausencia de confirmaciones en el saludo TCP de tres vías permite aislar rápidamente problemas de filtrado o caídas en servidores de aplicaciones.</p>
<p>En protocolos de enrutamiento como OSPF, la lectura metódica del log y la sincronización precisa de temporizadores Hello y Dead restablecen la adyacencia operativa sin comprometer la estabilidad del sistema autónomo. Complementar este procedimiento con la corrección ordenada de listas ACL garantiza una conectividad fluida y robusta para los servicios corporativos.</p>` },

  { t: "Huawei VRP", que: "Sistema operativo de red de Huawei que gestiona la configuración y funciones de enrutamiento en sus routers.", ej: "Ingresar al sistema Huawei VRP para configurar las interfaces GigabitEthernet y las rutas estáticas.", c: ["altovalor"] },
  { t: "IANA", que: "Autoridad global responsable de coordinar y asignar matemáticamente bloques de direcciones IP públicas y parámetros de red.", ej: "Consultar el registro de bloques de direcciones IP asignadas legalmente a la empresa de telecomunicaciones.", c: ["altovalor"] },
  { t: "ICANN", que: "Organización internacional que ayuda a garantizar una red global unificada, estable y segura coordinando identificadores.", ej: "Validar la delegación de nombres de dominio institucionales para los servicios corporativos de la empresa.", c: ["altovalor"] },
  { t: "ICMP", que: "Protocolo de mensajes de control que envía solicitudes de eco para evaluar la conectividad y funcionamiento de la red.", ej: "Enviar mensajes de eco ICMP desde la consola del router para comprobar si el servidor remoto responde.", c: ["altovalor"] },
  { t: "IEEE 802.3", que: "Especificación técnica del instituto de ingenieros que estandariza las conexiones y tramas de redes cableadas Ethernet.", ej: "Conectar cables estructurados bajo la norma IEEE 802.3 en los puertos de red del router corporativo.", c: ["altovalor"] },
  { t: "Índice de refracción", que: "Cociente entre la velocidad de la luz en el vacío y la velocidad de la luz en el medio.", ej: "En terreno, este valor permite al reflectómetro calcular con exactitud la distancia recorrida por la luz.", c: ["ftth"] },
  { t: "IP", que: "Protocolo de red que define el formato y conjunto de reglas para estructurar y direccionar paquetes en una red.", ej: "Asignar una dirección IP estática en la interfaz del router corporativo para habilitar el servicio de datos.", c: ["altovalor"] },
  { t: "IP SLA", que: "Mecanismo de monitoreo proactivo en routers Cisco para medir latencia, pérdida de paquetes y disponibilidad del enlace.", ej: "Programar una sonda IP SLA para supervisar la calidad del enlace principal hacia la casa matriz.", c: ["altovalor"] },
  { t: "IPsec", que: "Conjunto de protocolos de seguridad opcional que cifra y autentica paquetes IP para crear conexiones privadas.", ej: "Establecer un túnel seguro IPsec entre el router de la sucursal y la oficina central para transferir datos.", c: ["altovalor"] },
  { t: "IPv4", que: "Protocolo de Internet versión 4 que utiliza un formato de 32 bits dividido en cuatro octetos decimales.", ej: "Configurar la dirección IPv4 privada 192.168.1.1 en la interfaz de red del router corporativo.", c: ["altovalor"] },
  { t: "IPv6", que: "Protocolo estándar para la capa de red que utiliza 128 bits en formato hexadecimal para ampliar direcciones IP.", ej: "Habilitar enrutamiento IPv6 en el router corporativo para permitir tráfico directo sin requerir traducción NAT.", c: ["altovalor"] },
  { t: "ISP (Proveedor de Servicios de Internet)", que: "Empresa proveedora de telecomunicaciones que suministra conectividad, transporte y acceso a la red de Internet.", ej: "Conectar el router corporativo al concentrador de acceso del proveedor ISP mediante un enlace de fibra óptica.", c: ["altovalor"] },
  { t: "ITU-T G.657", que: "Norma técnica internacional que especifica fibras monomodo insensibles a curvaturas reducidas, utilizadas en acometidas domiciliarias.", ej: "El drop interior cumple la norma G.657 permitiendo dobleces de radio ajustado en esquinas de muros.", c: ["ftth"] },
  { t: "Kevlar (hilaza de protección)", que: "Hilaza sintética de alta resistencia mecánica situada bajo la cubierta del cable para soportar la tracción.", ej: "Se retira la hilaza protectora antes de introducir el cable en el conector de campo.", c: ["her", "fusion"] },
  { t: "LAN", que: "Red de área local que agrupa computadoras y periféricos compartiendo una línea de comunicaciones o servidor común.", ej: "Interconectar los computadores e impresoras de la oficina dentro de la misma red LAN corporativa.", c: ["altovalor"] },
  { t: "LC (Lucent Connector)", que: "Conector óptico de factor de forma pequeño con lengüeta de traba tipo RJ, usado en alta densidad.", ej: "Los módulos transceptores SFP de switches y OLT emplean puertos para conectores dúplex LC.", c: ["fusion"] },
  { t: "LSZH (baja emisión de humos y cero halógenos)", que: "Material termoplástico no inflamable y libre de halógenos que evita la emisión de gases tóxicos en caso de combustión.", ej: "Los cables drop que ingresan al interior de las viviendas cuentan obligatoriamente con chaqueta LSZH.", c: ["ftth"] },
  { t: "MAC", que: "Dirección física única de 6 bytes grabada en la tarjeta de red de cada equipo para identificación en capa de enlace.", ej: "Consultar la dirección MAC del computador para verificar su registro de acceso en el switch de la oficina.", c: ["altovalor"] },
  { t: "MACsec", que: "Protocolo de seguridad estandarizado por el IEEE que opera en capa 2 para cifrar directamente tramas Ethernet.", ej: "Habilitar cifrado MACsec en el enlace de red entre dos conmutadores corporativos para proteger las tramas.", c: ["altovalor"] },
  { t: "MAN", que: "Red de área metropolitana que interconecta redes locales y sistemas de comunicaciones a través de una ciudad.", ej: "Comunicar la sede central con las sucursales distribuidas en la misma ciudad a través de la red MAN.", c: ["altovalor"] },
  { t: "NAC", que: "Control de puntos de acceso a la red que restringe la conexión de usuarios y dispositivos no autorizados.", ej: "Bloquear la conexión a la red cableada de un terminal desconocido que no cumple las políticas del sistema NAC.", c: ["altovalor"] },
  { t: "NAT", que: "Mecanismo que traduce direcciones IP privadas de la red local a direcciones públicas para navegar por Internet.", ej: "Habilitar NAT en el router corporativo para que los equipos de la oficina salgan a Internet con una IP pública.", c: ["altovalor"] },
  { t: "NOS (Network Operating System)", que: "Sistema operativo especializado instalado en servidores para administrar recursos y proveer servicios a clientes de red.", ej: "Gestionar permisos de usuarios y carpetas compartidas desde el sistema NOS instalado en el servidor.", c: ["altovalor"] },
  { t: "NQA", que: "Herramienta de análisis de calidad de red en routers Huawei para medir latencia, pérdida y jitter en enlaces.", ej: "Configurar una instancia NQA en el router Huawei para supervisar la calidad de transmisión del enlace.", c: ["altovalor"] },
  { t: "ODF", que: "Marco de distribución óptica o repartidor de fibra óptica que organiza empalmes y bandejas de conexión.", ej: "Conectar un patch cord de fibra óptica desde el puerto del ODF hacia el transceptor óptico del router.", c: ["altovalor"] },
  { t: "OLT (Optical Line Terminal)", que: "Equipo activo situado en la central del operador que envía y recibe la luz de la red GPON hacia las terminales de abonado.", ej: "La central OLT modula y envía la información descendente a través de la longitud de onda de 1490 nm.", c: ["ftth"] },
  { t: "One-Click (lápiz de limpieza óptica)", que: "Dispositivo de limpieza que limpia conectores ópticos en acopladores y rosetas con una pulsación mecánica.", ej: "Se limpia el conector del jumper insertando la pluma One-Click y presionando una vez.", c: ["ftth", "conectores"] },
  { t: "ONT (Optical Network Terminal)", que: "Terminal de red óptica que convierte las señales ópticas de la fibra en conexiones eléctricas de red en el cliente.", ej: "Conectar el cable de red desde la puerta Ethernet de la ONT hacia la interfaz WAN del router corporativo.", c: ["ftth", "conectores", "altovalor"] },
  { t: "OSI (Open Systems Interconnection)", que: "Modelo de referencia de siete capas que estandariza las funciones de comunicación de red entre sistemas abiertos.", ej: "Diagnosticar una falla descartando primero problemas en las capas física y de enlace del modelo OSI.", c: ["altovalor"] },
  { t: "OSPF", que: "Protocolo de enrutamiento dinámico interior que calcula el camino más corto entre routers de la red corporativa.", ej: "Verificar la adyacencia OSPF entre routers de dos sucursales para confirmar el intercambio automático de rutas.", c: ["altovalor"] },
  { t: "OTDR (reflectómetro óptico)", que: "Instrumento de diagnóstico que emite pulsos luminosos para graficar curvas de atenuación y ubicar empalmes o cortes en la fibra.", ej: "Se conecta el OTDR con una bobina de lanzamiento para medir la atenuación de todos los eventos del enlace.", c: ["ftth", "fusion"] },
  { t: "P2P", que: "Modelo de red donde los equipos comparten recursos directamente actuando como clientes y servidores a la vez.", ej: "Compartir una carpeta de archivos o una impresora directamente entre dos terminales de una oficina pequeña.", c: ["altovalor"] },
  { t: "Patch cord óptico (jumper)", que: "Cordón de fibra óptica monofibra con conectores terminados en fábrica en ambos extremos para puentear equipos.", ej: "Se utiliza un patch cord SC/APC verde para unir la roseta óptica mural con el puerto PON del HGU.", c: ["her", "ftth"] },
  { t: "PC (contacto físico)", que: "Tipo de pulido en conectores ópticos con cara plana ligeramente curvada para mantener contacto físico directo entre núcleos.", ej: "Los conectores de pulido PC o UPC suelen identificarse por el color azul en sus carcasas.", c: ["ftth", "conectores"] },
  { t: "PE", que: "Router de borde del proveedor de telecomunicaciones que actúa como punto de enlace hacia el router del cliente.", ej: "Comprobar la conectividad entre el router CPE de la sede y el router PE del proveedor a través de la fibra.", c: ["altovalor"] },
  { t: "Peladora de fibra óptica", que: "Herramienta con muescas mecánicas de alta precisión para retirar la protección primaria y el coating de la fibra sin rayar el vidrio.", ej: "El técnico pela 3 centímetros de recubrimiento usando la muesca de 250 µm de la peladora.", c: ["her", "ftth", "conectores", "fusion"] },
  { t: "Pérdida de retorno", que: "Proporción de potencia lumínica reflejada hacia la fuente en un empalme o conector expresada en decibelios positivos.", ej: "El pulido APC eleva la pérdida de retorno sobre 60 dB, protegiendo el láser del emisor.", c: ["ftth", "conectores"] },
  { t: "Pigtail (cable con conector en un extremo)", que: "Tramo corto de fibra monomodo que cuenta con un conector en una punta y el extremo opuesto libre para empalmarse por fusión.", ej: "Se fusiona el hilo del drop entrante al pigtail para terminar la conexión dentro de la roseta.", c: ["ftth", "conectores", "fusion"] },
  { t: "Ping", que: "Herramienta basada en protocolo ICMP que envía mensajes de solicitud de eco para comprobar conectividad con destinos IP.", ej: "Hacer ping desde la consola del router hacia la puerta de enlace para verificar la respuesta del enlace.", c: ["altovalor"] },
  { t: "Power Meter (medidor de potencia óptica)", que: "Instrumento de medición utilizado para verificar el nivel de potencia lumínica de la señal óptica en decibelios-milivatio.", ej: "Se conecta el Power Meter a la roseta para verificar que la potencia óptica esté dentro del rango adecuado.", c: ["her", "ftth", "conectores"] },
  { t: "PPPoE", que: "Protocolo de red que encapsula tramas punto a punto sobre Ethernet para gestionar conexiones de acceso corporativo.", ej: "Configurar las credenciales de usuario y clave del enlace PPPoE en la interfaz del router corporativo.", c: ["altovalor"] },
  { t: "QoS", que: "Mecanismo de calidad de servicio que prioriza clases de tráfico como telefonía IP para asegurar su rendimiento.", ej: "Asignar prioridad de QoS a los paquetes de voz sobre IP para evitar cortes durante descargas pesadas de datos.", c: ["altovalor"] },
  { t: "Rack", que: "Gabinete metálico estandarizado de 19 pulgadas utilizado para el montaje físico y fijación segura de routers y equipos.", ej: "Fijar el chasis del router con tornillos y tuercas enjauladas a los rieles del rack de 19 pulgadas.", c: ["altovalor"] },
  { t: "Radio de curvatura", que: "Radio mínimo que puede describir una fibra o cable sin sufrir pérdidas ópticas por flexión ni rotura del filamento.", ej: "Al ingresar al domicilio se cuida de no doblar el drop en ángulos rectos menores a 20 mm de curvatura.", c: ["ftth", "fusion"] },
  { t: "RADIUS", que: "Servicio de autenticación remota que valida usuarios y dispositivos antes de permitir el acceso a la red corporativa.", ej: "Autenticar usuarios corporativos en el servidor RADIUS antes de concederles acceso al enlace de datos.", c: ["altovalor"] },
  { t: "Red Mesh (red en malla)", que: "Redes Wi-Fi que permiten solucionar problemas de cobertura y conexión en el hogar.", ej: "En terreno, se instala un repetidor Mesh para ampliar la señal Wi-Fi a zonas alejadas.", c: ["iot"] },
  { t: "Reflexión total interna", que: "Principio físico óptico por el cual un rayo luminoso se refleja íntegramente hacia el núcleo al incidir en el límite con el revestimiento.", ej: "Gracias a la reflexión total la luz viaja largas distancias sin escaparse fuera del vidrio de la fibra.", c: ["ftth"] },
  { t: "RIP", que: "Protocolo de enrutamiento que define cómo los routers comparten información de subredes según el número de saltos.", ej: "Habilitar el protocolo RIP en una red corporativa pequeña para intercambiar tablas de rutas locales.", c: ["altovalor"] },
  { t: "Roseta óptica", que: "Punto de delimitación plástico instalado en el muro del cliente donde se resguarda el empalme y se conecta el jumper al router.", ej: "Se fija la roseta mural con tarugos a 30 cm del piso y se encastra el acoplador SC/APC verde.", c: ["ftth", "conectores", "fusion"] },
  { t: "RSSI", que: "Indicador de nivel de señal que mide la potencia de radiofrecuencia recibida en valores negativos de dBm.", ej: "Medir con el terminal un nivel de señal de -50 dBm en la sala de reuniones para asegurar buena cobertura Wi-Fi.", c: ["altovalor"] },
  { t: "SC (Subscriber Connector)", que: "Conector óptico estándar con cuerpo plástico rectangular y mecanismo de acoplamiento por inserción y empuje directo.", ej: "Los enlaces domiciliarios emplean el estándar SC por su baja pérdida y fácil manipulación en terreno.", c: ["her", "ftth", "conectores"] },
  { t: "SC/APC (conector de contacto angular)", que: "Estándar de conectorización monomodo de carcasa verde con pulido biselado a 8 grados utilizado en todas las redes GPON.", ej: "En las CTO de poste y en las entradas de los routers solo se deben enchufar conectores SC/APC.", c: ["her", "ftth", "conectores"] },
  { t: "SFP", que: "Módulo transceptor óptico enchufable que se inserta en bahías del router para conectar fibras monomodo o multimodo.", ej: "Insertar un módulo SFP en la bahía del router corporativo para conectar el patch cord óptico del enlace.", c: ["altovalor"] },
  { t: "SIP Trunk", que: "Troncal SIP que conecta la central telefónica de la empresa con la red de telefonía IP del proveedor.", ej: "Configurar la troncal SIP en el gateway de voz para habilitar llamadas de telefonía IP en la empresa.", c: ["altovalor"] },
  { t: "SLID (Subscriber Location Identifier)", que: "Contraseña o password GPON configurada en el equipo para su operación en la red.", ej: "En terreno, el técnico ingresa la password GPON en el router para que sincronice con la OLT.", c: ["ftth"] },
  { t: "SMOUV (manguito termocontraíble)", que: "Tubo protector termorretráctil con varilla de refuerzo de acero que aporta solidez mecánica y hermeticidad a una fusión óptica.", ej: "Es regla obligatoria insertar el tubo SMOUV en una de las fibras antes de realizar el corte y la fusión.", c: ["her", "ftth", "fusion"] },
  { t: "SPI", que: "Técnica de cortafuegos que inspecciona paquetes y supervisa el estado de conexiones activas para bloquear tráfico no deseado.", ej: "Habilitar inspección SPI en el router perimetral para descartar automáticamente paquetes entrantes no solicitados.", c: ["altovalor"] },
  { t: "Splitter (divisor óptico pasivo)", que: "Componente pasivo que divide el haz de luz entrante entre varias fibras de salida sin requerir energía eléctrica.", ej: "Un divisor óptico de 1 a 8 en la CTO distribuye la señal de alimentación hacia ocho clientes.", c: ["ftth"] },
  { t: "SSH", que: "Protocolo de comunicación que permite el envío de comandos de forma segura y cifrada a un equipo remoto en el puerto 22.", ej: "Administrar el router corporativo de manera remota mediante una sesión cifrada SSH a través del puerto 22.", c: ["altovalor"] },
  { t: "SSID (nombre de red Wi-Fi)", que: "Identificador de conjunto de servicios que transmite el punto de acceso para identificar la red inalámbrica.", ej: "Configurar el SSID de la red corporativa en los puntos de acceso y seleccionarlo desde el computador portátil.", c: ["ftth", "iot", "altovalor"] },
  { t: "ST (Straight Tip)", que: "Conector óptico circular con mecanismo de bayoneta mediante giro, muy utilizado en redes de fibra multimodo.", ej: "En paneles antiguos de telecomunicaciones es común hallar acopladores para conectores ST.", c: ["ftth"] },
  { t: "SUBTEL", que: "Subsecretaría de Telecomunicaciones encargada de normar, fiscalizar y proteger los derechos de los usuarios de telecomunicaciones.", ej: "Verificar que la velocidad mínima y calidad del enlace corporativo cumplan las exigencias técnicas del regulador.", c: ["altovalor"] },
  { t: "Syslog", que: "Estándar para clasificar, registrar y enviar mensajes de eventos y alertas del router hacia un servidor central.", ej: "Configurar la dirección IP del servidor Syslog en el router para registrar alertas operativas de forma remota.", c: ["altovalor"] },
  { t: "TACACS+", que: "Protocolo de seguridad cliente servidor utilizado en routers para administrar autenticación y autorización de comandos.", ej: "Validar los permisos de los administradores que ingresan a la consola del router mediante el servidor TACACS+.", c: ["altovalor"] },
  { t: "TCP", que: "Protocolo de capa de transporte que asegura la comunicación confiable y ordenada de datos entre equipos de red.", ej: "Establecer una sesión TCP entre el computador cliente y el servidor de correo para asegurar la entrega de datos.", c: ["altovalor"] },
  { t: "Telnet", que: "Protocolo antiguo de administración remota no seguro que envía texto plano, reemplazado por SSH en redes corporativas.", ej: "Sustituir las sesiones antiguas de Telnet en el router por conexiones cifradas SSH para proteger contraseñas.", c: ["altovalor"] },
  { t: "Tijera para Kevlar", que: "Tijera especial fabricada para cortar limpiamente los filamentos sintéticos de tracción del cable sin dañar la fibra.", ej: "Se seccionan los filamentos amarillos de protección con la tijera al preparar el extremo del drop.", c: ["her", "fusion"] },
  { t: "Toallas de papel suave", que: "Paños de papel que no desprenden fibras ni pelusas, empleados junto con alcohol isopropílico para asear la fibra desnuda.", ej: "Se limpia el hilo de vidrio con toallas libres de pelusa antes de proceder al corte con cleaver.", c: ["fusion"] },
  { t: "Toolbox", que: "Aplicativo corporativo para corroborar el itinerario, registrar la entrega del servicio, la casa cerrada y documentar el cierre.", ej: "Registrar la información correspondiente al servicio instalado en el aplicativo Toolbox al finalizar la atención.", c: ["altovalor"] },
  { t: "Traceroute", que: "Herramienta de diagnóstico que rastrea y enumera los routers intermedios que atraviesa un paquete hasta su destino.", ej: "Ejecutar traceroute desde el router corporativo para identificar en qué salto de la red se detiene el tráfico.", c: ["altovalor"] },
  { t: "TTL", que: "Tiempo de vida expresado en saltos en el encabezado IP que evita que un paquete circule indefinidamente en la red.", ej: "Verificar el valor de TTL en las respuestas de ping para confirmar que el paquete no ingrese en bucles.", c: ["altovalor"] },
  { t: "UCL 1", que: "Unidad de competencia laboral que norma la preparación de herramientas, equipos y móvil antes de acudir a terreno.", ej: "Revisar el estado de carga del instrumental óptico y los cables de prueba en el móvil antes de salir a terreno.", c: ["altovalor"] },
  { t: "UCL 2", que: "Unidad de competencia laboral que norma la presentación formal, validación de la orden de trabajo y acceso a la sede.", ej: "Presentarse con credencial visible ante el encargado de seguridad del banco y validar la orden de trabajo.", c: ["altovalor"] },
  { t: "UCL 3", que: "Unidad de competencia laboral que norma la evaluación inicial de infraestructura, rack de 19 pulgadas y energía.", ej: "Inspeccionar el estado del rack de 19 pulgadas, la puesta a tierra y la temperatura de la sala técnica corporativa.", c: ["altovalor"] },
  { t: "UCL 4", que: "Unidad de competencia laboral que norma el diagnóstico, acceso por consola CLI y reparación de fallas de conectividad.", ej: "Conectar el computador a la consola del router para diagnosticar y restablecer la conectividad del enlace.", c: ["altovalor"] },
  { t: "UCL 5", que: "Unidad de competencia laboral que norma la instalación del router CPE en rack y certificación de servicios contratados.", ej: "Instalar el router CPE en el rack mediante tuercas enjauladas y certificar la transmisión de datos del servicio.", c: ["altovalor"] },
  { t: "UCL 6", que: "Unidad de competencia laboral que norma la capacitación y orientación al cliente corporativo en el cierre de atención.", ej: "Entregar al administrador de la empresa las recomendaciones técnicas del servicio y firmar el protocolo de cierre.", c: ["altovalor"] },
  { t: "UDP", que: "Protocolo de transporte sin conexión que envía paquetes rápidamente sin confirmación, utilizado en voz sobre IP.", ej: "Transmitir paquetes de voz sobre IP mediante el protocolo UDP para evitar retrasos de retransmisión.", c: ["altovalor"] },
  { t: "UPC (Ultra Physical Contact)", que: "Pulido de conector óptico con cara convexa de terminación recta que asegura contacto físico directo.", ej: "Se conecta un latiguillo con pulido UPC azul en el puerto del equipo de medición.", c: ["ftth", "conectores"] },
  { t: "VFL (localizador visual de fallas)", que: "Emisor láser de luz roja visible que viaja por la fibra para evidenciar curvaturas excesivas, quiebres internos o identificar hilos.", ej: "Se inyecta la luz roja del VFL en la roseta para verificar visualmente la llegada de la señal en la CTO.", c: ["ftth", "conectores"] },
  { t: "VLAN", que: "Red de área local virtual configurada en switches para aislar el tráfico de red de forma lógica y ordenada.", ej: "Separar el tráfico de las cámaras de seguridad del tráfico de computadores corporativos mediante una VLAN dedicada.", c: ["altovalor"] },
  { t: "VPN", que: "Red privada virtual que crea una conexión lógica cifrada a través de Internet para comunicar sedes y usuarios remotos.", ej: "Configurar una red VPN entre la sucursal bancaria y la casa matriz para transmitir datos confidenciales.", c: ["altovalor"] },
  { t: "WAN", que: "Red de área mundial que interconecta múltiples redes locales a través de grandes distancias geográficas mediante routers.", ej: "Comunicar la casa matriz con sucursales ubicadas en diferentes regiones del país mediante el enlace WAN.", c: ["altovalor"] },
  { t: "Wi-Fi", que: "Tecnología de red inalámbrica que utiliza ondas de radio en 2,4 GHz y 5 GHz para conectar computadores a la red local.", ej: "Conectar terminales móviles y computadores portátiles a la red corporativa mediante la banda Wi-Fi de 5 GHz.", c: ["altovalor"] },

function rutNormalizar(v) {
  const t = String(v || "").toUpperCase().replace(/[^0-9K]/g, "");
  return t.length < 2 ? "" : t.slice(0, -1) + "-" + t.slice(-1);
}
function rutValido(v) {
  const r = rutNormalizar(v); if (!/^[0-9]{6,8}-[0-9K]$/.test(r)) return false;
  const [cuerpo, dv] = r.split("-"); let suma = 0, mult = 2;
  for (let i = cuerpo.length - 1; i >= 0; i--) { suma += +cuerpo[i] * mult; mult = mult === 7 ? 2 : mult + 1; }
  const res = 11 - (suma % 11);
  return dv === (res === 11 ? "0" : res === 10 ? "K" : String(res));
}
function rutFormato(v) {
  const r = rutNormalizar(v); if (!r) return String(v || "").replace(/[^0-9kK]/g, "");
  const [c, d] = r.split("-"); return c.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + d;
}

async function guardarEditor() {
  const ed = S.ed, ap = +ed.cfg.aprobacion, mi = +ed.cfg.max_intentos;
  const fallo = m => { ed.aviso = m; ed.error = true; render(); document.getElementById("ed-form")?.scrollIntoView({ block: "start" }); };
  if (!(Number.isInteger(ap) && ap >= 1 && ap <= 100)) return fallo("La nota para aprobar debe ser un número entre 1 y 100.");
  if (!(Number.isInteger(mi) && mi >= 1 && mi <= 20)) return fallo("Los intentos deben ser un número entre 1 y 20.");
  for (const [i, q] of ed.preguntas.entries()) {
    if (!q.enunciado.trim()) return fallo(`La pregunta ${i + 1} no tiene enunciado.`);
    if (q.alternativas.some(a => !a.trim())) return fallo(`La pregunta ${i + 1} tiene una alternativa vacía.`);
    if (!(q.correcta >= 0 && q.correcta < q.alternativas.length)) return fallo(`Marca la alternativa correcta de la pregunta ${i + 1}.`);
  }
  ed.guardando = true; ed.aviso = ""; render();
  try {
    let r = await sb.from("pruebas").upsert({ curso_id: ed.curso, aprobacion: ap, max_intentos: mi, activa: !!ed.cfg.activa, actualizado_en: new Date().toISOString() });
    if (r.error) throw r.error;
    if (ed.borradas.length) { r = await sb.from("preguntas").delete().in("id", ed.borradas); if (r.error) throw r.error; }
    const filas = ed.preguntas.map((q, i) => ({ id: q.id || (q.id = crypto.randomUUID()), curso_id: ed.curso, orden: i, enunciado: q.enunciado.trim(), alternativas: q.alternativas.map(a => a.trim()), correcta: q.correcta }));
    if (filas.length) { r = await sb.from("preguntas").upsert(filas); if (r.error) throw r.error; }
    ed.borradas = []; ed.error = false;
    ed.aviso = `Evaluación guardada: ${filas.length} pregunta${filas.length === 1 ? "" : "s"}.`;
  } catch (e) {
    ed.error = true;
    ed.aviso = /permission|policy|security/i.test(e?.message || "") ? "No se pudo guardar: solo los administradores pueden editar evaluaciones." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
  }
  ed.guardando = false; render(); document.getElementById("ed-form")?.scrollIntoView({ block: "start" });
}
function editorClick(t) {
  const ed = S.ed, d = t.dataset;
  if (d.edCurso) { cargarEditor(d.edCurso); return true; }
  if (t.hasAttribute("data-ed-mas")) { ed.preguntas.push({ enunciado: "", alternativas: ["", "", "", ""], correcta: -1 }); ed.aviso = ""; render(); document.querySelector(`[data-edq="${ed.preguntas.length - 1}"]`)?.focus(); return true; }
  if (d.edQuitar != null) {
    const q = ed.preguntas[+d.edQuitar];
    if ((q.enunciado.trim() || q.id) && !confirm(`¿Eliminar la pregunta ${+d.edQuitar + 1}? Se borra al guardar la evaluación.`)) return true;
    if (q.id) ed.borradas.push(q.id);
    ed.preguntas.splice(+d.edQuitar, 1); render(); return true;
  }
  if (d.edMasAlt != null) { ed.preguntas[+d.edMasAlt].alternativas.push(""); render(); return true; }
  if (d.edQuitarAlt != null) {
    const [i, j] = d.edQuitarAlt.split("-").map(Number), q = ed.preguntas[i];
    q.alternativas.splice(j, 1);
    q.correcta = q.correcta === j ? -1 : q.correcta > j ? q.correcta - 1 : q.correcta;
    render(); return true;
  }
  return false;
}

async function crearUsuario() {
  const u = us(); if (u.enviando) return;
  const rut = document.getElementById("us-rut").value, nombre = document.getElementById("us-nombre").value.trim();
  const op = document.getElementById("us-op").value, rol = document.getElementById("us-rol").value;
  const aviso = (m, err) => { u.aviso = m; u.error = err; u.enviando = false; render(); window.scrollTo(0, 0); };
  if (!rutValido(rut)) return aviso("Revisa el RUT: no es válido.", true);
  if (nombre.length < 3) return aviso("Escribe el nombre completo.", true);
  u.enviando = true; render();
  const { data, error } = await sb.rpc("admin_crear_usuario", { p_rut: rut, p_nombre: nombre, p_operacion: op || null, p_rol: rol });
  if (error) return aviso("No se pudo crear: " + errorUsuario(error.message), true);
  await cargarUsuarios();
  if (data !== "existe") u.modal = { tipo: "msg", titulo: `${esc(nombre)} ya puede <b>entrar</b>`, msg: mensajeAcceso({ nombre, rut }, u.ini.valor) };
  aviso(data === "existe" ? `El RUT ${rutFormato(rut)} ya tenía usuario: no se modificó.` : `Listo: ${nombre} (${NIVELES[rol]}) ya puede entrar con su RUT y la clave inicial.`, data === "existe");
}
async function cargaMasiva() {
  const u = us(); if (u.enviando) return;
  const texto = document.getElementById("us-masivo").value;
  const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const res = { creados: 0, existian: 0, errores: [] };
  const filas = [];
  for (const [i, l] of lineas.entries()) {
    const c = (l.includes("\t") ? l.split("\t") : l.includes(";") ? l.split(";") : l.split(",")).map(x => x.trim());
    if (i === 0 && /rut/i.test(c[0]) && !rutValido(c[0])) continue; // fila de encabezados
    const op = opDesdeTexto(c[2]), rol = nivelDesdeTexto(c[3]);
    if (!rutValido(c[0])) { res.errores.push(`Fila ${i + 1}: RUT no válido (${c[0] || "vacío"})`); continue; }
    if (!c[1] || c[1].length < 3) { res.errores.push(`Fila ${i + 1}: falta el nombre (${c[0]})`); continue; }
    if (op === "?") { res.errores.push(`Fila ${i + 1}: operación no reconocida "${c[2]}" (usa Tigo o VTR)`); continue; }
    if (rol === "?") { res.errores.push(`Fila ${i + 1}: nivel no reconocido "${c[3]}"`); continue; }
    filas.push({ rut: c[0], nombre: c[1], op: op || null, rol, fila: i + 1 });
  }
  if (!filas.length && !res.errores.length) { u.aviso = "Pega primero las filas copiadas desde Excel."; u.error = true; render(); return; }
  u.enviando = true; u.masivo = null; u.aviso = "";
  for (const [k, f] of filas.entries()) {
    u.progreso = `Creando ${k + 1} de ${filas.length}…`; if (k % 5 === 0) render();
    const { data, error } = await sb.rpc("admin_crear_usuario", { p_rut: f.rut, p_nombre: f.nombre, p_operacion: f.op, p_rol: f.rol });
    if (error) { res.errores.push(`Fila ${f.fila} (${f.rut}): ${errorUsuario(error.message)}`); if (/Falta activar|permiso/.test(errorUsuario(error.message))) break; }
    else if (data === "existe") res.existian++; else res.creados++;
  }
  u.enviando = false; u.progreso = ""; u.masivo = res;
  await cargarUsuarios();
  render(); document.getElementById("us-masivo-form")?.scrollIntoView({ block: "start" });
}
async function guardarUsuario(id) {

function fmtFechaHora(iso) { try { return new Date(iso).toLocaleString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } }
function dispositivo() {
  const ua = navigator.userAgent;
  return /iPad|Tablet/i.test(ua) ? "Tablet" : /Mobi|Android|iPhone/i.test(ua) ? "Celular" : "Computador";
}
/* Estado de un técnico en un curso: na (no es de su operación), ok, no (reprobó la prueba), go (en curso), sin (sin iniciar) */
function estadoCurso(t, c) {
  if (c.op && t.operacion && c.op !== t.operacion) return "na";
  const st = courseStats(t.p, c), r = S.res?.[t.id]?.[c.id];
  if (st.passed || r?.aprobado) return "ok";
  if (r) return "no";
  return st.pct > 0 ? "go" : "sin";
}

    return { c, n, tot };

  const seg = (k, v, tot, nombre) => v ? `<span class="s-${k}" style="width:${v / tot * 100}%" title="${nombre}: ${v}">${v / tot >= .07 ? v : ""}</span>` : "";

async function loadTeam() {
  const [{ data: perfiles, error: e1 }, { data: avances, error: e2 }] = await Promise.all([
    sb.from("perfiles").select("*").order("nombre"),
    sb.from("avance").select("usuario_id, lecciones, evaluaciones, actualizado_en")
  ]);
  S.teamOk = !(e1 || e2);
  if (e1 || e2) { S.teamLoaded = true; return; }
  const { data: res } = await sb.from("resultados").select("usuario_id, curso_id, mejor_nota, aprobado, intentos");
  S.res = {};
  for (const r of res || []) (S.res[r.usuario_id] ||= {})[r.curso_id] = r;
  const porId = Object.fromEntries((avances || []).map(a => [a.usuario_id, a]));
  // Todos los niveles: los supervisores y administradores también rinden cursos (pedido del usuario, 22-10-2026).
  S.team = (perfiles || []).map(p => {
    const a = porId[p.id];
    return { ...p, p: { lessons: a?.lecciones || {}, quiz: a?.evaluaciones || {}, updatedAt: a?.actualizado_en || null } };
  });
  if (S.me?.rol === "admin") {
    const { data: ing } = await sb.from("ingresos").select("fecha, dispositivo, perfiles(nombre, rut, rol)").order("fecha", { ascending: false }).limit(50);

  }
  S.teamLoaded = true;
}

let strandsRaf = 0;
function drawStrands() {
  const cv = document.getElementById("strands"); if (!cv) return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = Array.from({ length: 12 }, (_, i) => ({ y: h * (0.2 + i * 0.06), a: 8 + (i % 5) * 6, f: 0.004 + (i % 4) * 0.0012, p: i * 0.7, hot: i % 4 === 1 }));
  let t = 0;
  cancelAnimationFrame(strandsRaf);
  const frame = () => {
    ctx.clearRect(0, 0, w, h);
    const x0 = w * 0.42;
    for (const l of lines) {
      ctx.beginPath();
      for (let x = x0; x <= w + 12; x += 12) {
        const y = l.y + Math.sin(x * l.f + l.p + t) * l.a + (x - x0) * 0.16;
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = l.hot ? "rgba(240,165,0,.28)" : "rgba(160,190,235,.13)";
      ctx.lineWidth = l.hot ? 1.6 : 1;
      ctx.stroke();
    }
    t += 0.005;
    if (!reduce && document.getElementById("strands") === cv) strandsRaf = requestAnimationFrame(frame);
  };
  frame();
}

// 4) Ruta completa: confeti con los 12 colores del código de fibras
function confeti() {
  if (sinMovimiento()) return;
  const cv = document.createElement("canvas"); cv.className = "egg-confeti"; document.body.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.7, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2, w: 6 + Math.random() * 7, h: 3 + Math.random() * 3, c: COLORES_FIBRA[Math.floor(Math.random() * 12)] }));
  const t0 = performance.now();
  const frame = t => {
    ctx.clearRect(0, 0, W, H);
    for (const q of ps) { q.x += q.vx; q.y += q.vy; q.vy += 0.03; q.r += q.vr;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.strokeRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore(); }
    if (t - t0 < 6000) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
}

    tabla.querySelectorAll("thead th").forEach((x) => delete x.dataset.orden);
    th.dataset.orden = asc ? "asc" : "desc";
    const filas = Array.from(cuerpo.rows);
    filas.sort((a, b) => {
      const x = valor(a.cells[col]), y = valor(b.cells[col]);
      if (x === null || y === null) return x === y ? 0 : x === null ? 1 : -1;
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "es", { numeric: true });
      return asc ? r : -r;
    });
    filas.forEach((f) => cuerpo.appendChild(f));
  });
})();

// Bloques que aparecen al bajar, solo cuando se entra a otra vista (no en cada
// clic dentro de una evaluacion). Sin soporte o con "reducir movimiento", nada se oculta.
const SIN_MOVIMIENTO = !("IntersectionObserver" in window) || !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let vistaAnimada = null;
function aparecerAlBajar() {
  if (SIN_MOVIMIENTO || S.view === vistaAnimada) return;
  vistaAnimada = S.view;
  const piezas = [];
  Array.from(document.getElementById("app").children).forEach((b) => {
    const hijos = Array.from(b.children);
    if (hijos.length > 1 && hijos.length <= 12 && getComputedStyle(b).display === "grid") piezas.push(...hijos); else piezas.push(b);
  });
  const o = new IntersectionObserver((entradas) => entradas.forEach((e) => {
    if (!e.isIntersecting) return;
    o.unobserve(e.target);
    e.target.classList.add("rv-ver");
    setTimeout(() => { e.target.style.transitionDelay = ""; e.target.classList.remove("rv", "rv-ver"); }, 1600);
  }), { rootMargin: "0px 0px -6% 0px", threshold: 0.05 });
  piezas.forEach((el, i) => { el.classList.add("rv"); el.style.transitionDelay = Math.min(i % 6, 5) * 90 + "ms"; o.observe(el); });
}
</script>
