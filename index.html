<style>
/* Lenguaje visual Grupo Cobra: tipografía grotesca liviana en mayúsculas con palabra clave en negrita, azul marino + azul medio,
   secciones gris claro, franja de íconos con divisores finos, esquinas rectas, acentos ámbar. Tema claro único, por decisión de marca. */
:root {
  color-scheme: light;
  --navy: #003575; --blue: #3c62ac; --bright: #0069c4; --amber: #f0a500;
  --bg: #f2f2f2; --white: #ffffff; --ink: #334155; --muted: #62646e; --line: #d9dbe0; --line-navy: #003575;
  --ok: #1f7a45; --ok-bg: #e2f1e8; --warn: #9a5b00; --warn-bg: #fdf1d8;
  --f1: #1f5fbf; --f2: #e0701a; --f3: #2c8a45; --f4: #7a4b2a; --f5: #8a8f98; --f6: #b9c0c8; --f7: #c62828; --f8: #2e2e2e;
  --font: "Helvetica Neue", "Hanken Grotesk", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font) }
img { max-width: 100% }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px }
@media (max-width: 480px) { .wrap { padding-inline: 16px } }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.eyebrow { font: 600 12px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }

.sec-title { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 26px }
.sec-title h2 { font: 200 32px/1.1 var(--font); color: var(--blue); text-transform: uppercase; letter-spacing: .04em }
.sec-title h2 b { font-weight: 700; color: var(--navy) }
.sec-title p { margin: 0; color: var(--muted); max-width: 52ch }

/* ---- cabecera ---- */
header.top { background: var(--white); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; min-height: 72px; padding-block: 8px }
.brand { display: flex; align-items: center; gap: 18px; margin-right: auto; border: 0; background: none; padding: 0; text-align: left }
.brand img { height: 40px; width: auto; display: block }
.brand .sep { width: 1px; height: 34px; background: var(--line) }
.brand b { display: block; font: 300 18px/1.1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--blue) }
.brand b strong { font-weight: 700; color: var(--navy) }
nav.tabs { display: flex; gap: 4px 26px; flex-wrap: wrap }
nav.tabs button { border: 0; background: none; padding: 8px 0; font: 500 14px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent }
nav.tabs button:hover { color: var(--navy) }
nav.tabs button[aria-current="page"] { color: var(--navy); border-bottom-color: var(--amber) }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted) }
.who img { width: 28px; height: 28px; border-radius: 50% }
@media (max-width: 560px) { .brand img { height: 30px } .brand b { font-size: 14px } .brand .sep { height: 26px } }

/* ---- portada ---- */
.hero { position: relative; overflow: hidden; color: #ffffff; background: #003575 }
.hero .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 74%; background: url("Imagenes/fondo-portada.jpg?v=4") 55% 22% / cover no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 25%, rgba(0,0,0,.8) 48%, #000 65%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.35) 25%, rgba(0,0,0,.8) 48%, #000 65%) }
/* velo: navy sólido bajo el texto, se abre hacia la derecha para dejar ver al técnico */
.hero .shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, #003575 0%, #003575 26%, rgba(0, 53, 117, .9) 36%, rgba(0, 53, 117, .68) 46%, rgba(0, 53, 117, .4) 56%, rgba(0, 53, 117, .16) 67%, rgba(0, 53, 117, 0) 82%),
              linear-gradient(0deg, rgba(0, 34, 77, .5) 0%, rgba(0, 34, 77, 0) 38%) }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 600px); gap: 20px; align-content: center; min-height: 360px; padding-block: 34px 30px }  /* hero más bajo (usuario, 23-10-2026) */
@media (max-width: 860px) {
  .hero .photo { width: 100%; bottom: auto; height: 340px; background-position: 46% 30%; -webkit-mask-image: none; mask-image: none }
  .hero .shade { background: linear-gradient(180deg, rgba(0, 34, 77, 0) 0%, rgba(0, 34, 77, 0) 150px, rgba(0, 53, 117, .9) 300px, #003575 340px) }
  .hero .wrap { min-height: 0; padding-block: 250px 52px }
}
/* textura: haz de fibras ópticas finas sobre el azul, se desvanece antes de la foto */
.hero .fibers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 38%, transparent 66%); mask-image: linear-gradient(90deg, #000 0%, #000 38%, transparent 66%) }
.hero .fibers path { fill: none; vector-effect: non-scaling-stroke }
.hero .fibers .strand path { stroke: rgba(160, 195, 240, .1); stroke-width: 1 }
.hero .fibers .pulse { stroke: rgba(255, 190, 60, .32); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 70 1500; stroke-dashoffset: 1570 }
@media (prefers-reduced-motion: no-preference) {
  .hero .fibers .pulse { animation: pulse 6s linear infinite }
  .hero .fibers .p1 { animation-delay: -2s; animation-duration: 7s }
  .hero .fibers .p2 { animation-delay: -4.5s; animation-duration: 6.5s }
  .hero .fibers .p3 { animation-delay: -1s; animation-duration: 8s }
  .hero .fibers .p4 { animation-delay: -5.5s; animation-duration: 5.5s }
  .hero .fibers .p5 { animation-delay: -3s; animation-duration: 7.5s }
  .hero .fibers .p6 { animation-delay: -6s; animation-duration: 6.8s }
}
@media (prefers-reduced-motion: reduce) { .hero .fibers .pulse { display: none } }
@keyframes pulse { from { stroke-dashoffset: 1570 } to { stroke-dashoffset: 0 } }
@media (max-width: 860px) {
  .hero .fibers { -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 260px, #000 420px); mask-image: linear-gradient(180deg, transparent 0, transparent 260px, #000 420px) }
}
.hero h1, .hero .lede { text-shadow: 0 1px 18px rgba(0, 20, 50, .35) }
.hero .eyebrow { color: #9fc2f0 }
.hero h1 { font: 200 clamp(28px, 3.6vw, 42px)/1.08 var(--font); letter-spacing: .01em; margin: 10px 0 12px }
.hero h1 b { font-weight: 700; display: block }
.hero .lede { color: #c9d7ee; font-size: 15px; font-weight: 300; max-width: 52ch; margin: 0 0 18px }
.cta { display: inline-flex; align-items: center; gap: 18px; border: 0; background: var(--amber); color: #1d1a12; padding: 14px 22px; border-radius: 2px; font: 600 16px/1.25 var(--font); text-align: left }
.cta:hover { background: #ffb61a }
.cta small { display: block; font: 600 11px/1.3 var(--font); letter-spacing: .12em; text-transform: uppercase; opacity: .75 }
.cta .arrow { font-size: 22px; line-height: 1 }
.gauge { border-top: 1px solid rgba(255, 255, 255, .25); padding-top: 16px; max-width: 520px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center }
@media (max-width: 420px) { .gauge { grid-template-columns: 1fr } }
.ring { width: 86px; height: 86px; position: relative }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center }
.ring .val b { font: 200 28px/1 var(--font); font-variant-numeric: tabular-nums }
.ring .val span { font: 600 10px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #9fc2f0 }
.kv { display: grid; gap: 0; margin: 0 }
.kv div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, .18); padding: 8px 0 }
.kv div:last-child { border-bottom: 0 }
.kv dt { color: #c9d7ee; font-size: 14px; font-weight: 300 }
.kv dd { margin: 0; font: 600 20px/1 var(--font); font-variant-numeric: tabular-nums }

/* ---- franja de cursos con anillos (portada) ----
   Opción C2 (usuario, 23-10-2026): un anillo por curso que se llena con el avance; ruta base arriba y complementarios abajo.
   Reemplaza a la sección "Ruta de formación" y a las tarjetas, que repetían los mismos cursos. */
.tiles { background: var(--white); padding: 34px 0 28px }
.tiles .fila { display: flex; justify-content: space-around; max-width: 980px; margin: 0 auto }
.tiles .fila.comp { justify-content: center; gap: 12% }
/* La ruta base va unida por una línea, como la "Ruta de formación" anterior que le gustaba al usuario (23-10-2026). */
.tiles .fila.ruta { position: relative; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)) }
.tiles .fila.ruta::before { content: ""; position: absolute; left: calc(50% / var(--n, 4)); right: calc(50% / var(--n, 4)); top: 46px; height: 1px; background: var(--navy); opacity: .35 }
.tile .anillo { background: var(--white); z-index: 1 }
.tile .anillo.done { background: var(--navy) }
.tile .anillo.done > svg:not(.arc) { stroke: #ffffff }
.tiles .rot { display: flex; align-items: center; gap: 14px; max-width: 980px; margin: 22px auto 16px; padding-inline: 24px }
.tiles .rot::before, .tiles .rot::after { content: ""; flex: 1; height: 1px; background: var(--line) }
.tiles .rot em { font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-style: normal; text-align: center }
.tile { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 8px 10px; border-radius: 10px; min-width: 0; cursor: pointer }
.tile:hover { background: #f4f6fa }
.tile .anillo { position: relative; width: 76px; height: 76px; display: grid; place-items: center; border-radius: 50% }
.tile .anillo.now { box-shadow: 0 0 0 7px rgba(240, 165, 0, .16) }
.tile .arc { position: absolute; inset: 0; width: 76px; height: 76px; transform: rotate(-90deg); fill: none }
.tile .arc circle { fill: none; stroke: #e6e9ef; stroke-width: 4 }
.tile .arc .v { stroke: var(--amber); stroke-linecap: round }
.tile .anillo.done .arc .v { stroke: var(--navy) }
.tile .anillo > svg:not(.arc) { width: 30px; height: 30px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tile .paso { font-style: normal; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.tile span { color: var(--navy); font-size: 15px; font-weight: 500; max-width: 210px; line-height: 1.3 }  /* nombre completo del curso (usuario, 23-10-2026) */
.tile small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em }
.tile small.dur { font: 400 12.5px/1.3 var(--font); letter-spacing: 0; margin-top: -2px }  /* duración bajo cada anillo (usuario, 23-10-2026) */
@media (max-width: 700px) {
  .tiles .fila.ruta { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 16px }
  .tiles .fila.ruta::before { display: none }
  .tiles .fila { flex-wrap: wrap; gap: 16px 0 }
  .tiles .fila:not(.ruta) .tile { width: 50% }
  .tiles .fila.comp { gap: 16px 0 }
}

/* ---- contenido ---- */
main { padding-block: 64px 88px }
.page { display: flex; flex-direction: column; gap: 72px }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative }
.route::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 23px; height: 1px; background: var(--navy); opacity: .35 }
.route li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-inline: 10px }
.route .node { width: 46px; height: 46px; border-radius: 50%; background: var(--white); border: 1px solid var(--navy); display: grid; place-items: center; font: 300 20px/1 var(--font); color: var(--navy); position: relative; z-index: 1; flex: none }
.route .node.done { background: var(--navy); color: #ffffff }
.route .node.now { border: 2px solid var(--amber); box-shadow: 0 0 0 6px rgba(240, 165, 0, .18) }
.route b { font-weight: 600; color: var(--navy); line-height: 1.3 }
.route small { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px }
@media (max-width: 700px) {
  .route { grid-template-columns: 1fr; gap: 20px }
  .route::before { left: 23px; right: auto; top: 23px; bottom: 23px; width: 1px; height: auto }
  .route li { flex-direction: row; text-align: left; gap: 18px; padding: 0 }
}

.courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px }
@media (max-width: 760px) { .courses { grid-template-columns: 1fr } }
.card { background: var(--white); border: 0; border-top: 3px solid var(--fc); border-radius: 0; padding: 28px 30px 24px; text-align: left; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: box-shadow .2s ease }
.card:hover { box-shadow: 0 14px 30px -18px rgba(0, 53, 117, .45) }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.card h3 { font: 600 24px/1.2 var(--font); color: var(--navy) }
.card p { margin: 0; color: var(--muted); font-size: 15px }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted) }
.facts span::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--blue); margin-right: 8px; vertical-align: 2px }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line) }
.card .more { color: var(--blue); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }
.bar { flex: 1; height: 4px; background: #e6e8ec; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }
.pct { font: 500 13px/1 var(--mono); color: var(--navy); font-variant-numeric: tabular-nums }
.code { font: 600 11.5px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }
.code i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fc); margin-right: 8px; vertical-align: 0 }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; background: #eceef2; color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--ok-bg); color: var(--ok) }
.pill.go { background: var(--warn-bg); color: var(--warn) }
.banner { background: var(--warn-bg); color: var(--ink); padding: 12px 16px; font-size: 14.5px; margin: 0; border-left: 3px solid var(--amber) }

/* ---- curso ---- */
.crumb { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; align-self: start }
.course-hero { background: var(--white); border-top: 3px solid var(--fc); padding: 32px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 36px; align-items: end }
@media (max-width: 640px) { .course-hero { grid-template-columns: 1fr } }
.course-hero h1 { font: 200 clamp(32px, 4.6vw, 46px)/1.08 var(--font); color: var(--navy); margin: 12px 0 14px }
.course-hero .bigpct { text-align: right; display: flex; flex-direction: column; align-items: end; gap: 8px }
.course-hero .bigpct b { font: 200 56px/1 var(--font); color: var(--navy); font-variant-numeric: tabular-nums }
@media (max-width: 640px) { .course-hero .bigpct { align-items: start; text-align: left } }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr } }
.toc { background: var(--white); padding: 14px 0; display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 90px) }
@media (max-width: 860px) { .toc { position: static } }
.toc .eyebrow { padding: 4px 20px 10px }
.toc button { border: 0; background: none; text-align: left; padding: 12px 20px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent }
.toc button:hover { background: #f7f8fa }
.toc button[aria-current="true"] { border-left-color: var(--amber); background: #f7f8fa; color: var(--navy); font-weight: 600 }
.toc button small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); margin-top: 3px }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #b9c0cc; display: grid; place-items: center; font: 500 11px/1 var(--mono); color: var(--muted) }
.dot.done { background: var(--navy); border-color: var(--navy); color: #ffffff }
.dot.cur { border-color: var(--amber); color: var(--navy) }
.reader { background: var(--white); padding: clamp(24px, 4vw, 48px); min-width: 0 }
.reader h2 { font: 300 34px/1.15 var(--font); color: var(--navy); margin: 10px 0 24px }
.body { max-width: 68ch; font-size: 17px }
.body p, .body ul, .body ol { margin: 0 0 16px }
.body li { margin-bottom: 8px }
.body li::marker { color: var(--blue); font-weight: 600 }
.body strong { font-weight: 600; color: var(--navy) }
.spec { overflow-x: auto; margin: 6px 0 22px }
.spec table { border-collapse: collapse; font-size: 15px; width: 100%; min-width: 440px }
.spec th, .spec td { padding: 11px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line) }
.spec th { background: var(--navy); color: #ffffff; font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .1em }
.spec tr:nth-child(odd) td { background: #f7f8fa }
.spec td.n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy) }
.tip { background: var(--warn-bg); padding: 14px 18px; margin: 0 0 18px; font-size: 15.5px; border-left: 3px solid var(--amber) }
.tip::before { content: "Importante"; display: block; font: 700 11px/1.4 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--warn); margin-bottom: 2px }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line) }
.btn { border: 1px solid var(--navy); background: var(--white); color: var(--navy); padding: 12px 20px; border-radius: 2px; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase }
.btn:hover { background: #f2f5fa }
.btn.primary { background: var(--navy); color: #ffffff }
.btn.primary:hover { background: #00428f }

/* ---- evaluación ---- */
.q { border: 1px solid var(--line); padding: 18px 20px; margin: 0 0 14px }
.q legend { font-weight: 600; padding: 0 6px; font-size: 17px; color: var(--navy) }
.q label { display: flex; gap: 12px; align-items: flex-start; padding: 8px; cursor: pointer }
.q label:hover { background: #f7f8fa }
.q label input { margin-top: 5px; accent-color: var(--navy) }
.q.right { border-color: var(--ok); border-left: 3px solid var(--ok) }
.q.wrong { border-color: var(--amber); border-left: 3px solid var(--amber) }
.q .why { font-size: 14px; color: var(--muted); margin: 8px 8px 0 }
.result { padding: 16px 20px; margin: 0 0 20px; font-weight: 600; border-left: 3px solid }
.result.ok { background: var(--ok-bg); color: var(--ok) }

/* ---- ingreso ---- */

.login .card { position: relative; width: min(420px, 100%); background: rgba(0, 34, 77, .55); border: 1px solid rgba(255, 255, 255, .18); border-top: 3px solid var(--amber); padding: 34px 30px 30px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px) }
.login h1 { font: 200 34px/1.1 var(--font); margin: 12px 0 8px }
.login h1 b { font-weight: 700 }

.table button.reset { border: 1px solid var(--line); background: var(--white); color: var(--navy); padding: 6px 10px; border-radius: 2px; font: 600 11px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }

.ed-cfg label.chk input { width: 18px; height: 18px; accent-color: var(--navy) }
.ed input[type="number"], .ed input[type="text"], .ed textarea { width: 100%; font: 400 16px/1.4 var(--font); padding: 10px 12px; border: 1px solid #b9c0cc; border-radius: 2px; color: var(--ink); background: var(--white) }

/* Pestaña Usuarios (solo admin) */
.ed select, .us-tabla select, .us-tabla input[type="text"] { width: 100%; font: 400 16px/1.4 var(--font); padding: 10px 12px; border: 1px solid #b9c0cc; border-radius: 2px; color: var(--ink); background: var(--white) }

/* Pestaña Usuarios: nota de la clave inicial, acciones en la fila y ventana propia (26-10-2026). */
.us-nota { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--white); border-left: 3px solid var(--amber); padding: 18px 22px }

.us-nota-txt code, .us-modal code { font: 600 16px/1 var(--mono); letter-spacing: .06em; background: #f2f4f8; padding: 4px 8px }

.us-nota-acc, .us-modal-acc { display: flex; gap: 8px; flex-wrap: wrap }
.us-nota-acc .btn { padding: 8px 14px; font-size: 12px }
.us-ov { position: fixed; inset: 0; z-index: 60; background: rgba(0, 20, 50, .45); display: grid; place-items: center; padding: 16px }
/* Glosario: botón fijo en los cursos que tienen una lección id "glosario"; abre una ventana con buscador. */
.gl-btn { position: fixed; right: 18px; bottom: 18px; z-index: 50; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 2px; background: var(--navy); color: #fff; padding: 12px 18px; font: 600 13px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 12px 28px -10px rgba(0, 20, 50, .6); cursor: pointer }

.gl-modal { width: min(880px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--white); border-top: 3px solid var(--amber); padding: 22px clamp(16px, 4vw, 28px) 18px; box-shadow: 0 30px 60px -24px rgba(0, 20, 50, .55) }
.gl-cab { display: flex; align-items: start; justify-content: space-between; gap: 12px }
.gl-cab h2 { font: 300 26px/1.15 var(--font); color: var(--navy); margin: 6px 0 12px }
.gl-buscar { font: 500 16px/1.3 var(--font); padding: 10px 12px; border: 1px solid #b9c0cc; border-radius: 2px; margin-bottom: 12px }
.gl-cuerpo { overflow: auto; min-height: 0; max-width: none }
.gl-vacio { color: var(--muted); margin: 8px 0 0 }
.gl-tabla { width: 100%; border-collapse: collapse; font-size: 14.5px }
.gl-tabla th, .gl-tabla td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line) }
.gl-tabla th { position: sticky; top: 0; background: #f2f4f8; color: var(--navy); font-weight: 700 }
.gl-tabla td:first-child { color: var(--navy); font-weight: 700 }
.gl-tabla tr[hidden] { display: none }
.gl-filtro { display: flex; gap: 6px; margin-bottom: 10px }
.gl-filtro button { border: 1px solid #b9c0cc; background: var(--white); color: var(--navy); padding: 7px 12px; font: 600 13px/1 var(--font); border-radius: 2px; cursor: pointer }
.gl-filtro button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff }
@media (max-width: 600px) {
  .gl-btn { right: 12px; bottom: 12px; padding: 11px 14px }
  .gl-tabla tr:has(th) { display: none }
  .gl-tabla tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line) }
  .gl-tabla tr[hidden] { display: none }
  .gl-tabla td { display: block; border: 0; padding: 2px 0 }
  .gl-tabla td:nth-child(3)::before { content: "Ejemplo: "; font-weight: 600; color: var(--muted) }
  .gl-tabla td:nth-child(4)::before { content: "Curso: "; font-weight: 600; color: var(--muted) }
}
.us-modal { width: min(520px, 100%); background: var(--white); border-top: 3px solid var(--amber); padding: 26px clamp(18px, 4vw, 30px) 22px; box-shadow: 0 30px 60px -24px rgba(0, 20, 50, .55) }
.us-modal h2 { font: 300 26px/1.15 var(--font); color: var(--navy); margin: 6px 0 12px }
.us-modal h2 b { font-weight: 700 }

.us-modal-err { color: #b3261e !important; font-size: 14px !important }
.us-modal-acc { justify-content: flex-end; margin-top: 6px }
.us-msg { white-space: pre-wrap; font: 400 14.5px/1.5 var(--font); background: #f4f6fa; border-left: 3px solid #25d366; padding: 12px 14px; margin: 0 0 16px; color: var(--ink) }
.edq .hint { font-size: 13px; color: var(--muted); margin: 12px 0 2px }
.edq .alt { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; gap: 10px; align-items: center; margin-top: 8px }
.edq .alt input[type="radio"] { width: 18px; height: 18px; accent-color: var(--navy) }
.mini-btn { border: 1px solid var(--line); background: var(--white); width: 34px; height: 34px; border-radius: 2px; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 }
.mini-btn:hover { border-color: var(--navy); color: var(--navy) }
button.link { border: 0; background: none; padding: 0; color: var(--navy); font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: #b9c0cc; text-underline-offset: 3px }
button.link:hover { text-decoration-color: var(--amber) }

.drive { background: var(--white); border-top: 3px solid var(--navy) }
.drive iframe { display: block; width: 100%; height: min(78vh, 760px); min-height: 480px; border: 0 }
/* Esquemas de las lecciones (SVG en linea): fondo blanco, se adaptan al ancho */
.esquema { background: var(--white); border: 1px solid var(--line); padding: 14px 16px 10px; margin: 0 0 18px }
.esquema svg { display: block; width: 100%; height: auto; font-family: var(--font) }

.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0 }
.err-titulo { font: 700 11px/1.4 var(--font); letter-spacing: .12em; text-transform: uppercase; color: #b3261e; margin: 22px 0 6px }

.pts-btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 22px }

.doc .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block }
.doc .thumb .folder { font-size: 54px }
.doc .info { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1 }

.doc .info small { margin-top: auto; font: 500 11.5px/1.3 var(--mono); color: var(--muted) }
a.btn { display: inline-block; text-decoration: none }

/* ---- easter eggs ---- */
.hero.burst .fibers .strand path { stroke: rgba(160, 195, 240, .32) }

body.festivo .hero .fibers .p4 { stroke: var(--c4) } body.festivo .hero .fibers .p5 { stroke: var(--c5) }
body.festivo .hero .fibers .p6 { stroke: var(--c6) }
.egg-toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: opacity .35s ease, transform .35s ease;
  background: #00224d; color: #ffffff; border-left: 3px solid var(--amber); padding: 14px 20px; box-shadow: 0 18px 40px -16px rgba(0, 20, 50, .6); max-width: min(460px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 2px }

.egg-toast b { font-size: 16px }
.egg-toast span { color: #c9d7ee; font-size: 14.5px; font-weight: 300 }
.egg-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0, 20, 50, .55); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .3s ease }
.egg-overlay.on { opacity: 1 }
.egg-card { position: relative; width: min(560px, 100%); background: #00224d; color: #ffffff; border-top: 3px solid var(--amber); padding: 30px clamp(18px, 4vw, 34px) 26px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6) }
.egg-card h2 { font: 200 30px/1.1 var(--font); margin: 10px 0 16px }
.egg-card h2 b { font-weight: 700 }
.egg-card .eyebrow { color: #9fc2f0 }
.egg-card p { margin: 0 0 6px; color: #c9d7ee }
.egg-card .jv { color: #ffffff; letter-spacing: .06em }
.egg-card .lema { font: 300 13px/1.4 var(--font); letter-spacing: .16em; text-transform: uppercase; color: #9fc2f0 }
.egg-card .meta { font: 500 12px/1.4 var(--mono); color: #7f9cc4; margin-top: 14px }
.egg-close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: #9fc2f0; font-size: 26px; line-height: 1; padding: 4px 8px }
.egg-close:hover { color: #ffffff }
.egg-svg { width: 100%; height: auto; display: block; margin: 4px 0 14px }
.egg-svg .eje { stroke: rgba(255, 255, 255, .3); stroke-width: 1; fill: none }
.egg-svg .traza { stroke: var(--amber); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: trazar 2.6s ease-out forwards }
.egg-svg text { fill: #9fc2f0; font: 500 10px var(--mono) }

@media (prefers-reduced-motion: reduce) { .egg-svg .traza { animation: none; stroke-dashoffset: 0 } .egg-svg .ev { animation: none; opacity: 1 } .egg-svg .run { animation: none } }

/* ---- pie ---- */
footer.foot { background: var(--navy); color: #c9d7ee; font-size: 14px }

  .bar i, .mini i { transition: width .5s ease }

}

    { id: "kit", title: "Tu kit y la revisión de herramientas", min: 8, html: `
      <p>En terreno cada técnico cuenta con el formulario Cobra Revisión de herramientas de fibra. El formulario contempla ocho elementos: Power Meter, cortadora, bolso cortador, deschaquetadora, linterna óptica, equipo Senter, alcohol isopropílico y paños limpiadores. La revisión de cada elemento se registra marcando OK o NOK y observaciones.</p>

      <p>La Academia establece como indicación general que las normas de cuidado deberían aplicar para todas las herramientas.</p>

        <li>Las herramientas deben mantenerse limpias y secas para eliminar la corrosión superficial.</li>

    { id: "peladoras", title: "Peladora, deschaquetadora y tijera", min: 8, html: `
      <p>La peladora está diseñada para eliminar de forma rápida y segura las protecciones primarias. Garantiza en un solo movimiento la retirada completa del revestimiento de una fibra tanto ajustada de 900 micras como holgada de 250 micras sin dañar la fibra óptica.</p>

      </ul>
      <p>La deschaquetadora es una herramienta específica para retirar la chaqueta del cable sin dañar la fibra. Se utiliza para sacar la cubierta del cable de fibra óptica interior en especial para armar el conector de campo. Su guía peladora y cortadora asegura el corte correcto del filamento según el estándar y permite sacar la pintura del filamento.</p>

    { id: "cortadora", title: "Cortadora de precisión (Cleaver)", min: 10, html: `
      <p>La cortadora es una herramienta de alta precisión diseñada para trabajar en terreno en el corte de fibra óptica. Dispone de una cuchilla giratoria la cual realiza cortes de alta precisión con ángulo menor a 0,5 grados. Se prepara un tramo de cable drop de aproximadamente 30 a 40 centímetros con separación previa de chaqueta de 3 a 5 centímetros. El proceso de preparación incluye el pelado, la limpieza y el corte utilizando la plantilla de corte.</p>
      <ul>
        <li>La limpieza de los apoyos y de la cuchilla debe efectuarse antes de cada uso en terreno (ejemplo de fabricante: Fujikura).</li>
        <li>Limpiar las almohadillas de sujeción con un hisopo de algodón humedecido en alcohol.</li>
        <li>Limpiar el yunque con un hisopo de algodón humedecido en alcohol.</li>
        <li>Limpiar la superficie de la cuchilla con un hisopo de algodón humedecido en alcohol.</li>
        <li>Por advertencia del fabricante, no tocar el filo de la cuchilla.</li>
        <li>Limpiar la cuchilla de corte desde el lateral.</li>
      </ul>
      <p>Como ejemplo de fabricante (Fujikura CT50), la vida de la cuchilla es de 60000 fibras (1250 fibras en tres alturas a lo largo de 16 posiciones). La vida útil de la cuchilla varía según las condiciones ambientales, el método de operación y el tipo de fibra cortada.</p>

      <div class="tip">Se permiten hasta tres intentos consecutivos para obtener un corte correcto. Si tras el tercer intento no se logra resultado adecuado, la cortadora deberá ser declarada defectuosa procediendo a su calibración o reemplazo según corresponda.</div>

    { id: "fusionadora", title: "Fusionadora de fibra óptica", min: 10, html: `

        <li>Usar un hisopo para cada lente y no reutilizarlos.</li>

      ${erroresSeg(["Reutilizar el mismo hisopo para limpiar distintas lentes", "Limpiar las lentes sin quitar previamente los electrodos", "Golpear piezas o doblar las puntas de los electrodos al manipularlos"])}` },
    { id: "instrumentos", title: "Instrumentos ópticos y limpieza", min: 9, html: `
      <p>El equipo Senter es un PDA inteligente de mano especialmente diseñado para la operación y el mantenimiento de técnicos en campo de telecomunicaciones. Para el correcto funcionamiento del dispositivo es necesario realizar un mantenimiento periódico para asegurar la calidad de las mediciones. Es importante mantener limpios los jumpers que se utilizan para realizar las mediciones.</p>
      <p>Los lápices de limpieza de 2,5mm para conectores SC/APC limpian las caras eliminando el polvo, el aceite y otros desechos. Basta con aplicar el limpiador directamente en el conector de fibra óptica y presionar (oneclick).</p>
      <p>Se debe contar con una botella con alcohol isopropílico para limpiar adecuadamente los componentes de fibra. El papel de limpieza para fibra limpia el filamento sin dejar residuos ni dañar la superficie. Su principal característica es que no produce estática al roce. Se utiliza alcohol isopropílico para la limpieza correcta de conectores y guías de fibra óptica.</p>
      <div class="tip">Importante: los utensilios de limpieza no son reutilizables y deben ser descartados tras un único uso.</div>

      <div class="video"><iframe src="https://player.vimeo.com/video/1237042475?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="Video: fundamentos GPON" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <p>Después revisa el manual, que resume las ocho lecciones del curso:</p>
      <p><a class="btn primary" href="https://drive.google.com/file/d/1vXKwL55-GMjpLQXi9Akb1qwIJFZhMhra/view" target="_blank" rel="noopener">Ver manual de fundamentos GPON</a></p>
      <div class="tip">El manual se abre en una pestaña nueva. Cuando termines el video y el manual, presiona <strong>Completar y seguir</strong>.</div>` },
    { id: "fibra", title: "La fibra óptica", min: 8, html: `
      <p>La fibra óptica es un hilo muy fino de vidrio o plástico transparente por el que viajan <strong>pulsos de luz</strong> que representan los datos. La luz queda confinada y avanza rebotando en su interior. La fuente de luz es un láser o un diodo LED.</p>
      <figure class="esquema"><svg viewBox="0 0 640 230" role="img" aria-label="Corte de la fibra óptica y recorrido de la luz por el núcleo">
        <circle cx="105" cy="100" r="84" fill="#e9edf3" stroke="#9aa6b8"/>
        <circle cx="105" cy="100" r="58" fill="#cfe0f5" stroke="#3c62ac"/>
        <circle cx="105" cy="100" r="13" fill="#f0a500" stroke="#b07800"/>
        <text x="105" y="210" text-anchor="middle" font-size="15" fill="#62646e">Corte de la fibra</text>
        <rect x="240" y="55" width="380" height="90" fill="#e9edf3" stroke="#9aa6b8"/>
        <rect x="240" y="70" width="380" height="60" fill="#cfe0f5"/>
        <rect x="240" y="90" width="380" height="20" fill="#fde7b0"/>
        <polyline points="245,100 300,92 355,108 410,92 465,108 520,92 575,108 612,100" fill="none" stroke="#e08a00" stroke-width="2.5"/>
        <polygon points="612,94 624,100 612,106" fill="#e08a00"/>
        <text x="430" y="40" text-anchor="middle" font-size="15" fill="#62646e">La luz avanza rebotando dentro del núcleo</text>
        <rect x="240" y="168" width="14" height="14" fill="#f0a500"/><text x="260" y="180" font-size="15" fill="#334155">Núcleo · 9 µm · por aquí viaja la luz</text>
        <rect x="240" y="190" width="14" height="14" fill="#cfe0f5" stroke="#3c62ac"/><text x="260" y="202" font-size="15" fill="#334155">Revestimiento · 125 µm · hace rebotar la luz</text>
        <rect x="240" y="212" width="14" height="14" fill="#e9edf3" stroke="#9aa6b8"/><text x="260" y="224" font-size="15" fill="#334155">Cubierta · protege las capas internas</text>
      </svg><figcaption>Fibra monomodo: el núcleo es mucho más delgado que el revestimiento.</figcaption></figure>
      <div class="spec"><table><tr><th>Capa</th><th>Función</th></tr>
      <tr><td>Núcleo (core)</td><td>Parte interior de sílice. Por aquí viaja la luz</td></tr>
      <tr><td>Revestimiento (cladding)</td><td>Envuelve al núcleo. Tiene un índice de refracción menor y por eso la luz rebota</td></tr>
      <tr><td>Cubierta (coating)</td><td>Plástico que protege las capas internas</td></tr></table></div>
      <p><strong>Por qué la luz no se escapa:</strong> gracias al principio de <strong>reflexión interna total</strong>. El revestimiento tiene un índice de refracción menor que el núcleo, lo que hace que la luz que llega con poco ángulo se refleje completamente hacia el interior. Si la fibra se dobla más allá de su radio permitido, la luz cambia de ángulo y se escapa hacia el exterior, generando <strong>atenuación por curvatura</strong>.</p>
      <ul>
        <li><strong>Monomodo (SM):</strong> núcleo de 9 µm y revestimiento de 125 µm (9/125 µm). La luz sigue un único camino o modo, con atenuación muy baja y gran ancho de banda. <strong>Es la fibra utilizada en redes FTTx.</strong></li>
        <li><strong>Multimodo (MM):</strong> núcleo más amplio (50 o 62,5 µm). La luz viaja por múltiples caminos y el pulso se ensancha con la distancia, limitando su alcance a redes de área local (LAN).</li>
      </ul>
      <div class="spec"><table><tr><th>Ventana</th><th>Longitud de onda</th><th>Atenuación típica</th><th>Uso en GPON</th></tr>
      <tr><td>Primera</td><td class="n">850 nm</td><td class="n">1,8 dB/km</td><td>Redes locales (multimodo)</td></tr>
      <tr><td>Segunda</td><td class="n">1310 nm</td><td class="n">0,33 dB/km</td><td>Subida GPON (cliente → OLT)</td></tr>
      <tr><td>Tercera</td><td class="n">1550 nm</td><td class="n">0,2 dB/km</td><td>Bajada GPON (en 1490 nm)</td></tr></table></div>
      <div class="tip">Un metro de cable coaxial atenúa lo mismo que un kilómetro de fibra óptica. Aun así, una curva cerrada, un conector sucio o una mala fusión agregan pérdidas que afectan directamente la velocidad y estabilidad del servicio.</div>` },
    { id: "cables", title: "Cables, conectores y curvatura", min: 7, html: `
      <p>La fibra por sí sola es muy fina y frágil. El cable es la estructura que la protege de la tracción, la humedad, la radiación ultravioleta y el aplastamiento.</p>
      <div class="spec"><table><tr><th>Cable</th><th>Características y aplicación</th></tr>
      <tr><td>Acometida exterior (drop)</td><td>Una fibra monomodo G.657 con cubierta LSZH (retardante a la llama y libre de halógenos) resistente a UV. Lleva varillas de tracción y mensajero de acero autosoportante para vanos entre postes y fachadas</td></tr>
      <tr><td>Acometida interior</td><td>Igual al drop exterior pero sin mensajero de acero. Cubierta flexible blanca o marfil de baja fricción para tender en ductos y muros interiores</td></tr>
      <tr><td>Cable de distribución aérea</td><td>Estructura holgada con mensajero de acero para soportar vanos largos en la postación pública</td></tr></table></div>
      <p>Los cables de acceso cumplen la norma <strong>ITU-T G.657</strong> (clase A), que optimiza la fibra para tolerar radios de curvatura muy cerrados sin fugas de señal.</p>
      <div class="tip">La norma exige un radio de curvatura mínimo de <strong>2 cm (20 mm)</strong> para cables G.657, tanto en exteriores como en interiores. Una curvatura más cerrada provoca fuga de luz por macrocurvatura y aumenta la atenuación de la señal.</div>
      <p><strong>Conectores y pulido:</strong> en toda la red FTTH se utilizan conectores <strong>SC/APC</strong>, identificados siempre por su color <strong>verde</strong>.</p>
      <div class="spec"><table><tr><th>Pulido</th><th>Color</th><th>Forma de la punta</th><th>Pérdida de retorno</th></tr>
      <tr><td>PC / UPC</td><td>Azul</td><td>Plano o redondeado</td><td class="n">30 a 50 dB</td></tr>
      <tr><td>APC</td><td>Verde</td><td>Inclinado en ángulo de 8°</td><td class="n">sobre 60 dB</td></tr></table></div>
      <figure class="esquema"><svg viewBox="0 0 640 212" role="img" aria-label="Pulido PC plano y pulido APC inclinado 8 grados">
        <text x="160" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#003575">PC · plano</text>
        <rect x="30" y="70" width="190" height="60" fill="#cfe0f5" stroke="#3c62ac"/>
        <rect x="30" y="92" width="190" height="16" fill="#fde7b0"/>
        <line x1="220" y1="60" x2="220" y2="140" stroke="#003575" stroke-width="3"/>
        <line x1="45" y1="96" x2="205" y2="96" stroke="#e08a00" stroke-width="2.5"/><polygon points="205,91 216,96 205,101" fill="#e08a00"/>
        <line x1="210" y1="104" x2="60" y2="104" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><polygon points="60,99 49,104 60,109" fill="#b3261e"/>
        <text x="160" y="180" text-anchor="middle" font-size="15" fill="#334155">El reflejo vuelve por el núcleo</text>
        <text x="160" y="201" text-anchor="middle" font-size="15" fill="#62646e">Pérdida de retorno: 30 a 50 dB</text>
        <text x="480" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#2c8a45">APC · inclinado 8° (verde)</text>
        <polygon points="350,70 548,70 532,130 350,130" fill="#cfe0f5" stroke="#3c62ac"/>
        <polygon points="350,92 542,92 538,108 350,108" fill="#fde7b0"/>
        <line x1="552" y1="58" x2="528" y2="142" stroke="#2c8a45" stroke-width="3"/>
        <line x1="365" y1="100" x2="525" y2="100" stroke="#e08a00" stroke-width="2.5"/><polygon points="525,95 536,100 525,105" fill="#e08a00"/>
        <line x1="530" y1="104" x2="488" y2="136" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><polygon points="483,129 478,144 492,140" fill="#b3261e"/>
        <text x="480" y="180" text-anchor="middle" font-size="15" fill="#334155">El reflejo se desvía y sale del núcleo</text>
        <text x="480" y="201" text-anchor="middle" font-size="15" fill="#62646e">Pérdida de retorno: sobre 60 dB (mejor)</text>
      </svg><figcaption>Línea naranja: la luz que viaja. Línea roja: el reflejo. En APC el reflejo no vuelve hacia el equipo.</figcaption></figure>
      <ul>
        <li>La <strong>pérdida de retorno (reflectancia)</strong> mide cuánta luz se refleja hacia la fuente emisora. Mientras más alto el valor en dB, mejor es la calidad de la señal.</li>
        <li>El pulido <strong>APC a 8°</strong> desvía el haz reflejado hacia el revestimiento para disiparlo fuera del núcleo. Solo se utiliza en fibra monomodo.</li>
        <li><strong>Nunca unas un conector APC (verde) con un conector PC/UPC (azul):</strong> sus caras geométricas no hacen contacto pleno, dañan la férula de cerámica y provocan una pérdida óptica severa.</li>
      </ul>` },
    { id: "gpon", title: "Redes FTTx y GPON", min: 9, html: `
      <p>La sigla <strong>FTTx</strong> agrupa las arquitecturas de red que llevan telecomunicaciones por fibra. La última letra indica el punto exacto hasta donde llega el hilo óptico:</p>
      <div class="spec"><table><tr><th>Arquitectura</th><th>La fibra llega hasta</th><th>Tramo final hacia el usuario</th></tr>
      <tr><td>FTTN (Node)</td><td>El nodo primario</td><td>Cable coaxial (red HFC)</td></tr>
      <tr><td>FTTC (Curb)</td><td>El armario o cámara</td><td>Par de cobre (VDSL)</td></tr>
      <tr><td>FTTB (Building)</td><td>El edificio</td><td>Coaxial, cobre o red interior</td></tr>
      <tr><td>FTTA (Apartment)</td><td>Cada departamento</td><td>Fibra óptica interior</td></tr>
      <tr><td>FTTH (Home)</td><td>El hogar / domicilio</td><td>Fibra óptica (drop directo)</td></tr>
      <tr><td>FTTR (Room)</td><td>Cada habitación</td><td>Microfibra óptica interior</td></tr></table></div>
      <p><strong>GPON</strong> (Gigabit Passive Optical Network, estándar <strong>ITU-T G.984</strong>) es una red de acceso punto a multipunto. Es <strong>pasiva</strong> porque en toda la red exterior entre la central y el domicilio solo hay cables y splitters ópticos, sin repetidores ni amplificadores energizados. Su alcance físico máximo es de <strong>20 km</strong>.</p>
      <div class="spec"><table><tr><th>Parámetro GPON</th><th>Sentido de bajada (Downstream)</th><th>Sentido de subida (Upstream)</th></tr>
      <tr><td>Longitud de onda central</td><td class="n">1490 nm</td><td class="n">1310 nm</td></tr>
      <tr><td>Banda operativa</td><td class="n">1480 – 1500 nm</td><td class="n">1290 – 1330 nm</td></tr>
      <tr><td>Tasa de línea</td><td class="n">2,488 Gbps (~2,5 Gbps)</td><td class="n">1,244 Gbps (~1,25 Gbps)</td></tr>
      <tr><td>Multiplexación</td><td>TDM (difusión con ranuras temporales)</td><td>TDMA (turnos asignados por la OLT)</td></tr>
      <tr><td>Servicios transportados</td><td>Internet y televisión (IPTV)</td><td>Datos y peticiones del cliente</td></tr></table></div>
      <figure class="esquema"><svg viewBox="0 0 640 210" role="img" aria-label="Bajada en 1490 nanómetros y subida en 1310 nanómetros por la misma fibra">
        <rect x="20" y="75" width="90" height="56" fill="#003575"/><text x="65" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">OLT</text>
        <line x1="110" y1="103" x2="330" y2="103" stroke="#2c8a45" stroke-width="4"/>
        <polygon points="330,103 370,78 370,128" fill="#e9edf3" stroke="#62646e"/><text x="350" y="176" text-anchor="middle" font-size="14" fill="#62646e">Splitter</text>
        <line x1="370" y1="86" x2="500" y2="40" stroke="#2c8a45" stroke-width="3"/><line x1="370" y1="103" x2="500" y2="103" stroke="#2c8a45" stroke-width="3"/><line x1="370" y1="120" x2="500" y2="166" stroke="#2c8a45" stroke-width="3"/>
        <rect x="500" y="22" width="110" height="36" fill="#ffffff" stroke="#003575"/><text x="555" y="45" text-anchor="middle" font-size="15" fill="#003575">HGU cliente 1</text>
        <rect x="500" y="85" width="110" height="36" fill="#ffffff" stroke="#003575"/><text x="555" y="108" text-anchor="middle" font-size="15" fill="#003575">HGU cliente 2</text>
        <rect x="500" y="148" width="110" height="36" fill="#ffffff" stroke="#003575"/><text x="555" y="171" text-anchor="middle" font-size="15" fill="#003575">HGU cliente 3</text>
        <line x1="130" y1="78" x2="300" y2="78" stroke="#e08a00" stroke-width="2.5"/><polygon points="300,73 312,78 300,83" fill="#e08a00"/>
        <text x="215" y="68" text-anchor="middle" font-size="15" fill="#334155">Bajada 1490 nm · internet y TV (TDM)</text>
        <line x1="312" y1="128" x2="142" y2="128" stroke="#3c62ac" stroke-width="2.5"/><polygon points="142,123 130,128 142,133" fill="#3c62ac"/>
        <text x="215" y="150" text-anchor="middle" font-size="15" fill="#334155">Subida 1310 nm · un turno por HGU (TDMA)</text>
      </svg><figcaption>Una sola fibra lleva las dos direcciones: cada una usa su propia longitud de onda.</figcaption></figure>
      <ul>
        <li><strong>Bajada (TDM):</strong> la OLT emite de forma continua para todas las ONT conectadas al puerto PON. Cada equipo descifra y toma solo las tramas dirigidas a él.</li>
        <li><strong>Subida (TDMA):</strong> todas las ONT comparten el mismo hilo de fibra hacia la central. La OLT gestiona dinámicamente las ventanas temporales para que cada equipo transmita en su turno exacto y sus señales no choquen.</li>
        <li><strong>Convivencia con XGS-PON:</strong> tecnología de 10 Gbps simétricos que opera sobre la misma fibra física sin interferir, utilizando longitudes de onda independientes (1577 nm bajada y 1270 nm subida).</li>
      </ul>
      <div class="tip">Seguridad en terreno: nunca mires de frente el extremo de una fibra óptica ni un puerto activo. La emisión láser es totalmente invisible y provoca quemaduras retinianas irreversibles.</div>` },
    { id: "elementos", title: "Elementos de la red", min: 8, html: `
      <p>La red de fibra se divide en tres segmentos principales: la <strong>oficina central</strong> (donde se origina el servicio), la <strong>red GPON de distribución</strong> (red exterior pasiva) y el <strong>domicilio del cliente</strong> (donde termina la fibra y se instalan los equipos).</p>
      <figure class="esquema"><svg viewBox="0 0 640 170" role="img" aria-label="Recorrido de la señal: OLT, ODF, splitter de primer nivel, CTO con splitter de segundo nivel, drop y HGU">
        <rect x="8" y="8" width="168" height="154" fill="#eef2f8"/><text x="92" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#003575">OFICINA CENTRAL</text>
        <rect x="184" y="8" width="296" height="154" fill="#eef6f0"/><text x="332" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#2c8a45">RED GPON (EXTERIOR)</text>
        <rect x="488" y="8" width="144" height="154" fill="#fdf6e6"/><text x="560" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#9a5b00">DOMICILIO</text>
        <rect x="20" y="70" width="64" height="44" fill="#003575"/><text x="52" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OLT</text>
        <rect x="104" y="70" width="60" height="44" fill="#ffffff" stroke="#003575"/><text x="134" y="97" text-anchor="middle" font-size="16" fill="#003575">ODF</text>
        <rect x="200" y="62" width="120" height="60" fill="#ffffff" stroke="#2c8a45"/><text x="260" y="88" text-anchor="middle" font-size="15" fill="#2c8a45">Splitter</text><text x="260" y="106" text-anchor="middle" font-size="14" fill="#62646e">1.er nivel</text>
        <rect x="346" y="62" width="120" height="60" fill="#ffffff" stroke="#2c8a45"/><text x="406" y="88" text-anchor="middle" font-size="15" fill="#2c8a45">CTO</text><text x="406" y="106" text-anchor="middle" font-size="14" fill="#62646e">splitter 2.º nivel</text>
        <rect x="520" y="70" width="84" height="44" fill="#ffffff" stroke="#9a5b00"/><text x="562" y="97" text-anchor="middle" font-size="16" fill="#9a5b00">HGU</text>
        <line x1="84" y1="92" x2="104" y2="92" stroke="#2c8a45" stroke-width="3"/><line x1="164" y1="92" x2="200" y2="92" stroke="#2c8a45" stroke-width="3"/><line x1="320" y1="92" x2="346" y2="92" stroke="#2c8a45" stroke-width="3"/><line x1="466" y1="92" x2="520" y2="92" stroke="#2c8a45" stroke-width="3"/>
        <text x="493" y="84" text-anchor="middle" font-size="13" fill="#62646e">drop</text>
        <text x="320" y="150" text-anchor="middle" font-size="14" fill="#62646e">En edificios (FTTA) la CTO se reemplaza por la CDOI, en el shaft</text>
      </svg><figcaption>Cada puerto PON de la OLT atiende hasta 64 clientes, repartidos por los dos niveles de splitter.</figcaption></figure>
      <div class="spec"><table><tr><th>Elemento</th><th>Ubicación</th><th>Función técnica</th></tr>
      <tr><td>OLT (Optical Line Terminal)</td><td>Oficina Central</td><td>Cabecera óptica. Conecta a los clientes con la red troncal IP y gestiona a todas las ONT. Cada puerto PON atiende hasta 64 clientes</td></tr>
      <tr><td>ODF (Optical Distribution Frame)</td><td>Oficina Central</td><td>Distribuidor óptico. Ordena y conecta los puertos PON con los cables troncales de salida</td></tr>
      <tr><td>Splitter óptico pasivo</td><td>Red exterior</td><td>Divisor pasivo: reparte una entrada óptica en varias salidas. En la red se organizan en <strong>dos niveles de 1:8</strong> (8 × 8 = 64 clientes)</td></tr>
      <tr><td>CTO (Caja Terminal Óptica)</td><td>Poste o fachada</td><td>Punto de acceso en FTTH. Alberga el splitter de 2.º nivel (lo habitual: 8 puertos de conexión a clientes)</td></tr>
      <tr><td>DGOI y CDOI</td><td>Edificios (FTTA)</td><td>La DGOI va en la sala RIT/subterráneo. La CDOI va en el shaft de corrientes débiles de cada piso (equivale a la CTO en edificios)</td></tr>
      <tr><td>PCE y CDPI</td><td>Edificios (Ley 20.808)</td><td>PCE (punto multiportadora) y CDPI (cajas en red desbalanceada de distribución vertical en shaft)</td></tr>
      <tr><td>HGU (Home Gateway Unit)</td><td>Domicilio</td><td>Equipo terminal del cliente. Integra ONT, router, switch Gigabit y WiFi 6 en un solo dispositivo</td></tr></table></div>
      <p><strong>Atenuación por división óptica (Splitters):</strong> el divisor reparte la potencia óptica de entrada entre todas sus salidas. Cada nivel agrega una pérdida física inevitable:</p>
      <div class="spec"><table><tr><th>Tipo de splitter</th><th>Atenuación teórica típica</th><th>Observación</th></tr>
      <tr><td class="n">1:2</td><td class="n">3,6 dB</td><td>Divide la potencia al 50 % en cada salida</td></tr>
      <tr><td class="n">1:4</td><td class="n">6,8 dB</td><td>Divide la potencia al 25 % en cada salida</td></tr>
      <tr><td class="n">1:8</td><td class="n">10,0 dB</td><td>Utilizado en el 1.er nivel (manga) y en el 2.º nivel (CTO/CDOI)</td></tr>
      <tr><td class="n">1:16</td><td class="n">13,0 dB</td><td>Utilizado en diseños de un solo nivel concentrado</td></tr>
      <tr><td class="n">1:32</td><td class="n">16,0 dB</td><td>Reparto en 32 salidas</td></tr>
      <tr><td class="n">1:64</td><td class="n">19,5 dB</td><td>División máxima estándar de un puerto PON</td></tr></table></div>` },
    { id: "potencia", title: "Potencia y pérdidas", min: 9, html: `
      <ul>
        <li><strong>dBm (decibel miliwatt):</strong> mide potencia absoluta real respecto a 1 mW (0 dBm = 1 mW). Los valores de recepción en fibra son negativos porque representan fracciones de miliwatt. −18 dBm es más potencia que −24 dBm.</li>
        <li><strong>dB (decibel):</strong> compara dos niveles de potencia. La atenuación de elementos pasivos (cables, conectores, fusiones, splitters) se expresa siempre en dB y resta señal.</li>
        <li>Regla práctica: una pérdida de 3 dB reduce la potencia óptica a la mitad. Una pérdida de 10 dB la reduce a la décima parte.</li>
      </ul>
      <div class="spec"><table><tr><th>Elemento de la red</th><th>Atenuación para el cálculo</th></tr>
      <tr><td>1 km de fibra óptica</td><td class="n">0,25 dB</td></tr>
      <tr><td>Conector óptico SC/APC</td><td class="n">0,25 dB</td></tr>
      <tr><td>Fusión por arco voltaico</td><td class="n">0,05 dB (máximo)</td></tr>
      <tr><td>Jumper óptico SC/APC a SC/APC</td><td class="n">1,00 dB</td></tr>
      <tr><td>Splitter 1:8 (cada nivel)</td><td class="n">10,0 dB</td></tr></table></div>
      <p><strong>Cálculo del presupuesto óptico:</strong> se parte de la potencia emitida por la OLT y se restan todas las atenuaciones acumuladas hasta el domicilio:</p>
      <div class="spec"><table><tr><th>Etapa del recorrido</th><th>Atenuación / Valor</th></tr>
      <tr><td>Potencia de salida en puerto PON de la OLT</td><td class="n">+3,0 dBm</td></tr>
      <tr><td>20 km de fibra óptica troncal y distribución (20 × 0,25 dB)</td><td class="n">−5,0 dB</td></tr>
      <tr><td>Dos splitters 1:8 en cascada (1.er nivel + CTO, 2 × 10 dB)</td><td class="n">−20,0 dB</td></tr>
      <tr><td>Pérdida por fusiones, conector y jumper de acometida</td><td class="n">−1,4 dB</td></tr>
      <tr><td>Total de pérdidas acumuladas en el enlace</td><td class="n">−26,4 dB</td></tr>
      <tr><td><strong>Potencia final recibida en el domicilio (HGU)</strong></td><td class="n"><strong>−23,4 dBm</strong></td></tr></table></div>
      <figure class="esquema"><svg viewBox="0 0 640 262" role="img" aria-label="La potencia baja de +3 dBm en la OLT a −23,4 dBm en la HGU, dentro del rango de −18 a −24 dBm">
        <rect x="60" y="168" width="560" height="36" fill="#e2f1e8"/>
        <text x="72" y="191" font-size="14" font-weight="700" fill="#1f7a45">Rango correcto: −18 a −24 dBm</text>

        <line x1="60" y1="30" x2="60" y2="240" stroke="#9aa6b8"/>
        <text x="54" y="46" text-anchor="end" font-size="13" fill="#62646e">+3</text><text x="54" y="76" text-anchor="end" font-size="13" fill="#62646e">−2</text><text x="54" y="172" text-anchor="end" font-size="13" fill="#62646e">−18</text><text x="54" y="208" text-anchor="end" font-size="13" fill="#62646e">−24</text>
        <polyline points="90,42 240,42 240,72 390,72 390,192 540,192 540,200" fill="none" stroke="#003575" stroke-width="3"/>
        <circle cx="90" cy="42" r="6" fill="#003575"/><circle cx="240" cy="72" r="6" fill="#003575"/><circle cx="390" cy="192" r="6" fill="#003575"/><circle cx="540" cy="200" r="7" fill="#f0a500" stroke="#003575" stroke-width="2"/>
        <text x="90" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#003575">OLT +3 dBm</text>
        <text x="250" y="58" font-size="14" fill="#334155">−5 dB · 20 km de fibra</text>
        <text x="400" y="118" font-size="14" fill="#334155">−20 dB · dos splitters 1:8</text>
        <text x="532" y="146" text-anchor="end" font-size="14" fill="#334155">−1,4 dB · fusiones,</text><text x="532" y="162" text-anchor="end" font-size="14" fill="#334155">conector y jumper</text>
        <text x="540" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#003575">HGU −23,4 dBm ✓</text>
      </svg><figcaption>El ejemplo de la tabla, paso a paso: los splitters son la mayor pérdida del recorrido.</figcaption></figure>
      <div class="tip">Rango de potencia obligatorio en terreno: la potencia medida con Power Meter en la CTO, en la CDOI y en la entrada óptica de la HGU debe estar estrictamente entre <strong>−18 y −24 dBm</strong> (en longitud de onda 1490 nm). Mediciones de −25 dBm hacia abajo (por ejemplo −26 o −27 dBm) están fuera de norma técnica: limpia los conectores con One-Click, verifica curvaturas cerradas y revisa fusiones antes de conectar el equipo.</div>` },
    { id: "herramientas", title: "Instrumentos y herramientas", min: 8, html: `
      <div class="spec"><table><tr><th>Instrumento de medición</th><th>Longitud de onda</th><th>Función técnica en terreno</th></tr>
      <tr><td>Power Meter óptico</td><td>1490 nm</td><td>Mide la potencia óptica en dBm. En el domicilio se mide la bajada calibrando siempre el equipo en 1490 nm</td></tr>
      <tr><td>VFL (Localizador visual / Linterna)</td><td>650 nm (luz roja visible)</td><td>Inyecta luz visible para identificar fibras, quiebres internos, curvas cerradas o pérdidas por macrocurvatura</td></tr>
      <tr><td>OTDR (Reflectómetro)</td><td>1310 / 1550 / 1625 nm</td><td>Emite pulsos ópticos para graficar el enlace completo, medir distancias exactas y ubicar empalmes, conectores y cortes</td></tr>
      <tr><td>Identificador de tráfico óptico</td><td>Detección por curvatura</td><td>Detecta presencia de tráfico, modulación y sentido de la luz sin necesidad de desconectar el hilo óptico</td></tr></table></div>
      <div class="spec"><table><tr><th>Herramienta de preparación</th><th>Función específica</th></tr>
      <tr><td>Deschaquetadora de drop</td><td>Corta y retira de forma calibrada la cubierta exterior del drop protegiendo el hilo interior</td></tr>
      <tr><td>Peladora de fibra (Stripper)</td><td>Muescas calibradas para retirar el recubrimiento de protección (coating de 250 µm) hasta la fibra desnuda de 125 µm</td></tr>
      <tr><td>Cortadora de precisión (Cleaver)</td><td>Realiza un corte perpendicular limpio a 90° exactos. Es la base indispensable para una fusión correcta o conector de campo</td></tr>
      <tr><td>Empalmadora de fusión</td><td>Alinea los núcleos y funde el vidrio mediante arco eléctrico (atenuación típica 0,05 dB)</td></tr>
      <tr><td>Pluma limpiadora One-Click</td><td>Limpia por rotación mecánica la férula cerámica de conectores y adaptadores SC/APC de 2,5 mm sin rayar</td></tr></table></div>
      <p><strong>Protocolo de preparación y empalme:</strong></p>
      <ol>
        <li>Si se va a realizar fusión por arco: <strong>insertar el manguito térmico (SMOUV) en la fibra antes de cualquier corte</strong>.</li>
        <li>Deschaquetar el cable drop y pelar el coating con la peladora de fibra dejando expuesta la sílice desnuda (125 µm).</li>
        <li>Limpiar la fibra desnuda con toallita libre de pelusa impregnada en alcohol isopropílico al 99,9 %.</li>
        <li>Efectuar el corte a 90° con la cortadora de precisión (cleaver).</li>
        <li><strong>Regla de oro:</strong> tras el corte, la punta de la fibra <strong>nunca se vuelve a limpiar ni a tocar</strong>. Se introduce directo a la empalmadora o al conector de campo.</li>
        <li>Realizar la fusión, desplazar el SMOUV sobre el empalme desnudo y hornear en la cámara térmica de la empalmadora.</li>
        <li>El <strong>conector de campo SC/APC</strong> mecánico permite armado sin fusionadora con pérdida máxima de 0,25 dB.</li>
      </ol>
      <div class="tip">Limpieza obligatoria: antes de medir con Power Meter o conectar a la CTO/HGU, aplica siempre la pluma One-Click sobre el conector. El polvo en la férula es la principal causa de atenuación artificial en terreno.</div>` },
    { id: "hgu", title: "HGU, SLID y WiFi 6", min: 8, html: `
      <p>La <strong>HGU</strong> (Home Gateway Unit, conocida como <em>Router Smart WiFi</em>) es el equipo donde termina la fibra óptica en el domicilio. Integra en una sola caja la ONT, el router de alta velocidad, switch Gigabit Ethernet y punto de acceso WiFi de última generación.</p>
      <p>El <strong>SLID</strong> (Subscriber Line Identifier) o GPON Password es un identificador asignado a la orden del cliente. Se ingresa en la configuración del HGU para que la red GPON autentique el equipo y le provisione automáticamente sus servicios.</p>
      <p><strong>Características técnicas del HGU Mitrastar GPT-2841GX2X2v10 WiFi 6:</strong></p>
      <div class="spec"><table><tr><th>Interfaz / Característica</th><th>Especificación técnica</th></tr>
      <tr><td>Estándar WLAN</td><td><strong>WiFi 6 (IEEE 802.11ax)</strong> con modulación avanzada <strong>1024-QAM</strong> y tecnología OFDMA / MU-MIMO</td></tr>
      <tr><td>Bandas y antenas</td><td>Doble banda concurrente 2,4 GHz (2×2) y 5 GHz (2×2) con antenas internas de alta ganancia (5 dBi)</td></tr>
      <tr><td>Nombre de red (SSID)</td><td><strong>SSID Único</strong> inteligente (Smart WiFi / Band Steering) para ambas frecuencias</td></tr>
      <tr><td>Puertos LAN</td><td>4 puertos Ethernet RJ-45 <strong>1000 Base-T (Gigabit)</strong> con auto-negociación</td></tr>
      <tr><td>Puerto de voz (VoIP)</td><td>1 puerto telefónico analógico FXS (conector RJ-11)</td></tr>
      <tr><td>Puerto óptico (WAN)</td><td>1 conector SC/APC protegido bajo tapa posterior con aliviador de tensión mecánico</td></tr>
      <tr><td>Alimentación</td><td>Adaptador 12 V / 1,5 A (consumo máximo 18 W) con botón ON/OFF</td></tr></table></div>
      <p><strong>Configuración técnica y accesos web en terreno:</strong></p>
      <ul>
        <li><strong>Nivel Usuario:</strong> <code>https://192.168.1.1</code> (gestión de clave WiFi y red local por el cliente).</li>
        <li><strong>Nivel Instalación:</strong> <code>https://192.168.1.1/Instalación</code> (acceso del técnico para ingresar el <strong>SLID</strong> y seleccionar modo <strong>GPON</strong>).</li>
        <li><strong>Nivel Soporte:</strong> <code>https://192.168.1.1:8000</code> (diagnóstico avanzado de plataforma y estado).</li>
      </ul>
      <p><strong>Paso a paso de instalación del HGU:</strong></p>
      <ol>
        <li>Conectar el adaptador 12 V / 1,5 A a la red eléctrica y encender el equipo con el botón ON/OFF posterior.</li>
        <li><strong>Ejecutar siempre un Factory Reset</strong> con clip en el botón reset antes de configurar para garantizar un aprovisionamiento limpio y sin residuos.</li>
        <li>Ingresar desde el navegador a <code>https://192.168.1.1/Instalación</code>, configurar la clave GPON (SLID) y definir modo de acceso GPON.</li>
        <li>Retirar la tapa protectora posterior, pasar el drop óptico por el aliviador de tensión y acoplar el conector SC/APC al puerto óptico.</li>
        <li>Esperar la sincronización óptica. La plataforma ACS provisionará automáticamente los servicios de Internet, IPTV y telefonía fija.</li>
      </ol>
      <div class="spec"><table><tr><th>Indicador LED</th><th>Estado</th><th>Significado técnico</th></tr>
      <tr><td rowspan="4"><strong>Internet</strong></td><td>Azul fijo</td><td>Conexión a Internet operativa y autenticada</td></tr>
      <tr><td>Azul intermitente</td><td>Estableciendo conexión y configurando IP</td></tr>
      <tr><td>Rojo intermitente</td><td>Fibra desconectada o potencia óptica fuera de rango (verificar curvas cerradas o conector sucio)</td></tr>
      <tr><td>Rojo fijo</td><td>Fallo crítico de hardware o corrupción de firmware</td></tr>
      <tr><td rowspan="3"><strong>WiFi / WiFi+ (WPS)</strong></td><td>Azul fijo</td><td>Interfaz inalámbrica (2,4 GHz o 5 GHz) activa y transmitiendo</td></tr>
      <tr><td>Azul intermitente</td><td>Ventana WPS abierta en espera de vinculación de dispositivos</td></tr>
      <tr><td>Apagado</td><td>Interfaz inalámbrica desactivada</td></tr>
      <tr><td rowspan="4"><strong>Teléfono (Voz)</strong></td><td>Azul fijo</td><td>Línea telefónica VoIP registrada y lista para llamadas</td></tr>
      <tr><td>Azul intermitente rápido</td><td>Registrando línea VoIP en la plataforma SIP</td></tr>
      <tr><td>Azul intermitente lento</td><td>Llamada telefónica en curso</td></tr>
      <tr><td>Rojo intermitente</td><td>Fallo de autenticación o registro de línea VoIP</td></tr></table></div>
      <ul>
        <li><strong>Ubicación del equipo:</strong> posición elevada y despejada en zona central del domicilio. Evitar cercanía con microondas, televisores, muebles metálicos, espejos, azulejos y elementos con agua.</li>
        <li><strong>Dispositivos IoT de 2,4 GHz:</strong> si un equipo inteligente del cliente no reconoce la red unificada con Band Steering, se puede desactivar momentáneamente la banda de 5 GHz en la web del router para completar su emparejamiento.</li>
      </ul>
      <div class="tip">Regla oficial de repetidores WiFi 6: la HGU Mitrastar WiFi 6 (GPT-2841GX2X2v10) trabaja <strong>exclusivamente</strong> en conjunto con el extensor <strong>Mitrastar HGW-500I4X4-Mv3 (BP3 WiFi 6)</strong>. En ningún modo (Access Point ni Repetidor) es compatible el BasePort blanco de generaciones anteriores.</div>` },
    { id: "domicilio", title: "Instalación en el domicilio", min: 7, html: `
      <p>En las <strong>instalaciones nuevas sin roseta óptica</strong>, el cable drop de acometida llega directamente hasta la HGU y termina en un conector de campo SC/APC. Este procedimiento oficial aplica para todo domicilio donde no exista una instalación previa en buen estado.</p>
      <p><strong>1. Procedimiento de acometida FTTH (Casas):</strong></p>
      <ol>
        <li><strong>Conexión desde CTO:</strong> se realiza bajo normativa vigente, reutilizando el drop óptico existente solo si se encuentra en perfectas condiciones mecánicas y de potencia.</li>
        <li><strong>Sujeción del drop:</strong> fijación exterior con tensores y soporte drop adecuados según norma.</li>
        <li><strong>Reserva exterior obligatoria:</strong> antes de ingresar el drop al domicilio (por ductos o a la vista en fachada o piece rack), se debe dejar una <strong>reserva de 2 metros con cable autosoportante</strong>, conformada en <strong>4 vueltas de unos 15 cm de diámetro</strong> para futuras mantenciones.</li>
        <li><strong>Reserva técnica en cambio de sentido:</strong> en el muro interior, antes del tramo final, se conformarán <strong>2 vueltas de reserva de 10 a 15 cm de diámetro</strong> en el cambio de sentido (horizontal a vertical), fijas al muro.</li>
        <li><strong>Última fijación:</strong> se realiza a una altura de <strong>30 cm del suelo</strong> mediante <strong>2 clavos aislados de 5 mm o 2 corchetes tipo U</strong>.</li>
        <li><strong>Drop libre y conector:</strong> posterior a la última fijación, se dejarán exactamente <strong>1,5 metros de drop libre</strong>, en cuyo extremo se arma el conector de campo SC/APC.</li>
        <li><strong>Tendido por ductos:</strong> el drop se tiende desde la caja de distribución más cercana al equipo, dejando obligatoriamente una reserva técnica de <strong>2 vueltas inmediatamente a la salida de la caja</strong>.</li>
      </ol>
      <p><strong>2. Procedimiento de acometida FTTA (Edificios de departamentos):</strong></p>
      <ul>
        <li>Antes de ingresar el cable interior óptico al departamento, se debe dejar una reserva técnica de <strong>2 metros en el shaft técnico</strong> (posterior a la CDOI), conformada en <strong>4 vueltas de unos 15 cm de diámetro</strong>.</li>
        <li>El cable óptico interior debe tenderse desde la caja de paso más próxima a la HGU, dejando obligatoriamente <strong>reserva técnica de 2 vueltas a la salida de la caja</strong> (criterio obligatorio que aplica también a clientes de libre competencia).</li>
      </ul>
      <p><strong>3. Terminación en la HGU:</strong></p>
      <p>El drop óptico libre ingresa por la tapa posterior del router atravesando su <strong>aliviador de tensión mecánico</strong>, garantizando que tirones accidentales no dañen el conector ni el puerto SC/APC interno.</p>
      <p><strong>4. Reutilización de roseta y jumper ópticos existentes:</strong></p>
      <p>Si el domicilio ya cuenta con roseta y jumper instalados, se reutilizan únicamente si cumplen la totalidad de las verificaciones técnicas:</p>
      <div class="spec"><table><tr><th>Elemento existente</th><th>Criterios obligatorios de verificación</th></tr>
      <tr><td>Roseta óptica existente</td><td>Fijada firmemente al muro con sus tornillos, sin fisuras ni deformaciones visibles y con el acoplador/guía SC/APC limpio y sin polvo</td></tr>
      <tr><td>Jumper óptico existente</td><td>Sin curvas cerradas, torceduras ni cortes en cubierta. Conectores SC/APC limpios con herramienta One-Click y potencia dentro del rango normativo (−18 a −24 dBm)</td></tr></table></div>
      <p><strong>Gestión en TOA:</strong> en la orden de trabajo se debe registrar seleccionando el botón <strong>«Reutilización de Materiales»</strong> y confirmar con OK. Si la roseta o el jumper no pasan la revisión, se retiran y se ejecuta el protocolo de conexión directa al HGU sin roseta.</p>
      <div class="tip">Las reservas de cable en fachada, shaft y salida de cajas son obligatorias por norma técnica: permiten realizar reparaciones y rehacer conectores en visitas futuras sin necesidad de recablear la acometida completa.</div>` }
  ]
},

{
  id: "cli", code: "CLI-104", color: "--f4", fiber: "Café", short: "Atención al cliente",
  title: "Atención al cliente y cierre de orden",
  summary: "La visita completa: presentación, prueba del servicio con el cliente y cierre con evidencias.",
  lessons: [
    { id: "video", title: "Destrezas de atención: video y manual", min: 10, html: `
      <div class="video"><iframe src="https://player.vimeo.com/video/1236835349?title=0&amp;byline=0&amp;portrait=0&amp;dnt=1" title="Video: destrezas de atención" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <p>Después revisa el manual, que resume las destrezas de atención que se esperan en cada visita:</p>
      <p><a class="btn primary" href="https://drive.google.com/file/d/1YLovqMoQ99QcmjjnSRa0nHnwVZDCOO7U/view" target="_blank" rel="noopener">Ver manual de destrezas de atención</a></p>
      <div class="tip">El manual se abre en una pestaña nueva. Cuando termines el video y el manual, presiona <strong>Completar y seguir</strong>.</div>` },
    { id: "visita", title: "Llegada y presentación", min: 5, html: `
      <ul>
        <li>Llama o escribe al cliente antes de llegar con una hora estimada.</li>
        <li>Preséntate con nombre, empresa y credencial visible. Usa cubre calzado dentro del hogar.</li>
        <li>Explica qué vas a hacer, cuánto se demora y dónde quedarán los equipos. Acuerda el recorrido del cable antes de perforar.</li>
      </ul>` },
    { id: "prueba", title: "Prueba del servicio con el cliente", min: 6, html: `
      <p>El trabajo termina cuando el cliente ve el servicio funcionando.</p>
      <ol>
        <li>Haz un test de velocidad por cable y por Wi-Fi en la habitación donde más se usa.</li>
        <li>Conecta al menos un dispositivo del cliente a la red Wi-Fi.</li>
        <li>Si hay TV, revisa canales y control remoto con el cliente.</li>
        <li>Explica cómo reiniciar el equipo y dónde llamar si hay problemas.</li>
      </ol>` },
    { id: "cierre", title: "Cierre con evidencias", min: 6, html: `
      <p>Una orden bien cerrada evita visitas repetidas y reclamos. Adjunta en la orden de trabajo:</p>
      <div class="spec"><table><tr><th>Evidencia</th><th>Detalle</th></tr>
      <tr><td>Foto de niveles</td><td>Medidor o diagnóstico del equipo con los valores visibles</td></tr>
      <tr><td>Foto del equipo instalado</td><td>Número de serie legible</td></tr>
      <tr><td>Foto de la acometida</td><td>Recorrido y fijaciones del cable</td></tr>
      <tr><td>Test de velocidad</td><td>Captura con fecha y hora</td></tr></table></div>
      <div class="tip">Deja el lugar limpio: restos de cable, polvo de perforación y embalajes se retiran.</div>` }
  ]
