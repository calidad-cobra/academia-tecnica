<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia Técnica Cobra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Lenguaje visual Grupo Cobra: tipografía grotesca liviana en mayúsculas con palabra clave en negrita, azul marino + azul medio,
   secciones gris claro, franja de íconos con divisores finos, esquinas rectas, acentos ámbar. Tema claro único, por decisión de marca. */
:root {
  color-scheme: light;
  --navy: #003575; --blue: #3c62ac; --bright: #0069c4; --amber: #f0a500;
  --bg: #f2f2f2; --white: #ffffff; --ink: #334155; --muted: #62646e; --line: #d9dbe0; --line-navy: #003575;
  --ok: #1f7a45; --ok-bg: #e2f1e8; --warn: #9a5b00; --warn-bg: #fdf1d8;
  --f1: #1f5fbf; --f2: #e0701a; --f3: #2c8a45; --f4: #7a4b2a;
  --font: "Helvetica Neue", "Hanken Grotesk", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font) }
img { max-width: 100% }
[hidden] { display: none !important }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px }
@media (max-width: 480px) { .wrap { padding-inline: 16px } }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.eyebrow { font: 600 12px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }

.sec-title { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 26px }
.sec-title h2 { font: 200 32px/1.1 var(--font); color: var(--blue); text-transform: uppercase; letter-spacing: .04em }
.sec-title h2 b { font-weight: 700; color: var(--navy) }
.sec-title p { margin: 0; color: var(--muted); max-width: 52ch }

/* ---- cabecera ---- */
header.top { background: var(--white); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; min-height: 72px; padding-block: 8px }
.brand { display: flex; align-items: center; gap: 18px; margin-right: auto; border: 0; background: none; padding: 0; text-align: left }
.brand img { height: 40px; width: auto; display: block }
.brand .sep { width: 1px; height: 34px; background: var(--line) }
.brand b { display: block; font: 300 18px/1.1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--blue) }
.brand b strong { font-weight: 700; color: var(--navy) }
nav.tabs { display: flex; gap: 4px 26px; flex-wrap: wrap }
nav.tabs button { border: 0; background: none; padding: 8px 0; font: 500 14px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent }
nav.tabs button:hover { color: var(--navy) }
nav.tabs button[aria-current="page"] { color: var(--navy); border-bottom-color: var(--amber) }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted) }
.who img { width: 28px; height: 28px; border-radius: 50% }
@media (max-width: 560px) { .brand img { height: 30px } .brand b { font-size: 14px } .brand .sep { height: 26px } }

/* ---- portada ---- */
.hero { position: relative; overflow: hidden; color: #ffffff; background: radial-gradient(120% 140% at 85% 10%, #0c4b9a 0%, #003575 45%, #00224d 100%) }
.hero .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 64%; background: url("Imagenes/fondo-portada.jpg?v=3") 55% 22% / cover no-repeat }
/* velo: navy sólido bajo el texto, se abre hacia la derecha para dejar ver al técnico */
.hero .shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, #00224d 0%, #003575 34%, rgba(0, 53, 117, .78) 44%, rgba(0, 53, 117, .2) 60%, rgba(0, 34, 77, 0) 76%),
              linear-gradient(0deg, rgba(0, 34, 77, .5) 0%, rgba(0, 34, 77, 0) 38%) }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 600px); gap: 34px; align-content: center; min-height: 560px; padding-block: 72px 64px }
@media (max-width: 860px) {
  .hero .photo { width: 100%; bottom: auto; height: 340px; background-position: 46% 30% }
  .hero .shade { background: linear-gradient(180deg, rgba(0, 34, 77, 0) 0%, rgba(0, 34, 77, 0) 150px, rgba(0, 53, 117, .9) 300px, #003575 340px) }
  .hero .wrap { min-height: 0; padding-block: 250px 52px }
}
.hero h1, .hero .lede { text-shadow: 0 1px 18px rgba(0, 20, 50, .35) }
.hero .eyebrow { color: #9fc2f0 }
.hero h1 { font: 200 clamp(38px, 5.6vw, 64px)/1.05 var(--font); letter-spacing: .01em; margin: 16px 0 18px }
.hero h1 b { font-weight: 700; display: block }
.hero .lede { color: #c9d7ee; font-size: 18px; font-weight: 300; max-width: 46ch; margin: 0 0 30px }
.cta { display: inline-flex; align-items: center; gap: 18px; border: 0; background: var(--amber); color: #1d1a12; padding: 14px 22px; border-radius: 2px; font: 600 16px/1.25 var(--font); text-align: left }
.cta:hover { background: #ffb61a }
.cta small { display: block; font: 600 11px/1.3 var(--font); letter-spacing: .12em; text-transform: uppercase; opacity: .75 }
.cta .arrow { font-size: 22px; line-height: 1 }
.gauge { border-top: 1px solid rgba(255, 255, 255, .25); padding-top: 28px; max-width: 520px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center }
@media (max-width: 420px) { .gauge { grid-template-columns: 1fr } }
.ring { width: 128px; height: 128px; position: relative }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center }
.ring .val b { font: 200 40px/1 var(--font); font-variant-numeric: tabular-nums }
.ring .val span { font: 600 10px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #9fc2f0 }
.kv { display: grid; gap: 0; margin: 0 }
.kv div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, .18); padding: 11px 0 }
.kv div:last-child { border-bottom: 0 }
.kv dt { color: #c9d7ee; font-size: 14px; font-weight: 300 }
.kv dd { margin: 0; font: 600 20px/1 var(--font); font-variant-numeric: tabular-nums }

/* ---- franja de íconos ---- */
.tiles { background: var(--white); border-bottom: 1px solid var(--line-navy) }
.tiles .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 0 }
.tile { border: 0; background: none; border-right: 1px solid var(--line-navy); padding: 26px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; position: relative }
.tile:last-child { border-right: 0 }
.tile:hover { background: #f7f8fa }
.tile svg { width: 40px; height: 40px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tile span { color: var(--navy); font-size: 15px }
.tile small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em }
.tile::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 3px; width: var(--p, 0%); background: var(--amber) }
@media (max-width: 700px) {
  .tiles .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .tile:nth-child(2) { border-right: 0 }
  .tile:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
}

/* ---- contenido ---- */
main { padding-block: 64px 88px }
.page { display: flex; flex-direction: column; gap: 72px }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative }
.route::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 23px; height: 1px; background: var(--navy); opacity: .35 }
.route li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-inline: 10px }
.route .node { width: 46px; height: 46px; border-radius: 50%; background: var(--white); border: 1px solid var(--navy); display: grid; place-items: center; font: 300 20px/1 var(--font); color: var(--navy); position: relative; z-index: 1; flex: none }
.route .node.done { background: var(--navy); color: #ffffff }
.route .node.now { border: 2px solid var(--amber); box-shadow: 0 0 0 6px rgba(240, 165, 0, .18) }
.route b { font-weight: 600; color: var(--navy); line-height: 1.3 }
.route small { display: block; font: 500 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px }
@media (max-width: 700px) {
  .route { grid-template-columns: 1fr; gap: 20px }
  .route::before { left: 23px; right: auto; top: 23px; bottom: 23px; width: 1px; height: auto }
  .route li { flex-direction: row; text-align: left; gap: 18px; padding: 0 }
}

.courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px }
@media (max-width: 760px) { .courses { grid-template-columns: 1fr } }
.card { background: var(--white); border: 0; border-top: 3px solid var(--fc); border-radius: 0; padding: 28px 30px 24px; text-align: left; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: box-shadow .2s ease }
.card:hover { box-shadow: 0 14px 30px -18px rgba(0, 53, 117, .45) }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.card h3 { font: 600 24px/1.2 var(--font); color: var(--navy) }
.card p { margin: 0; color: var(--muted); font-size: 15px }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted) }
.facts span::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--blue); margin-right: 8px; vertical-align: 2px }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line) }
.card .more { color: var(--blue); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap }
.bar { flex: 1; height: 4px; background: #e6e8ec; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--amber) }
.pct { font: 500 13px/1 var(--mono); color: var(--navy); font-variant-numeric: tabular-nums }
.code { font: 600 11.5px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 0 }
.code i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fc); margin-right: 8px; vertical-align: 0 }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; background: #eceef2; color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--ok-bg); color: var(--ok) }
.pill.go { background: var(--warn-bg); color: var(--warn) }
.banner { background: var(--warn-bg); color: var(--ink); padding: 12px 16px; font-size: 14.5px; margin: 0; border-left: 3px solid var(--amber) }

/* ---- curso ---- */
.crumb { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; align-self: start }
.course-hero { background: var(--white); border-top: 3px solid var(--fc); padding: 32px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 36px; align-items: end }
@media (max-width: 640px) { .course-hero { grid-template-columns: 1fr } }
.course-hero h1 { font: 200 clamp(32px, 4.6vw, 46px)/1.08 var(--font); color: var(--navy); margin: 12px 0 14px }
.course-hero .bigpct { text-align: right; display: flex; flex-direction: column; align-items: end; gap: 8px }
.course-hero .bigpct b { font: 200 56px/1 var(--font); color: var(--navy); font-variant-numeric: tabular-nums }
@media (max-width: 640px) { .course-hero .bigpct { align-items: start; text-align: left } }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr } }
.toc { background: var(--white); padding: 14px 0; display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 90px) }
@media (max-width: 860px) { .toc { position: static } }
.toc .eyebrow { padding: 4px 20px 10px }
.toc button { border: 0; background: none; text-align: left; padding: 12px 20px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent }
.toc button:hover { background: #f7f8fa }
.toc button[aria-current="true"] { border-left-color: var(--amber); background: #f7f8fa; color: var(--navy); font-weight: 600 }
.toc button small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); margin-top: 3px }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #b9c0cc; display: grid; place-items: center; font: 500 11px/1 var(--mono); color: var(--muted) }
.dot.done { background: var(--navy); border-color: var(--navy); color: #ffffff }
.dot.cur { border-color: var(--amber); color: var(--navy) }
.reader { background: var(--white); padding: clamp(24px, 4vw, 48px); min-width: 0 }
.reader h2 { font: 300 34px/1.15 var(--font); color: var(--navy); margin: 10px 0 24px }
.body { max-width: 68ch; font-size: 17px }
.body p, .body ul, .body ol { margin: 0 0 16px }
.body li { margin-bottom: 8px }
.body li::marker { color: var(--blue); font-weight: 600 }
.body strong { font-weight: 600; color: var(--navy) }
.spec { overflow-x: auto; margin: 6px 0 22px }
.spec table { border-collapse: collapse; font-size: 15px; width: 100%; min-width: 440px }
.spec th, .spec td { padding: 11px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line) }
.spec th { background: var(--navy); color: #ffffff; font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .1em }
.spec tr:nth-child(odd) td { background: #f7f8fa }
.spec td.n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy) }
.tip { background: var(--warn-bg); padding: 14px 18px; margin: 0 0 18px; font-size: 15.5px; border-left: 3px solid var(--amber) }
.tip::before { content: "Importante"; display: block; font: 700 11px/1.4 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--warn); margin-bottom: 2px }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line) }
.btn { border: 1px solid var(--navy); background: var(--white); color: var(--navy); padding: 12px 20px; border-radius: 2px; font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase }
.btn:hover { background: #f2f5fa }
.btn.primary { background: var(--navy); color: #ffffff }
.btn.primary:hover { background: #00428f }

/* ---- evaluación ---- */
.q { border: 1px solid var(--line); padding: 18px 20px; margin: 0 0 14px }
.q legend { font-weight: 600; padding: 0 6px; font-size: 17px; color: var(--navy) }
.q label { display: flex; gap: 12px; align-items: flex-start; padding: 8px; cursor: pointer }
.q label:hover { background: #f7f8fa }
.q label input { margin-top: 5px; accent-color: var(--navy) }
.q.right { border-color: var(--ok); border-left: 3px solid var(--ok) }
.q.wrong { border-color: var(--amber); border-left: 3px solid var(--amber) }
.q .why { font-size: 14px; color: var(--muted); margin: 8px 8px 0 }
.result { padding: 16px 20px; margin: 0 0 20px; font-weight: 600; border-left: 3px solid }
.result.ok { background: var(--ok-bg); color: var(--ok) }
.result.no { background: var(--warn-bg); color: var(--warn) }

/* ---- avance y certificados ---- */
.page-head h1 { font: 200 clamp(36px, 5vw, 54px)/1.05 var(--font); color: var(--navy); margin: 12px 0 10px }
.page-head p { color: var(--muted); margin: 0; max-width: 60ch; font-size: 17px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--white); border-bottom: 1px solid var(--navy) }
@media (max-width: 600px) { .stats { grid-template-columns: 1fr } }
.stat { padding: 24px 28px; border-right: 1px solid var(--line) }
.stat:last-child { border-right: 0 }
.stat b { display: block; font: 200 42px/1 var(--font); color: var(--navy); font-variant-numeric: tabular-nums; margin-bottom: 6px }
.stat span { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase }
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(310px, 100%), 1fr)); gap: 24px }
.cert { background: var(--white); padding: 10px; box-shadow: 0 16px 34px -22px rgba(0, 53, 117, .5) }
.cert .frame { border: 1px solid var(--navy); padding: 30px 26px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative }
.cert .frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--navy) 0 50%, var(--amber) 50% 100%) }
.cert img { height: 30px; width: auto; margin-bottom: 12px }
.cert .k { font: 600 10.5px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--blue) }
.cert .t { font: 300 26px/1.15 var(--font); color: var(--navy); margin: 8px 0 12px }
.cert .n { font: 600 19px/1.2 var(--font); color: var(--ink); border-bottom: 1px solid var(--line); padding: 4px 18px 8px; margin-bottom: 6px }
.cert .m { font: 500 12px/1.5 var(--mono); color: var(--muted); margin-bottom: 8px }
.panel { background: var(--white) }
.table { overflow-x: auto }
.table table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 15px }
.table th, .table td { padding: 13px 20px; border-bottom: 1px solid var(--line); text-align: left }
.table th { background: var(--navy); color: #ffffff; font: 600 11px/1.3 var(--font); text-transform: uppercase; letter-spacing: .1em }
.table td.n { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums }
.person { display: flex; align-items: center; gap: 8px }
.person img { width: 26px; height: 26px; border-radius: 50% }
.mini { display: inline-block; width: 48px; height: 4px; background: #e6e8ec; overflow: hidden; vertical-align: middle; margin-right: 8px }
.mini i { display: block; height: 100% }
.empty { background: var(--white); border: 1px dashed #b9c0cc; padding: 36px; text-align: center; color: var(--muted) }

/* ---- pie ---- */
footer.foot { background: var(--navy); color: #c9d7ee; font-size: 14px }
footer.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-block: 28px }
footer.foot img { height: 28px; width: auto; background: #ffffff; padding: 5px 10px; display: block }
footer.foot span { font-weight: 300; letter-spacing: .1em; text-transform: uppercase; font-size: 12px }
footer.foot .by { font-size: 10px }
footer.foot .by b, .hero .credit b { text-transform: none; font-weight: 700; color: #ffffff; letter-spacing: .08em }
.hero .credit { margin: 0; font: 300 10px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #9fc2f0 }

@media (prefers-reduced-motion: no-preference) {
  .bar i, .mini i, .tile::after { transition: width .5s ease }
  .ring circle.arc { transition: stroke-dashoffset .8s ease }
}
</style>
</head>
<body>
<header class="top">

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const course = id => COURSES.find(c => c.id === id);
const mins = c => c.lessons.reduce((a, l) => a + (l.min || 0), 0) + c.quiz.length * 2;
const icon = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>`;

function courseStats(p, c) {
  const done = (p.lessons?.[c.id] || []).filter(id => c.lessons.some(l => l.id === id)).length;
  const q = p.quiz?.[c.id];
  const passed = !!q?.passed;
  const pct = Math.round(((done + (passed ? 1 : 0)) / (c.lessons.length + 1)) * 100);
  return { done, total: c.lessons.length, passed, best: q?.best ?? null, pct, at: q?.at };
}
function overall(p) {
  const s = COURSES.map(c => courseStats(p, c));
  return { pct: Math.round(s.reduce((a, x) => a + x.pct, 0) / s.length), certs: s.filter(x => x.passed).length,
    lessons: s.reduce((a, x) => a + x.done, 0), totalLessons: s.reduce((a, x) => a + x.total, 0) };
}
function nextStep(p) {
  for (const c of COURSES) {
    const done = new Set(p.lessons?.[c.id] || []);
    const i = c.lessons.findIndex(l => !done.has(l.id));
    if (i !== -1) return { c, step: i, label: c.lessons[i].title };
    if (!p.quiz?.[c.id]?.passed) return { c, step: c.lessons.length, label: "Evaluación final" };
  }
  return null;
}
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString("es-CL", { day: "numeric", month: "long", year: "numeric" }); } catch { return ""; } }

let saving = Promise.resolve();
function save() {
  S.progress.updatedAt = new Date().toISOString();
  const body = JSON.parse(JSON.stringify(S.progress));
  try { localStorage.setItem(LS_KEY, JSON.stringify(body)); } catch {}
  if (!S.myRef || S.readOnly) return;
  saving = saving.then(() => S.myRef.set(body)).then(() => { S.saveError = false; }).catch(e => {
    if (e?.code === "invalid_argument") S.readOnly = true;
    S.saveError = true; render();
  });
}
function markLesson(cid, lid) {
  const arr = S.progress.lessons[cid] || [];
  if (arr.includes(lid)) return;
  S.progress.lessons = { ...S.progress.lessons, [cid]: [...arr, lid] };
  save();
}

function statusPill(st) {
  if (st.passed) return `<span class="pill ok">✓ Certificado</span>`;
  if (st.pct > 0) return `<span class="pill go">En curso</span>`;
  return `<span class="pill">Sin iniciar</span>`;
}
function banner() {
  if (S.readOnly) return `<p class="banner">Tu avance se guarda solo en este navegador. Para que tu supervisor lo vea, pide acceso de colaborador.</p>`;
  if (S.saveError) return `<p class="banner">No se pudo guardar el último avance. Se reintentará en tu próxima acción.</p>`;
  return "";
}

        <button class="card" style="--fc: var(${c.color})" data-open="${c.id}">
          <span class="row"><span class="code"><i></i>${c.code} · Fibra ${c.fiber.toLowerCase()}</span>${statusPill(st)}</span>
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.summary)}</p>
          <span class="facts"><span>${c.lessons.length} lecciones</span><span>${mins(c)} min</span><span>${c.quiz.length} preguntas</span></span>
          <span class="foot"><span class="bar" aria-hidden="true"><i style="width:${st.pct}%"></i></span><span class="pct">${st.pct}%</span><span class="more">${st.pct > 0 && !st.passed ? "Continuar" : "Ver curso"} →</span></span>
        </button>`; }).join("")}</div>
    </section>
  </div>`;
}

function viewCurso() {
  const c = course(S.courseId);
  const st = courseStats(S.progress, c);
  const doneSet = new Set(S.progress.lessons[c.id] || []);
  const isQuiz = S.step === c.lessons.length;
  const toc = `<p class="eyebrow">Contenido del curso</p>` + c.lessons.map((l, i) => { const d = doneSet.has(l.id), cur = S.step === i; return `
    <button data-step="${i}" aria-current="${cur}"><span class="dot ${d ? "done" : cur ? "cur" : ""}">${d ? "✓" : i + 1}</span><span>${esc(l.title)}<small>${l.min} min</small></span></button>`; }).join("")
    + `<button data-step="${c.lessons.length}" aria-current="${isQuiz}"><span class="dot ${st.passed ? "done" : isQuiz ? "cur" : ""}">${st.passed ? "✓" : "?"}</span><span>Evaluación final<small>${c.quiz.length} preguntas · aprueba con ${PASS * 100}%</small></span></button>`;

  let body;
  if (!isQuiz) {
    const l = c.lessons[S.step];
    const last = S.step === c.lessons.length - 1;
    body = `<p class="eyebrow">Lección ${S.step + 1} de ${c.lessons.length} · ${l.min} min</p><h2>${esc(l.title)}</h2>
      <div class="body">${l.html}</div>
      <div class="actions">
        ${S.step > 0 ? `<button class="btn" data-step="${S.step - 1}">← Anterior</button>` : ""}
        <button class="btn primary" data-complete="${l.id}">${last ? "Completar e ir a la evaluación →" : "Completar y seguir →"}</button>
      </div>`;
  } else {
    const ready = st.done === st.total;
    const r = S.lastResult;
    body = `<p class="eyebrow">Evaluación · aprueba con ${PASS * 100}%</p><h2>Evaluación final</h2>
      ${st.passed && !r ? `<p class="result ok">Aprobaste este curso con ${Math.round(st.best * 100)}%. Puedes repetir la evaluación para practicar.</p>` : ""}
      ${!ready ? `<p class="banner" style="margin-bottom:20px">Te faltan ${st.total - st.done} lección(es) por completar. Puedes rendir la evaluación igual, pero conviene terminarlas primero.</p>` : ""}
      ${r ? `<p class="result ${r.passed ? "ok" : "no"}">${r.passed ? "Aprobado" : "No aprobado"}: ${r.right} de ${r.total} correctas (${Math.round(r.score * 100)}%). ${r.passed ? "Tu certificado quedó en Mi avance." : "Revisa las explicaciones y vuelve a intentarlo."}</p>` : ""}
      <form id="quiz">${c.quiz.map((q, i) => {
        const chosen = S.answers[i];
        const cls = r ? (chosen === q.ok ? "right" : "wrong") : "";
        return `<fieldset class="q ${cls}"><legend>${i + 1}. ${esc(q.q)}</legend>
          ${q.a.map((a, j) => `<label><input type="radio" id="q${i}-${j}" name="q${i}" value="${j}" ${chosen === j ? "checked" : ""} ${r ? "disabled" : ""}><span>${esc(a)}</span></label>`).join("")}
          ${r ? `<p class="why">${chosen === q.ok ? "Correcto." : `Respuesta correcta: ${esc(q.a[q.ok])}.`} ${esc(q.why)}</p>` : ""}
        </fieldset>`; }).join("")}
        <div class="actions">${r ? `<button type="button" class="btn primary" data-retry>Intentar de nuevo</button><button type="button" class="btn" data-go="cursos">Volver al inicio</button>`
          : `<button type="submit" class="btn primary" id="quiz-submit">Enviar respuestas</button>`}</div>
      </form>`;
  }
  return `<div class="page" style="gap:24px; --fc: var(${c.color})">
    <button class="crumb" data-go="cursos">← Academia Técnica</button>
    <section class="course-hero">
      <div><p class="code"><i></i>${c.code} · Fibra ${c.fiber.toLowerCase()}</p><h1>${esc(c.title)}</h1>
      <p class="facts" style="margin:0"><span>${c.lessons.length} lecciones</span><span>${mins(c)} min</span><span>${st.done}/${st.total} completadas</span></p></div>
      <div class="bigpct"><b>${st.pct}%</b>${statusPill(st)}</div>
    </section>
    ${banner()}
    <div class="layout"><nav class="toc" aria-label="Contenido del curso">${toc}</nav><article class="reader">${body}</article></div>
  </div>`;
}

function viewAvance() {
  const name = S.me?.name || "";
  const o = overall(S.progress);
  const certs = COURSES.map(c => ({ c, st: courseStats(S.progress, c) })).filter(x => x.st.passed);
  return `<div class="page">
    <div class="page-head"><p class="eyebrow">Mi avance</p><h1>${name ? esc(name) : "Tu progreso"}</h1><p>Tus certificados y el avance en cada curso de la ruta.</p></div>
    ${banner()}
    <div class="stats">
      <div class="stat"><b>${o.pct}%</b><span>Avance total</span></div>
      <div class="stat"><b>${o.lessons}/${o.totalLessons}</b><span>Lecciones</span></div>
      <div class="stat"><b>${o.certs}/${COURSES.length}</b><span>Certificados</span></div>
    </div>
    <section>
      <div class="sec-title"><h2>Mis <b>certificados</b></h2></div>
      ${certs.length ? `<div class="certs">${certs.map(({ c, st }) => `
        <div class="cert"><div class="frame">
          <img src="${LOGO}" alt="Cobra">
          <span class="k">Certificado de aprobación</span>
          <span class="t">${esc(c.title)}</span>
          <span class="k">Otorgado a</span>
          <span class="n">${name ? esc(name) : "Técnico Cobra"}</span>
          <span class="m">${c.code} · Nota ${Math.round(st.best * 100)}% · ${fmtDate(st.at)}</span>
        </div></div>`).join("")}</div>`
        : `<div class="empty">Aún no tienes certificados. Completa un curso y aprueba su evaluación para obtener el primero.</div>`}
    </section>
    <section>
      <div class="sec-title"><h2>Avance por <b>curso</b></h2></div>
      <div class="panel table"><table><thead><tr><th>Curso</th><th>Lecciones</th><th>Mejor nota</th><th>Estado</th></tr></thead><tbody>
      ${COURSES.map(c => { const st = courseStats(S.progress, c); return `<tr><td><span class="code" style="--fc: var(${c.color})"><i></i>${c.code}</span>&nbsp; ${esc(c.title)}</td>
        <td class="n">${st.done}/${st.total}</td><td class="n">${st.best == null ? "—" : Math.round(st.best * 100) + "%"}</td><td>${statusPill(st)}</td></tr>`; }).join("")}
      </tbody></table></div>
    </section>
  </div>`;
}

let profiles = {};
function viewPanel() {
  const rows = S.team.map(t => ({ id: t.id, p: t.data, o: overall(t.data) })).sort((a, b) => b.o.pct - a.o.pct);
  const withCert = rows.filter(r => r.o.certs > 0).length;
  const avg = rows.length ? Math.round(rows.reduce((a, r) => a + r.o.pct, 0) / rows.length) : 0;
  return `<div class="page">
    <div class="page-head"><p class="eyebrow">Supervisión</p><h1>Avance del equipo</h1><p>Cada técnico aparece aquí cuando completa su primera lección. Se actualiza en vivo.</p></div>
    <div class="stats">
      <div class="stat"><b>${rows.length}</b><span>Técnicos activos</span></div>
      <div class="stat"><b>${avg}%</b><span>Avance promedio</span></div>
      <div class="stat"><b>${withCert}</b><span>Con certificado</span></div>
    </div>
    ${!S.teamLoaded ? `<div class="empty">Cargando avance del equipo…</div>` : rows.length === 0
      ? `<div class="empty">Todavía no hay técnicos con avance. Comparte la academia con tu equipo para que su progreso aparezca aquí.</div>`
      : `<div class="panel table"><table><thead><tr><th>Técnico</th>${COURSES.map(c => `<th>${c.code}</th>`).join("")}<th>Total</th><th>Última actividad</th></tr></thead><tbody>
      ${rows.map(r => { const pr = profiles[r.id]; return `<tr>
        <td><span class="person">${pr ? `<img alt="" src="${esc(pr.avatarUrl)}">` : ""}<span data-name="${esc(r.id)}"></span></span></td>
        ${COURSES.map(c => { const st = courseStats(r.p, c); return `<td class="n"><span class="mini"><i style="width:${st.pct}%;background:var(${c.color})"></i></span>${st.passed ? "✓" : st.pct + "%"}</td>`; }).join("")}
        <td class="n">${r.o.pct}%</td><td class="n">${r.p.updatedAt ? fmtDate(r.p.updatedAt) : "—"}</td></tr>`; }).join("")}
      </tbody></table></div>`}
  </div>`;
}

let strandsRaf = 0;
function drawStrands() {
  const cv = document.getElementById("strands"); if (!cv) return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lines = Array.from({ length: 12 }, (_, i) => ({ y: h * (0.2 + i * 0.06), a: 8 + (i % 5) * 6, f: 0.004 + (i % 4) * 0.0012, p: i * 0.7, hot: i % 4 === 1 }));
  let t = 0;
  cancelAnimationFrame(strandsRaf);
  const frame = () => {
    ctx.clearRect(0, 0, w, h);
    const x0 = w * 0.42;
    for (const l of lines) {
      ctx.beginPath();
      for (let x = x0; x <= w + 12; x += 12) {
        const y = l.y + Math.sin(x * l.f + l.p + t) * l.a + (x - x0) * 0.16;
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = l.hot ? "rgba(240,165,0,.28)" : "rgba(160,190,235,.13)";
      ctx.lineWidth = l.hot ? 1.6 : 1;
      ctx.stroke();
    }
    t += 0.005;
    if (!reduce && document.getElementById("strands") === cv) strandsRaf = requestAnimationFrame(frame);
  };
  frame();
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => {
    const v = b.dataset.view;
    b.setAttribute("aria-current", (S.view === v || (S.view === "curso" && v === "cursos")) ? "page" : "false");
  });
  document.getElementById("tab-panel").hidden = !S.canSupervise;
  const showHero = S.view === "cursos";
  $hero.innerHTML = showHero ? heroHTML() : "";
  $app.innerHTML = S.view === "curso" ? viewCurso() : S.view === "avance" ? viewAvance() : S.view === "panel" ? viewPanel() : viewCursos();
  $app.querySelectorAll("[data-name]").forEach(el => { el.textContent = profiles[el.dataset.name]?.name || "Técnico sin nombre"; });
  if (showHero) drawStrands(); else cancelAnimationFrame(strandsRaf);
}

function go(view) { S.view = view; S.lastResult = null; render(); window.scrollTo(0, 0); }
function openCourse(id, step) {
  S.courseId = id; const c = course(id); const done = new Set(S.progress.lessons[c.id] || []);
  const next = c.lessons.findIndex(l => !done.has(l.id));
  S.step = step != null ? step : (next === -1 ? c.lessons.length : next);
  S.answers = {}; go("curso");
}
document.querySelector("header.top").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b) go(b.dataset.view); });
function onClick(e) {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.open) return openCourse(t.dataset.open, t.dataset.stepTo != null ? +t.dataset.stepTo : null);
  if (t.dataset.step != null) { S.step = +t.dataset.step; S.answers = {}; S.lastResult = null; render(); $app.querySelector(".reader")?.scrollIntoView({ block: "start" }); return; }
  if (t.dataset.complete) { markLesson(S.courseId, t.dataset.complete); S.step++; S.answers = {}; render(); $app.querySelector(".reader")?.scrollIntoView({ block: "start" }); return; }
  if (t.hasAttribute("data-retry")) { S.answers = {}; S.lastResult = null; render(); return; }
}
$app.addEventListener("click", onClick);
$hero.addEventListener("click", onClick);
$app.addEventListener("change", e => { const m = e.target.name?.match(/^q(\d+)$/); if (m) S.answers[+m[1]] = +e.target.value; });
$app.addEventListener("submit", e => {
  e.preventDefault();
  const c = course(S.courseId);
  const missing = c.quiz.findIndex((_, i) => S.answers[i] == null);
  if (missing !== -1) { const f = $app.querySelectorAll(".q")[missing]; f.classList.add("wrong"); f.scrollIntoView({ block: "center" }); return; }
  const right = c.quiz.filter((q, i) => S.answers[i] === q.ok).length;
  const score = right / c.quiz.length, passed = score >= PASS;
  S.lastResult = { right, total: c.quiz.length, score, passed };
  const prev = S.progress.quiz[c.id] || {};
  if (score > (prev.best ?? -1) || (passed && !prev.passed)) {
    S.progress.quiz = { ...S.progress.quiz, [c.id]: { best: Math.max(score, prev.best ?? 0), passed: prev.passed || passed, at: (passed && !prev.passed) ? new Date().toISOString() : (prev.at || new Date().toISOString()) } };
    save();
  }
  render();
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === "cursos") drawStrands(); }, 150); });

try { const raw = localStorage.getItem(LS_KEY); if (raw) S.progress = { lessons: {}, quiz: {}, ...JSON.parse(raw) }; } catch {}
render();

(async () => {
  if (!window.claude?.use) return;
  const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
  S.user = user;
  if (user) {
    S.me = await user.me();
    const who = document.getElementById("who");
    if (S.me.name) { const img = document.createElement("img"); img.alt = ""; img.src = S.me.avatarUrl; const sp = document.createElement("span"); sp.textContent = S.me.name; who.replaceChildren(img, sp); }
    S.canSupervise = (await user.canEdit()) || (await user.isOwner());
  }
  if (db && S.me?.id) {
    S.db = db;
    S.myRef = db.doc("progreso/" + S.me.id);
    try {
      const snap = await S.myRef.get();
      if (snap.exists) {
        const remote = snap.data();
        S.progress = { lessons: { ...(remote.lessons || {}) }, quiz: { ...(remote.quiz || {}) }, updatedAt: remote.updatedAt || null };
        try { localStorage.setItem(LS_KEY, JSON.stringify(S.progress)); } catch {}
      } else if (Object.keys(S.progress.lessons).length || Object.keys(S.progress.quiz).length) {
        save();
      }
    } catch {}
    if ((await user.can("data.write")) === false) S.readOnly = true;
    if (S.canSupervise) {
      db.collection("progreso").onSnapshot(async snap => {
        S.team = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data() }));
        S.teamLoaded = true;
        profiles = await user.profiles(S.team.map(t => t.id));
        if (S.view === "panel") render();
      }, () => { S.teamLoaded = true; if (S.view === "panel") render(); });
    }
  }
  render();
})();
</script>
</body>
</html>
