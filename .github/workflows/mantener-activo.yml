# Consulta diaria a Supabase para que el proyecto gratuito no se pause por inactividad (7 días).
# No inicia sesión: llama a la validación pública de RUT, que toca la base de datos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 11:00 UTC (≈ 08:00 en Chile)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          respuesta=$(curl -sS --fail -X POST \
            "https://basrvliwcxltcpuxydfj.supabase.co/rest/v1/rpc/rut_valido" \
            -H "apikey: sb_publishable_-QkBHSY_lwHXwm_nLIfM_g_1ziV3Ih6" \
            -H "Content-Type: application/json" \
            -d '{"p_rut":"12.345.678-5"}')
          echo "Respuesta: $respuesta"
          test "$respuesta" = "true"
