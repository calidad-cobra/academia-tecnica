# Revisa las carpetas de Google Drive y actualiza comunicados.json (lista de archivos con fecha)
# para la sección Comunicados de la academia.
name: Actualizar comunicados

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para actualizar al instante
  push:
    paths: ["comunicados.carpetas.json", "scripts/actualizar-comunicados.mjs"]

permissions:
  contents: write

concurrency: actualizar-comunicados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer carpetas de Drive
        run: node scripts/actualizar-comunicados.mjs
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain comunicados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add comunicados.json
            git commit -m "Comunicados: lista actualizada desde Google Drive"
            git push
          else
            echo "Sin cambios."
          fi
